
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MethodLab Cloud - Accesso</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #1d2939;
      padding: 32px;
      border-radius: 16px;
    }
    h1 { margin-top: 0; }
    p { color: #b9c5d7; }
    input, button {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 12px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #718096; }
    button {
      background: #16a34a;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message { min-height: 22px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>MethodLab Cloud</h1>
    <p>Accesso riservato allo staff tecnico</p>

    <section id="login">
      <form id="loginForm">
        <input id="email" type="email"
          placeholder="Email" required autocomplete="email">
        <input id="password" type="password"
          placeholder="Password" required
          autocomplete="current-password">
        <button id="loginButton" type="submit">
          Accedi
        </button>
      </form>
    </section>

    <section id="account" hidden>
      <h2>Accesso effettuato</h2>
      <p id="userEmail"></p>
      <p>Configurazione dello staff in corso.</p>
      <button id="logoutButton">Esci</button>
    </section>

    <p id="message" role="status"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL =
      "https://vygyzpncwkwnwygifql.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_R3z-VS0YebzOSCPfxs6F6Q_HLYOIRLk";

    const message = document.getElementById("message");
    const login = document.getElementById("login");
    const account = document.getElementById("account");
    const loginButton = document.getElementById("loginButton");

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    function showUser(user) {
      login.hidden = !!user;
      account.hidden = !user;
      document.getElementById("userEmail").textContent =
        user ? user.email : "";
    }

    client.auth.getUser().then(({ data, error }) => {
      if (!error) showUser(data.user);
    });

    client.auth.onAuthStateChange((_event, session) => {
      showUser(session?.user || null);
    });

    document.getElementById("loginForm")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        loginButton.disabled = true;
        message.textContent = "Accesso in corso...";

        const email = document.getElementById("email").value;
        const password =
          document.getElementById("password").value;

        const { error } =
          await client.auth.signInWithPassword({
            email,
            password
          });

        message.textContent = error
          ? "Accesso non riuscito. Controlla email e password."
          : "";

        loginButton.disabled = false;
      });

    document.getElementById("logoutButton")
      .addEventListener("click", async () => {
        await client.auth.signOut();
        showUser(null);
        message.textContent = "";
      });
  </script>
</body>
</html>
