:hover{opacity:.72;filter:drop-shadow(0 2px 4px #122b4b55)}\n#monitoringPane .ml53-caption{color:#64788a;font-size:11px;margin:4px 0 0}\n#monitoringPane .ml-scatter-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px}\n#monitoringPane .panel{padding:clamp(16px,2vw,28px);margin-bottom:20px}\n#monitoringPane h2{font-size:clamp(21px,2.3vw,28px);line-height:1.2}\n#monitoringPane h3{margin-top:24px;font-size:18px}\n@media print{#monitoringPane .ml53-scatter{box-shadow:none;break-inside:avoid}}\n\u003c/style>\u003cstyle>\n#monitoringPane .ml-flow-step{font-size:11px;font-weight:800;letter-spacing:.11em;color:#147c86;margin-bottom:7px}\n#monitoringPane .ml-mon-progress{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 18px}\n#monitoringPane .ml-mon-progress span{background:#eaf4f4;border:1px solid #c8dddd;border-radius:8px;padding:9px 11px;font-size:12px;font-weight:700;color:#20565c}\n#monitoringPane #mlImportTop{border:2px solid #2c8588}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\n\u003cheader>\u003cdiv>\u003ch1>Progettazione campi e distanze\u003c/h1>\u003cdiv class=\"muted\">Strumento interattivo per lo staff tecnico · Funziona anche offline\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"alt\" id=\"save\">Salva progetto (.json)\u003c/button>\u003cbutton class=\"alt\" id=\"loadbtn\">Apri progetto\u003c/button>\u003cinput type=\"file\" id=\"load\" accept=\".json,application/json\" hidden>\u003cbutton class=\"alt\" id=\"csv\">Esporta CSV\u003c/button>\u003c/div>\u003c/header>\n\u003cnav class=\"navMain\">\u003cbutton id=\"tabTeam\">👥 Rosa\u003c/button>\u003cbutton id=\"tabAgenda\">📅 Agenda\u003c/button>\u003cbutton id=\"tabDraw\" class=\"on\">✏️ Disegna campo\u003c/button>\u003cbutton id=\"tabPlan\">📐 Progetta esercitazione\u003c/button>\u003cbutton id=\"tabMet\">🏃 Preparazione fisica\u003c/button>\u003cbutton id=\"tabStrength\">🏋️ Strength Training\u003c/button>\u003cbutton id=\"tabMonitoring\">📊 Monitoraggio\u003c/button>\u003cbutton id=\"tabSetpiece\">⚽ SET PIECE\u003c/button>\u003cbutton id=\"tabVideo\">🎬 VIDEO ANALYSIS\u003c/button>\u003c/nav>\u003cdiv id=\"originalArea\">\u003csection class=\"panel\">\u003ch2>1 · Campo di riferimento dell'allenatore\u003c/h2>\u003cdiv class=\"inline\">\u003clabel>Lunghezza (m)\u003cinput id=\"refL\" type=\"number\" min=\"10\" max=\"150\" step=\".1\" value=\"105\">\u003c/label>\u003clabel>Larghezza (m)\u003cinput id=\"refW\" type=\"number\" min=\"10\" max=\"100\" step=\".1\" value=\"68\">\u003c/label>\u003cdiv class=\"stat\">\u003csmall>Superficie di riferimento\u003c/small>\u003cb id=\"refArea\">7.140 m²\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Superficie base / 22 giocatori\u003c/small>\u003cb id=\"baseArea\">324,5 m²\u003c/b>\u003c/div>\u003c/div>\u003cp class=\"help muted\">Queste misure definiscono direttamente il campo verde interattivo: modificandole, il disegno si aggiorna in scala. Le esercitazioni progettate restano indipendenti.\u003c/p>\u003c/section>\n\u003csection class=\"panel\">\u003cdiv class=\"inline\" style=\"justify-content:space-between\">\u003ch2>2 · Le tue esercitazioni\u003c/h2>\u003cbutton id=\"addfield\">+ Nuovo campo\u003c/button>\u003c/div>\u003cdiv class=\"fields\" id=\"tabs\">\u003c/div>\u003cdiv class=\"inline\">\u003clabel>Nome esercitazione\u003cinput id=\"name\" type=\"text\">\u003c/label>\u003cbutton class=\"alt\" id=\"duplicate\">Duplica\u003c/button>\u003cbutton class=\"danger\" id=\"remove\">Elimina\u003c/button>\u003c/div>\u003c/section>\n\u003cdiv class=\"cols\">\u003cdiv>\u003csection class=\"panel\">\u003cdiv class=\"inline\" style=\"justify-content:space-between\">\u003ch2>3 · Campo interattivo\u003c/h2>\u003cspan class=\"muted help\" id=\"fieldSize\">\u003c/span>\u003c/div>\u003cdiv class=\"sectionTitle\">A · DISEGNA SUL CAMPO\u003c/div>\u003cp class=\"tagline\">Disegna più tracciati e più aree sullo stesso campo, mantenendo tutti gli elementi visibili.\u003c/p>\u003cdiv class=\"actions modebar\">\u003cbutton id=\"modePoints\" class=\"selected\">● Punti e percorso\u003c/button>\u003cbutton id=\"modeArea\">▭ Disegna area\u003c/button>\u003cbutton id=\"modeMove\">↔ Modifica area\u003c/button>\u003c/div>\u003csvg id=\"pitch\" style=\"touch-action:none;user-select:none\" viewBox=\"0 0 900 620\" aria-label=\"Campo interattivo con punti e area\">\u003cg id=\"background\">\u003c/g>\u003cg id=\"grid\">\u003c/g>\u003cg id=\"paint\">\u003c/g>\u003cg id=\"marks\">\u003c/g>\u003cg id=\"axis\">\u003c/g>\u003c/svg>\u003cp class=\"help muted\">Modalità punti: clicca per aggiungere un punto, trascinalo per spostarlo. Modalità disegna area: trascina dal primo angolo al secondo. Modifica diretta: clicca un rettangolo in qualsiasi modalità per selezionarlo, trascina il centro per spostarlo oppure trascina i punti sui bordi e sugli angoli per ridimensionarlo liberamente. Origine (0,0) in basso a sinistra. La scala segue le dimensioni del campo dell'esercitazione.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"alt\" id=\"ml58NewPath\">＋ Nuovo tracciato\u003c/button>\u003cbutton class=\"alt\" id=\"ml58NewArea\">＋ Nuova area\u003c/button>\u003cbutton class=\"alt\" id=\"ml58UndoObject\">↶ Rimuovi ultimo elemento\u003c/button>\u003cbutton class=\"alt\" id=\"undo\">Rimuovi ultimo punto\u003c/button>\u003cbutton class=\"alt\" id=\"clearpoints\">Svuota punti\u003c/button>\u003cbutton class=\"alt\" id=\"centerArea\" style=\"display:none\">Inserisci area calcolata nel disegno\u003c/button>\u003cbutton class=\"deleteStrong\" id=\"deleteArea\">✕ CANCELLA AREA\u003c/button>\u003cbutton class=\"deleteStrong\" id=\"deleteDrawing\">✕ CANCELLA TUTTO IL DISEGNO\u003c/button>\u003c/div>\u003cdiv id=\"message\" role=\"status\">\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003ch2>Punti e distanze\u003c/h2>\u003cdiv style=\"overflow:auto\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Punto\u003c/th>\u003cth>X (m)\u003c/th>\u003cth>Y (m)\u003c/th>\u003cth>Dal precedente\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"pointRows\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Distanza totale del percorso\u003c/small>\u003cb id=\"totalDistance\">0,00 m\u003c/b>\u003c/div>\u003cdiv class=\"drawMetrics\">\u003cstrong>TABELLA PARAMETRI DEL CAMPO DISEGNATO\u003c/strong>\u003cp class=\"help muted\">Inserisci i giocatori di movimento e indica se sono presenti 2 portieri: il calcolo si aggiorna quando disegni o ridimensioni l'area.\u003c/p>\u003cdiv class=\"formgrid\">\u003clabel>Giocatori di movimento\u003cinput id=\"drawPlayers\" type=\"number\" min=\"1\" max=\"60\" step=\"1\">\u003c/label>\u003clabel>Portieri presenti?\u003cselect id=\"drawKeepers\">\u003coption value=\"0\">NO\u003c/option>\u003coption value=\"1\">SÌ\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"stats\" style=\"margin-top:10px\">\u003cdiv class=\"stat\">\u003csmall>Dimensioni rettangolo disegnato\u003c/small>\u003cb id=\"drawAreaSize\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Superficie totale disegnata\u003c/small>\u003cb id=\"drawAreaTotal\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>m² per partecipante (portieri inclusi se presenti)\u003c/small>\u003cb id=\"drawPerPlayer\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>% del riferimento per giocatore\u003c/small>\u003cb id=\"drawPercentage\">—\u003c/b>\u003c/div>\u003c/div>\u003cp class=\"help muted\" id=\"drawCalcNote\">Disegna un rettangolo con “Disegna area” per attivare il calcolo. Con portieri presenti si aggiungono 2 partecipanti al divisore.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\n\u003c/div>\u003csection class=\"panel\" id=\"drawSavePanel\">\u003ch2>Inserisci esercitazioni nella seduta\u003c/h2>\u003clabel>Data seduta\u003cinput type=\"date\" id=\"drawSessionDate\">\u003c/label>\u003cp class=\"help muted\">Seleziona soltanto i campi da aggiungere all’agenda.\u003c/p>\u003cdiv id=\"drawSelection\">\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"drawSaveSelected\">Salva le selezionate per la data\u003c/button>\u003c/div>\u003cp id=\"drawSaveMsg\" class=\"help\">\u003c/p>\u003c/section>\u003c/div>\u003cdiv id=\"planPane\" class=\"newPane\">\n\u003csection class=\"panel\">\u003ch2>Esercitazioni della seduta\u003c/h2>\u003cdiv class=\"actions\">\u003cbutton id=\"planNew\">+ Nuova esercitazione\u003c/button>\u003cbutton class=\"alt\" id=\"planDuplicate\">Duplica esercitazione\u003c/button>\u003cbutton class=\"danger\" id=\"planRemove\">Elimina progetto\u003c/button>\u003c/div>\u003cdiv id=\"planSelection\">\u003c/div>\u003cp class=\"help muted\">Seleziona una scheda per modificarla. Spunta le esercitazioni da salvare nella seduta; le altre restano disponibili.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch2>Progetta esercitazione · parametri\u003c/h2>\u003cp class=\"muted\">Un solo pannello. Il campo interattivo della prima pagina rimane invariato.\u003c/p>\u003cdiv class=\"widegrid\">\n\u003clabel>Giocatori di movimento\u003cinput id=\"pPlayers\" type=\"number\" min=\"1\" max=\"60\">\u003c/label>\n\u003clabel>Spazio per giocatore (m²)\u003cinput id=\"vSpace\" type=\"number\" min=\"1\" max=\"3000\" step=\".1\">\u003c/label>\n\u003clabel>Spazio rispetto al riferimento (%)\u003cinput id=\"pPercent\" type=\"number\" min=\"1\" max=\"300\" step=\".1\">\u003c/label>\n\u003clabel>Lunghezza campo di riferimento (m)\u003cinput id=\"vRefL\" type=\"number\" readonly>\u003c/label>\u003clabel>Larghezza campo di riferimento (m)\u003cinput id=\"vRefW\" type=\"number\" readonly>\u003c/label>\n\u003clabel>Formato dell'esercitazione\u003cinput id=\"pFormat\" placeholder=\"Es. 7vs7\">\u003c/label>\n\u003clabel>Tipologia\u003cselect id=\"pType\">\u003coption value=\"S.S.G.\">S.S.G.\u003c/option>\u003coption value=\"M.S.G.\">M.S.G.\u003c/option>\u003coption value=\"L.S.G.\">L.S.G.\u003c/option>\u003coption value=\"Tecnica\">Tecnica\u003c/option>\u003coption value=\"Partita a tema\">Partita a tema\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>Portieri\u003cselect id=\"pKeepers\">\u003coption value=\"0\">No\u003c/option>\u003coption value=\"1\">Sì · 2 portieri\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>Jolly\u003cinput id=\"vJolly\" type=\"number\" min=\"0\" max=\"10\" value=\"0\">\u003c/label>\u003clabel>Inferiorità numerica\u003cselect id=\"vInferior\">\u003coption value=\"0\">No\u003c/option>\u003coption value=\"1\">Sì\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>Dove posizionare l'esercitazione?\u003cselect id=\"pPlacement\">\u003coption value=\"center\">Al centro\u003c/option>\u003coption value=\"left\">A sinistra\u003c/option>\u003coption value=\"right\">A destra\u003c/option>\u003coption value=\"top\">In alto\u003c/option>\u003coption value=\"bottom\">In basso\u003c/option>\u003coption value=\"topLeft\">Angolo in alto a sinistra\u003c/option>\u003coption value=\"topRight\">Angolo in alto a destra\u003c/option>\u003coption value=\"bottomLeft\">Angolo in basso a sinistra\u003c/option>\u003coption value=\"bottomRight\">Angolo in basso a destra\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>Data esercitazione\u003cinput id=\"pDate\" type=\"date\">\u003c/label>\u003clabel>Settimana\u003cselect id=\"vMidweek\">\u003coption value=\"0\">Una partita\u003c/option>\u003coption value=\"1\">Partita infrasettimanale\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>Giorno di riposo / recupero\u003cinput id=\"vRestDate\" type=\"date\">\u003c/label>\u003clabel>Data prossima partita\u003cinput id=\"vMatchDate\" type=\"date\">\u003c/label>\u003clabel>Data partita precedente (facoltativa)\u003cinput id=\"vPrevMatch\" type=\"date\">\u003c/label>\n\u003clabel>Collocazione rispetto alla partita\u003cinput id=\"pMD\" readonly placeholder=\"Imposta date\">\u003c/label>\n\u003c/div>\u003cp class=\"help muted\">Scegli dal menu Centro, Alto a sinistra, Basso a destra o un’altra posizione: il rettangolo viene collocato automaticamente. Le coordinate X/Y sono calcolate internamente. Le dimensioni di riferimento si modificano soltanto nella prima pagina. Jolly e inferiorità sono parametri separati.\u003c/p>\u003c/section>\n\u003csection class=\"panel\">\u003ch2>Dimensionamento e anteprima del campo\u003c/h2>\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003csmall>Superficie calcolata\u003c/small>\u003cb id=\"vArea\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Dimensioni esercitazione\u003c/small>\u003cb id=\"vSize\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>m² per giocatore (base)\u003c/small>\u003cb id=\"vM2\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Regola applicata\u003c/small>\u003cb id=\"vRule\">—\u003c/b>\u003c/div>\u003c/div>\u003cp id=\"vWarning\" class=\"help muted\">\u003c/p>\u003csvg id=\"pPreview\" class=\"previewPitch\" viewBox=\"0 0 660 430\" aria-label=\"Campo verde con esercitazione dimensionata\">\u003c/svg>\u003cp id=\"pPreviewInfo\" class=\"previewCaption\">\u003c/p>\u003c/section>\n\u003csection class=\"panel\">\u003ch2>Analisi e consigli sull’esercitazione\u003c/h2>\u003cp class=\"help muted\">Valutazione orientativa del formato e del calendario. Nessuna modifica automatica delle dimensioni e nessun coefficiente fisso di carico.\u003c/p>\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003csmall>Contesto del microciclo\u003c/small>\u003cb id=\"v16Context\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Orientamento suggerito\u003c/small>\u003cb id=\"v16Goal\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Valutazione\u003c/small>\u003cb id=\"v16Status\">—\u003c/b>\u003c/div>\u003c/div>\u003cp id=\"v16Why\" class=\"info\">\u003c/p>\u003cdiv class=\"info\">\u003cstrong>Indicazione operativa\u003c/strong>\u003cp id=\"v16Action\">\u003c/p>\u003c/div>\u003cdiv class=\"info\">\u003cstrong>Formato consigliato per questa giornata\u003c/strong>\u003cp id=\"v17Format\">\u003c/p>\u003cp id=\"v17Reason\" class=\"help muted\">\u003c/p>\u003c/div>\u003cp id=\"v16Limits\" class=\"help muted\">\u003c/p>\u003csection class=\"proposal\" style=\"margin-top:18px;padding:16px;border:1px solid #a7c5af;border-radius:12px\">\u003ch3>La nostra proposta alternativa\u003c/h3>\u003cp class=\"help muted\">Proposta organizzativa coerente con il calendario. Nessuna soglia fissa di m² per giocatore viene imposta automaticamente. Il progetto dell’allenatore resta invariato.\u003c/p>\u003cp id=\"v18Title\" class=\"info\">\u003c/p>\u003csvg id=\"v18Pitch\" class=\"previewPitch\" viewBox=\"0 0 660 430\" aria-label=\"Campo verde con la nostra esercitazione proposta\">\u003c/svg>\u003cp id=\"v18PitchInfo\" class=\"previewCaption\">\u003c/p>\u003cdiv class=\"scroll\">\u003ctable style=\"width:100%;border-collapse:collapse\">\u003ctbody id=\"v18Table\">\u003c/tbody>\u003c/table>\u003c/div>\u003cp id=\"v18Rationale\" class=\"help muted\">\u003c/p>\u003c/section>\u003cp class=\"help muted\">Il campo progettato resta quello originale. Se non esiste una base sufficiente per indicare nuove misure, il programma suggerisce solo come organizzare o integrare il lavoro.\u003c/p>\u003c/section>\n\u003cdiv style=\"display:none\" aria-hidden=\"true\">\u003cinput id=\"planLoadGoal\" value=\"metabolico\">\u003cinput id=\"planLoadPct\" value=\"100\">\u003cspan id=\"planLoadArea\">\u003c/span>\u003cspan id=\"planLoadSize\">\u003c/span>\u003csvg id=\"vLoadPreview\">\u003c/svg>\u003cspan id=\"vLoadInfo\">\u003c/span>\u003cspan id=\"vAdvice\">\u003c/span>\u003cinput id=\"pGoal\">\u003cinput id=\"pCognitive\" type=\"checkbox\">\u003cinput id=\"pJolly\" type=\"checkbox\">\u003cinput id=\"players\">\u003cinput id=\"percent\">\u003cinput id=\"fieldL\">\u003cinput id=\"fieldW\">\u003cinput id=\"keepers\">\u003cinput id=\"weekday\">\u003cinput id=\"objective\">\u003cinput id=\"placement\">\u003cinput id=\"posX\">\u003cinput id=\"posY\">\u003cbutton id=\"applyAuto\">\u003c/button>\u003csvg id=\"sidePreview\">\u003c/svg>\u003cspan id=\"sidePreviewInfo\">\u003c/span>\u003cspan id=\"perPlayer\">\u003c/span>\u003cspan id=\"requestedArea\">\u003c/span>\u003cspan id=\"suggestL\">\u003c/span>\u003cspan id=\"suggestW\">\u003c/span>\u003cspan id=\"manualSize\">\u003c/span>\u003cspan id=\"manualArea\">\u003c/span>\u003cspan id=\"manualPer\">\u003c/span>\u003cspan id=\"manualPct\">\u003c/span>\u003cspan id=\"pArea\">\u003c/span>\u003cspan id=\"pSize\">\u003c/span>\u003cspan id=\"pDetails\">\u003c/span>\u003cspan id=\"pAdvice\">\u003c/span>\u003csvg id=\"pAdvicePreview\">\u003c/svg>\u003cspan id=\"pAdvicePreviewInfo\">\u003c/span>\u003cbutton id=\"pApply\">\u003c/button>\u003cbutton id=\"pUseAdvice\">\u003c/button>\u003cspan id=\"planLoadFocus\">\u003c/span>\u003cspan id=\"planLoadBase\">\u003c/span>\u003c/div>\n\u003csection class=\"panel\">\u003ch2>Salva nella seduta\u003c/h2>\u003cp class=\"help muted\">Ogni esercitazione mantiene i propri parametri. La data è quella indicata nella scheda, oppure puoi indicare una data comune qui sotto.\u003c/p>\u003clabel>Data comune (facoltativa)\u003cinput id=\"planSessionDate\" type=\"date\">\u003c/label>\u003cdiv class=\"actions\">\u003cbutton id=\"planSaveSelected\">Salva le selezionate per la data\u003c/button>\u003c/div>\u003cp id=\"planSaveMsg\" class=\"help\">\u003c/p>\u003c/section>\u003c/div>\n\u003cdiv id=\"videoPane\" class=\"newPane\">\n\u003csection class=\"panel\">\n\u003ch2>🎬 VIDEO ANALYSIS · Analisi manuale partita\u003c/h2>\n\u003cp class=\"help muted\">Carica un video locale, registra le fasi e gli eventi con un clic, crea clip tattiche e salva l'analisi. Il video rimane sul computer: i dati di analisi sono esportabili in JSON e CSV.\u003c/p>\n\u003cdiv class=\"widegrid\">\n\u003clabel>Nome partita\u003cinput id=\"vaMatch\" placeholder=\"Es. Bologna - Avversario\">\u003c/label>\n\u003clabel>Video partita\u003cinput id=\"vaFile\" type=\"file\" accept=\"video/*,.mp4,.webm,.mov\">\u003c/label>\n\u003clabel>Velocità\u003cselect id=\"vaSpeed\">\u003coption value=\".5\">0,5×\u003c/option>\u003coption value=\"1\" selected>1×\u003c/option>\u003coption value=\"1.5\">1,5×\u003c/option>\u003coption value=\"2\">2×\u003c/option>\u003c/select>\u003c/label>\n\u003c/div>\n\u003cvideo id=\"vaPlayer\" controls playsinline preload=\"metadata\" style=\"width:100%;max-height:560px;background:#0c1822;border-radius:12px;margin:12px 0\">\u003c/video>\n\u003cdiv class=\"actions\">\u003cbutton id=\"vaBack\">−5 s\u003c/button>\u003cbutton id=\"vaForward\">+5 s\u003c/button>\u003cbutton id=\"vaPlay\">▶ / ⏸\u003c/button>\u003cspan id=\"vaClock\" style=\"font-weight:700\">00:00 / 00:00\u003c/span>\u003c/div>\n\u003ch3>Fasi di gioco · cronometro manuale\u003c/h3>\n\u003cp class=\"help muted\">Seleziona la fase corrente quando cambia. Le durate vengono calcolate dagli intervalli annotati, non riconosciute automaticamente. Premi «Chiudi fase» alla fine della registrazione.\u003c/p>\n\u003cdiv class=\"actions\">\u003cbutton id=\"vaPoss\" style=\"background:#147e5c\">🟢 Possesso\u003c/button>\u003cbutton id=\"vaNon\" style=\"background:#bd7830\">🟠 Non possesso\u003c/button>\u003cbutton id=\"vaStop\" style=\"background:#64748b\">⚪ Palla inattiva\u003c/button>\u003cbutton id=\"vaClose\" class=\"alt\">Chiudi fase\u003c/button>\u003cbutton id=\"vaUndo\" class=\"alt\">↶ Annulla ultimo tag\u003c/button>\u003c/div>\n\u003cdiv id=\"vaStats\" class=\"widegrid\" style=\"margin:14px 0\">\u003c/div>\n\u003ch3>Eventi tecnici\u003c/h3>\n\u003cdiv class=\"widegrid\">\u003clabel>Giocatore (facoltativo)\u003cinput id=\"vaPlayerName\" placeholder=\"Nome / numero\">\u003c/label>\u003clabel>Tipo evento\u003cselect id=\"vaEvent\">\u003coption>Passaggio\u003c/option>\u003coption>Passaggio riuscito\u003c/option>\u003coption>Passaggio errato\u003c/option>\u003coption>Recupero\u003c/option>\u003coption>Perdita\u003c/option>\u003coption>Tiro\u003c/option>\u003coption>Tiro in porta\u003c/option>\u003coption>Cross\u003c/option>\u003coption>Duello\u003c/option>\u003coption>Fallo\u003c/option>\u003coption>Calcio d'angolo\u003c/option>\u003coption>Fuorigioco\u003c/option>\u003coption>Altro\u003c/option>\u003c/select>\u003c/label>\u003clabel>Nota\u003cinput id=\"vaNote\" placeholder=\"Dettaglio tattico\">\u003c/label>\u003c/div>\n\u003cdiv class=\"actions\">\u003cbutton id=\"vaTag\">+ Registra evento al secondo corrente\u003c/button>\u003c/div>\n\u003ch3>Tagli tattici\u003c/h3>\n\u003cdiv class=\"widegrid\">\u003clabel>Categoria\u003cselect id=\"vaCategory\">\u003coption>Costruzione dal basso\u003c/option>\u003coption>Costruzione blocco medio\u003c/option>\u003coption>Costruzione blocco alto\u003c/option>\u003coption>Pressione alta\u003c/option>\u003coption>Difesa blocco basso\u003c/option>\u003coption>Transizione positiva\u003c/option>\u003coption>Transizione negativa\u003c/option>\u003coption>Calcio piazzato\u003c/option>\u003coption>Occasione da gol\u003c/option>\u003coption>Altro\u003c/option>\u003c/select>\u003c/label>\u003clabel>Titolo clip\u003cinput id=\"vaClipName\" placeholder=\"Descrizione azione\">\u003c/label>\u003clabel>Intervallo selezionato\u003cspan id=\"vaRange\" style=\"display:block;font-weight:700\">Inizio — · Fine —\u003c/span>\u003c/label>\u003c/div>\n\u003cdiv class=\"actions\">\u003cbutton id=\"vaIn\">[ Segna inizio\u003c/button>\u003cbutton id=\"vaOut\">] Segna fine\u003c/button>\u003cbutton id=\"vaAddClip\">✂ Salva taglio\u003c/button>\u003cbutton id=\"vaClearRange\" class=\"alt\">Azzera intervallo\u003c/button>\u003c/div>\n\u003cp class=\"help muted\">I tagli vengono riprodotti direttamente nel lettore. L'esportazione MP4 non è ancora disponibile: esporta il progetto con i timecode.\u003c/p>\n\u003ch3>Timeline e registrazioni\u003c/h3>\u003cdiv id=\"vaTimeline\" style=\"height:24px;background:#d7dfe7;border-radius:8px;overflow:hidden;display:flex\">\u003c/div>\n\u003cdiv id=\"vaRows\" style=\"margin-top:12px\">\u003c/div>\n\u003cdiv class=\"actions\">\u003cbutton id=\"vaExport\">Esporta progetto JSON\u003c/button>\u003cbutton id=\"vaCsv\" class=\"alt\">Esporta eventi CSV\u003c/button>\u003cbutton id=\"vaImport\" class=\"alt\">Importa progetto JSON\u003c/button>\u003cinput id=\"vaImportFile\" type=\"file\" accept=\".json,application/json\" hidden>\u003cbutton id=\"vaReset\" class=\"danger\">Nuova analisi\u003c/button>\u003c/div>\n\u003cp id=\"vaStatus\" class=\"help muted\">Pronto per caricare il video.\u003c/p>\n\u003c/section>\u003c/div>\n\u003cdiv id=\"setpiecePane\" class=\"newPane\">\n\u003csection class=\"panel\">\u003ch2>⚽ SET PIECE · Calci piazzati a favore\u003c/h2>\u003cp class=\"help muted\">Crea schemi offensivi animati: posiziona i giocatori, aggiungi le traiettorie e riproduci i movimenti simultanei.\u003c/p>\n\u003cdiv class=\"widegrid\">\n\u003clabel>Nome schema\u003cinput id=\"spName\" value=\"Nuovo schema\">\u003c/label>\n\u003clabel>Situazione\u003cselect id=\"spSituation\">\u003coption value=\"corner\">Calcio d'angolo\u003c/option>\u003coption value=\"freekick\">Punizione laterale\u003c/option>\u003coption value=\"freekickfront\">Punizione centrale\u003c/option>\u003coption value=\"buildlow\">Costruzione blocco basso\u003c/option>\u003coption value=\"buildmid\">Costruzione blocco medio\u003c/option>\u003coption value=\"buildhigh\">Costruzione blocco alto\u003c/option>\u003coption value=\"highpress\">Pressione alta\u003c/option>\u003coption value=\"defendlow\">Difesa blocco basso\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>Vista campo\u003cselect id=\"spView\">\u003coption value=\"third\">Terzo offensivo\u003c/option>\u003coption value=\"half\">Metà campo\u003c/option>\u003coption value=\"full\">Campo intero\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>Strumento\u003cselect id=\"spTool\">\u003coption value=\"select\">Seleziona / sposta elemento\u003c/option>\u003coption value=\"delete\">Cancella elemento (clicca sul campo)\u003c/option>\u003coption value=\"attacker\">Aggiungi attaccante\u003c/option>\u003coption value=\"defender\">Aggiungi difensore\u003c/option>\u003coption value=\"ball\">⚽ Posiziona / sposta pallone\u003c/option>\u003coption value=\"route\">Disegna movimento (seleziona giocatore, poi clicca destinazione)\u003c/option>\u003coption value=\"pass\">Disegna passaggio (clicca destinazione pallone)\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>Durata animazione (secondi)\u003cinput id=\"spDuration\" type=\"number\" min=\"1\" max=\"30\" step=\".5\" value=\"5\">\u003c/label>\n\u003clabel>Velocità\u003cselect id=\"spSpeed\">\u003coption value=\".5\">0,5×\u003c/option>\u003coption value=\"1\" selected>1×\u003c/option>\u003coption value=\"1.5\">1,5×\u003c/option>\u003coption value=\"2\">2×\u003c/option>\u003c/select>\u003c/label>\n\u003c/div>\n\u003cdiv class=\"actions\">\u003cbutton id=\"spPlay\">▶ Riproduci\u003c/button>\u003cbutton id=\"spPause\" class=\"alt\">⏸ Pausa\u003c/button>\u003cbutton id=\"spReset\" class=\"alt\">↺ Torna all'inizio\u003c/button>\u003cbutton id=\"spUndo\" class=\"alt\">↶ Annulla ultimo movimento\u003c/button>\u003cbutton id=\"spDeleteSelected\" class=\"alt\" type=\"button\">🗑 Elimina selezionato\u003c/button>\u003cbutton id=\"spClearRoutes\" class=\"alt\" type=\"button\">Cancella movimenti selezionato\u003c/button>\u003cbutton id=\"spSave\">Salva schema\u003c/button>\u003cbutton id=\"spExport\" class=\"alt\">Esporta JSON\u003c/button>\u003cbutton id=\"spImport\" class=\"alt\">Importa JSON\u003c/button>\u003cinput id=\"spFile\" type=\"file\" accept=\".json,application/json\" hidden>\u003c/div>\n\u003clabel>Avanzamento \u003cinput id=\"spProgress\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\" style=\"width:100%\">\u003c/label>\n\u003cdiv class=\"scroll\">\u003csvg id=\"spPitch\" viewBox=\"0 0 1000 650\" style=\"width:100%;min-width:580px;max-height:700px;background:#236c45;border-radius:12px;touch-action:none;cursor:crosshair\" aria-label=\"Editor animato dei calci piazzati\">\u003c/svg>\u003c/div>\n\u003cp id=\"spBallStatus\" class=\"info\">⚽ Pallone: posizione iniziale sul campo. Seleziona “Posiziona / sposta pallone” e clicca oppure trascina.\u003c/p>\u003cp id=\"spInfo\" class=\"info\">Seleziona uno strumento e clicca sul campo. Per creare un movimento, seleziona prima un giocatore.\u003c/p>\n\u003ch3>Schemi salvati\u003c/h3>\u003cdiv class=\"widegrid\">\u003clabel>Apri schema\u003cselect id=\"spSaved\">\u003c/select>\u003c/label>\u003cdiv class=\"actions\">\u003cbutton id=\"spLoad\" class=\"alt\">Apri\u003c/button>\u003cbutton id=\"spDelete\" class=\"danger\">Elimina\u003c/button>\u003c/div>\u003c/div>\n\u003c/section>\u003c/div>\u003cdiv id=\"agendaPane\" class=\"newPane\">\u003csection class=\"panel\">\u003ch2>Agenda annuale · calendario gare e settimana tipo\u003c/h2>\u003cdiv class=\"widegrid\">\u003clabel>Inizio stagione\u003cinput type=\"date\" id=\"aStart\">\u003c/label>\u003clabel>Fine stagione\u003cinput type=\"date\" id=\"aEnd\">\u003c/label>\u003clabel>Giorni abituali di allenamento\u003cselect id=\"aTraining\">\u003coption value=\"1,2,3,4,5\">Lun–Ven\u003c/option>\u003coption value=\"1,2,3,4,5,6\">Lun–Sab\u003c/option>\u003coption value=\"2,3,4,5\">Mar–Ven\u003c/option>\u003coption value=\"1,2,3,4,5,6,0\">Tutti i giorni\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"aGenerate\">Genera stagione dalla settimana tipo\u003c/button>\u003cbutton class=\"alt\" id=\"aPrev\">◀ Mese precedente\u003c/button>\u003cbutton class=\"alt\" id=\"aNext\">Mese successivo ▶\u003c/button>\u003c/div>\u003cdiv class=\"warning\">Gli MD vengono calcolati dalle date delle partite. In settimane con gare ravvicinate, le sedute sono segnalate per revisione; le modifiche manuali non vengono sovrascritte.\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003ch2 id=\"aMonthTitle\">Calendario\u003c/h2>\u003cdiv class=\"scroll\">\u003cdiv class=\"calendar\" id=\"aCalendar\">\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003ch2>Inserisci partita o seduta\u003c/h2>\u003cdiv class=\"widegrid\">\u003clabel>Data\u003cinput id=\"aDate\" type=\"date\">\u003c/label>\u003clabel>Tipo\u003cselect id=\"aKind\">\u003coption value=\"match\">Partita\u003c/option>\u003coption value=\"session\">Allenamento\u003c/option>\u003c/select>\u003c/label>\u003clabel>Descrizione\u003cinput id=\"aLabel\" placeholder=\"Es. Campionato / Possesso 4vs4\">\u003c/label>\u003clabel>Obiettivo\u003cselect id=\"aGoal\">\u003coption value=\"metabolico\">Metabolico\u003c/option>\u003coption value=\"neuromuscolare\">Neuromuscolare\u003c/option>\u003coption value=\"modello prestativo\">Modello prestativo\u003c/option>\u003coption value=\"recupero\">Recupero\u003c/option>\u003c/select>\u003c/label>\u003clabel>Orario\u003cinput id=\"aTime\" type=\"time\">\u003c/label>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"aAdd\">Aggiungi all'agenda\u003c/button>\u003cbutton class=\"alt\" id=\"aCancelEdit\" style=\"display:none\">Annulla modifica\u003c/button>\u003cbutton class=\"danger\" id=\"aDeleteEdit\" style=\"display:none\">Elimina evento\u003c/button>\u003c/div>\u003cp id=\"aMsg\" class=\"help\">\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch2>Esercitazioni della seduta selezionata\u003c/h2>\u003cp class=\"help muted\">Le esercitazioni salvate dalle altre due pagine sono associate alla loro data. Quando aggiungi un Allenamento in agenda, compaiono automaticamente qui.\u003c/p>\u003clabel>Seleziona data\u003cinput id=\"agendaDetailDate\" type=\"date\">\u003c/label>\u003cdiv id=\"agendaExerciseList\">\u003c/div>\u003c/section>\u003c/div>\u003cdiv id=\"metPane\" class=\"newPane\">\n\u003csection class=\"panel\">\u003ch2>1 · Calcolo lavoro: tempo inserito o percorso disegnato\u003c/h2>\u003cp class=\"muted\">Scegli il calcolo dal tempo (senza disegnare) oppure dal percorso disegnato. I due metodi utilizzano gli stessi parametri di velocità e carico.\u003c/p>\n\u003ch3>Parametri per il calcolo dei tempi\u003c/h3>\u003cdiv class=\"widegrid\">\u003clabel>Nome del lavoro\u003cinput id=\"mName\" value=\"Intermittente\">\u003c/label>\u003clabel>VAM (km/h)\u003cinput id=\"mVam\" type=\"number\" value=\"20\" min=\"1\" max=\"40\" step=\"0.1\">\u003c/label>\u003clabel>VMA / velocità massima per ASR (km/h)\u003cinput id=\"mVmax\" type=\"number\" value=\"30\" min=\"1\" max=\"45\" step=\"0.1\">\u003c/label>\u003clabel>% VAM\u003cinput id=\"mPctVam\" type=\"number\" value=\"100\" min=\"1\" max=\"200\" step=\"1\">\u003c/label>\u003clabel>% ASR\u003cinput id=\"mPctAsr\" type=\"number\" value=\"50\" min=\"0\" max=\"150\" step=\"1\">\u003c/label>\u003cdiv style=\"grid-column:1/-1;display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:8px 0\">\u003cstrong>Calcola velocità con:\u003c/strong>\u003clabel style=\"display:flex;align-items:center;gap:6px\">\u003cinput type=\"radio\" name=\"mIntensityModeRadio\" value=\"vam\" checked style=\"width:auto\"> % VAM\u003c/label>\u003clabel style=\"display:flex;align-items:center;gap:6px\">\u003cinput type=\"radio\" name=\"mIntensityModeRadio\" value=\"asr\" style=\"width:auto\"> % ASR\u003c/label>\u003cinput id=\"mIntensityMode\" type=\"hidden\" value=\"vam\">\u003cinput id=\"mPct\" type=\"hidden\" value=\"100\">\u003c/div>\u003clabel>Ripetizioni\u003cinput id=\"mReps\" type=\"number\" value=\"2\" min=\"1\">\u003c/label>\u003clabel>Serie\u003cinput id=\"mSets\" type=\"number\" value=\"2\" min=\"1\">\u003c/label>\u003clabel>Recupero tra ripetizioni (s)\u003cinput id=\"mRecovery\" type=\"number\" value=\"50\" min=\"0\">\u003c/label>\u003clabel>Recupero tra serie (s)\u003cinput id=\"mSeriesRecovery\" type=\"number\" value=\"180\" min=\"0\">\u003c/label>\u003clabel>Data\u003cinput id=\"mDate\" type=\"date\">\u003c/label>\u003clabel>Obiettivo\u003cinput id=\"mGoal\" value=\"Metabolico\">\u003c/label>\u003c/div>\n\u003cdiv class=\"widegrid\" style=\"margin:12px 0\">\u003cdiv style=\"grid-column:1/-1;display:flex;align-items:center;gap:20px;flex-wrap:wrap\">\u003cstrong>Calcola distanza e tempi da:\u003c/strong>\u003clabel style=\"display:flex;align-items:center;gap:6px\">\u003cinput type=\"radio\" name=\"mCalcSource\" value=\"time\" checked style=\"width:auto\"> Tempo inserito\u003c/label>\u003clabel style=\"display:flex;align-items:center;gap:6px\">\u003cinput type=\"radio\" name=\"mCalcSource\" value=\"route\" style=\"width:auto\"> Percorso disegnato\u003c/label>\u003c/div>\u003clabel id=\"mManualSecondsWrap\">Tempo per ripetizione (secondi)\u003cinput id=\"mManualSeconds\" type=\"number\" min=\"0.1\" step=\"0.1\" value=\"20\">\u003c/label>\u003c/div>\u003cp id=\"mDrawStatus\" class=\"help\" role=\"status\" style=\"padding:12px 14px;border:1px solid #d6e3d8;border-radius:9px;background:#f2f6f2;font-weight:600\">Inserisci il tempo per ripetizione oppure seleziona il percorso disegnato.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton type=\"button\" id=\"mDrawQuick\">✏️ Disegna il percorso per il calcolo\u003c/button>\u003c/div>\u003cdiv class=\"stats\" id=\"mDrawWorkSummary\">\u003cdiv class=\"stat\">\u003csmall>Metri per ripetizione\u003c/small>\u003cb id=\"mDrawPerRep\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Metri totali di lavoro\u003c/small>\u003cb id=\"mDrawWorkMeters\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Tempo per ripetizione\u003c/small>\u003cb id=\"mDrawRepDuration\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Tempo effettivo di lavoro\u003c/small>\u003cb id=\"mDrawActiveDuration\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Tempo totale di lavoro (recuperi inclusi)\u003c/small>\u003cb id=\"mDrawWorkDuration\">—\u003c/b>\u003c/div>\u003c/div>\u003cp class=\"help muted\">Il tempo totale comprende il tempo di lavoro (con correzione COD quando si usa il percorso disegnato), i recuperi tra ripetizioni e quelli tra serie. Non include pause aggiuntive non inserite.\u003c/p>\n\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003csmall>ASR (Vmax − VAM)\u003c/small>\u003cb id=\"mAsr\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Velocità obiettivo\u003c/small>\u003cb id=\"mSpeed\">—\u003c/b>\u003c/div>\u003c/div>\u003cp id=\"mAsrNote\" class=\"help muted\">\u003c/p>\u003cp class=\"help muted\">I parametri di velocità e carico sono utilizzati anche dalla tabella del lavoro programmato sottostante.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton id=\"mDraw\">Disegna / modifica il percorso sul campo\u003c/button>\u003c/div>\n\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003csmall>Lunghezza tracciato\u003c/small>\u003cb id=\"mDrawn\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Cambi di direzione\u003c/small>\u003cb id=\"mDrawTurns\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Tempo stimato senza COD\u003c/small>\u003cb id=\"mDrawTime\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Tempo stimato con correzione COD\u003c/small>\u003cb id=\"mDrawCodTime\">—\u003c/b>\u003c/div>\u003c/div>\n\u003cdiv id=\"mDrawAngles\" class=\"help\">\u003c/div>\u003ch3>Tempi per ciascun segmento del percorso\u003c/h3>\u003cdiv id=\"mDrawSegments\" class=\"scroll\">\u003c/div>\u003cp class=\"help muted\">Gli angoli indicano la deviazione di traiettoria (0° = rettilineo, 180° = inversione). I punti perfettamente allineati non sono contati come cambi di direzione.\u003c/p>\u003c/section>\n\u003csection class=\"panel\">\u003ch2>2 · Tabella lavoro programmato\u003c/h2>\u003cp class=\"muted\">Definisci il percorso senza disegnarlo manualmente. Il tracciato schematico e la tabella si aggiornano mentre modifichi i parametri.\u003c/p>\n\u003cdiv class=\"widegrid\">\u003cinput id=\"mDistance\" type=\"hidden\" value=\"250\">\u003clabel>Tempo di lavoro per ripetizione (s)\u003cinput id=\"mSeconds\" type=\"number\" value=\"20\" min=\"1\">\u003c/label>\u003clabel>Riduzione velocità per cambio (%)\u003cinput id=\"mCodReduction\" type=\"number\" value=\"8\" min=\"0\" max=\"99\" step=\"0.5\">\u003c/label>\u003clabel>Numero cambi di direzione\u003cinput id=\"mTurnCount\" type=\"number\" value=\"3\" min=\"0\" max=\"20\" step=\"1\">\u003c/label>\u003clabel>Angoli dei cambi di direzione (°)\u003cinput id=\"mTurnAngles\" value=\"90, 90, 180\" placeholder=\"Es. 90, 45, 180\">\u003c/label>\u003clabel>Direzione dei cambi (D/S)\u003cinput id=\"mTurnDirections\" value=\"D, S, D\" placeholder=\"Es. D, S, D\">\u003c/label>\u003c/div>\n\u003cp class=\"help muted\">Inserisci un angolo per ogni cambio, separando i valori con virgole. Gli angoli ammessi sono da 1° a 180°. La durata viene divisa equamente tra i segmenti; metri e tempi sono calcolati automaticamente. Il disegno è schematico, non una planimetria in scala del campo.\u003c/p>\n\u003cdiv id=\"mTurnValidation\" class=\"help\">\u003c/div>\n\u003cdiv style=\"overflow:auto;border:1px solid #b9d8c4;border-radius:10px;background:#edf6ef;padding:10px;margin:12px 0\">\u003csvg id=\"mProgramSvg\" viewBox=\"0 0 740 320\" style=\"display:block;width:100%;max-height:380px\" role=\"img\" aria-label=\"Tracciato programmato con cambi di direzione e angoli\">\u003c/svg>\u003c/div>\n\u003ch3>Metri e tempi calcolati per segmento\u003c/h3>\u003cdiv id=\"mProgramSegments\" class=\"scroll\">\u003c/div>\u003cdiv class=\"stats\" style=\"display:none\" aria-hidden=\"true\">\u003cdiv class=\"stat\">\u003csmall>Velocità iniziale\u003c/small>\u003cb id=\"mProgramBaseSpeed\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Velocità corretta dopo i COD\u003c/small>\u003cb id=\"mProgramSpeed\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Tempo stimato per ripetizione\u003c/small>\u003cb id=\"mCodTime\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Volume totale\u003c/small>\u003cb id=\"mVolume\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Durata totale stimata\u003c/small>\u003cb id=\"mDuration\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Distanza teorica nel tempo obiettivo\u003c/small>\u003cb id=\"mMeters\">—\u003c/b>\u003c/div>\u003c/div>\n\u003cp class=\"help muted\">\u003cstrong>Modello modificabile:\u003c/strong> la riduzione proposta è 8% per cambio, ma puoi modificarla nel parametro qui sopra. Ogni cambio riduce la velocità rispetto al tratto precedente. È una convenzione di calcolo, non una relazione scientifica validata per ogni angolo. La stima divide il tempo di lavoro in parti uguali tra i segmenti e ne calcola le distanze; non descrive accelerazioni e frenate reali.\u003c/p>\n\u003cdiv class=\"actions\">\u003cbutton class=\"alt\" id=\"mSave\">Associa scheda fisica al campo attuale\u003c/button>\u003cbutton class=\"alt\" id=\"mToAgenda\">Inserisci lavoro in agenda\u003c/button>\u003c/div>\u003cdiv id=\"mSaved\" class=\"info\">Nessun lavoro fisico associato.\u003c/div>\u003c/section>\n\u003c/div>\u003cdiv id=\"teamPane\" class=\"newPane\">\n\u003csection class=\"panel\">\u003ch2>La mia squadra · rosa aggiornata\u003c/h2>\u003cp class=\"help muted\">Elenco completo degli atleti e disponibilità, sempre in primo piano. Clicca sul nome di un giocatore per aprire la sua scheda completa e lo storico.\u003c/p>\u003cdiv class=\"widegrid\">\u003clabel>Cerca atleta\u003cinput id=\"playerSearch\" placeholder=\"Nome, cognome o ruolo\">\u003c/label>\u003clabel>Filtro disponibilità\u003cselect id=\"playerFilter\">\u003coption value=\"all\">Tutti\u003c/option>\u003coption value=\"injured\">Infortunati\u003c/option>\u003coption value=\"available\">Non infortunati\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv id=\"teamStats\" class=\"info\">\u003c/div>\u003cdiv class=\"scroll\" id=\"teamList\">\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"teamDetailPanel\" style=\"display:none;border:2px solid #438b62\">\u003cdiv class=\"actions\" style=\"justify-content:space-between;align-items:center\">\u003ch2 id=\"teamDetailTitle\">Minuti giocati e infortuni\u003c/h2>\u003cbutton class=\"alt\" id=\"teamDetailClose\" type=\"button\">Chiudi scheda ✕\u003c/button>\u003c/div>\u003cdiv id=\"teamPlayerSummary\" class=\"info\">\u003c/div>\u003cp class=\"help muted\">Seleziona un atleta nella rosa. Registra i minuti per singola partita e gli infortuni con data di inizio e rientro; le registrazioni sono modificabili ed eliminabili.\u003c/p>\u003cdiv id=\"teamDetailEmpty\">Seleziona un atleta per gestire i dati.\u003c/div>\u003cdiv id=\"teamDetailBody\" style=\"display:none\">\n\u003ch3>Minuti giocati\u003c/h3>\u003cdiv class=\"widegrid\">\u003clabel>Data partita\u003cinput id=\"minutesDate\" type=\"date\">\u003c/label>\u003clabel>Minuti\u003cinput id=\"minutesValue\" type=\"number\" min=\"0\" max=\"150\" step=\"1\">\u003c/label>\u003clabel>Note / avversario\u003cinput id=\"minutesNote\" placeholder=\"Facoltativo\">\u003c/label>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"minutesSave\">Salva minuti\u003c/button>\u003cbutton class=\"alt\" id=\"minutesCancel\">Annulla modifica\u003c/button>\u003c/div>\u003cdiv class=\"scroll\" id=\"minutesList\">\u003c/div>\n\u003ch3>Storico infortuni\u003c/h3>\u003cdiv class=\"widegrid\">\u003clabel>Tipologia\u003cinput id=\"injuryType\" placeholder=\"Es. lesione muscolare, distorsione\">\u003c/label>\u003clabel>Data infortunio\u003cinput id=\"injuryStart\" type=\"date\">\u003c/label>\u003clabel>Data rientro\u003cinput id=\"injuryReturn\" type=\"date\">\u003c/label>\u003clabel>Note\u003cinput id=\"injuryNotes\" placeholder=\"Facoltativo\">\u003c/label>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"injurySave\">Salva infortunio\u003c/button>\u003cbutton class=\"alt\" id=\"injuryCancel\">Annulla modifica\u003c/button>\u003c/div>\u003cdiv class=\"scroll\" id=\"injuryList\">\u003c/div>\n\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003ch2>Aggiungi o modifica un atleta\u003c/h2>\u003cp class=\"help muted\">Anagrafica, caratteristiche fisiche, minuti giocati e storico infortuni. I dati sono salvati localmente su questo dispositivo, insieme al progetto.\u003c/p>\n\u003clabel>Nome della squadra\u003cinput id=\"teamName\" placeholder=\"Es. Prima squadra\">\u003c/label>\n\u003ch3 id=\"teamEditorTitle\">Nuovo atleta\u003c/h3>\u003cdiv class=\"widegrid\">\n\u003clabel>Nome\u003cinput id=\"playerFirst\" placeholder=\"Nome\">\u003c/label>\u003clabel>Cognome\u003cinput id=\"playerLast\" placeholder=\"Cognome\">\u003c/label>\n\u003clabel>Altezza (cm)\u003cinput id=\"playerHeight\" type=\"number\" min=\"80\" max=\"250\" step=\".1\">\u003c/label>\u003clabel>Peso (kg)\u003cinput id=\"playerWeight\" type=\"number\" min=\"20\" max=\"250\" step=\".1\">\u003c/label>\n\u003clabel>Ruolo\u003cselect id=\"playerRole\">\u003coption>Portiere\u003c/option>\u003coption>Difensore centrale\u003c/option>\u003coption>Terzino destro\u003c/option>\u003coption>Terzino sinistro\u003c/option>\u003coption>Esterno\u003c/option>\u003coption>Centrocampista\u003c/option>\u003coption>Mediano\u003c/option>\u003coption>Trequartista\u003c/option>\u003coption>Attaccante\u003c/option>\u003coption>Altro\u003c/option>\u003c/select>\u003c/label>\n\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"playerSave\">Salva atleta\u003c/button>\u003cbutton class=\"alt\" id=\"playerCancel\">Nuovo / annulla modifica\u003c/button>\u003c/div>\u003cp id=\"playerMsg\" class=\"help\">\u003c/p>\u003c/section>\n\u003c/div>\u003cdiv id=\"monitoringPane\" class=\"newPane\">\n\u003csection class=\"panel\" id=\"mlImportTop\">\u003cdiv class=\"ml-flow-step\">FASE 1 · CARICAMENTO DATI\u003c/div>\u003ch2>Importa file Excel · punto di partenza\u003c/h2>\u003cp class=\"help muted\">Compila le quattro tabelle vuote MethodLab, senza cambiare le intestazioni, e salva il file .xlsx. Selezionalo qui e premi «Aggiorna dati»: i quattro archivi vengono sostituiti senza duplicazioni. Elaborazione locale nel browser Chrome/Edge recente, senza connessione internet.\u003c/p>\n\u003cdiv class=\"widegrid\">\u003clabel>File Excel unico (.xlsx)\u003cinput type=\"file\" id=\"monWorkbookFile\" accept=\".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\">\u003c/label>\u003clabel>Decremento significativo serie (%)\u003cinput id=\"monSeriesThreshold\" type=\"number\" value=\"10\" min=\"1\" max=\"50\" step=\"1\">\u003c/label>\u003c/div>\n\u003cdiv class=\"actions\">\u003cbutton id=\"monWorkbookUpdate\">Aggiorna dati da Excel\u003c/button>\u003cbutton class=\"alt\" id=\"monExport\">Esporta backup monitoraggio (JSON)\u003c/button>\u003cbutton class=\"danger\" id=\"monClear\">Svuota dati monitoraggio\u003c/button>\u003c/div>\u003cdiv id=\"monImportStatus\" class=\"info\">Nessun dato importato.\u003c/div>\u003c/section>\n\u003cnav class=\"ml-mon-progress\" aria-label=\"Percorso di analisi\">\u003cspan>1 · Importa file\u003c/span>\u003cspan>2 · Seduta\u003c/span>\u003cspan>3 · Esercitazioni\u003c/span>\u003cspan>4 · Serie\u003c/span>\u003cspan>5 · Giocatori\u003c/span>\u003cspan>6 · PDF\u003c/span>\u003c/nav>\u003csection class=\"ml48-switch\" aria-label=\"Selezione area monitoraggio\">\u003cdiv class=\"ml48-switch-head\">\u003cdiv>\u003cdiv class=\"ml48-eyebrow\">METHODLAB / MONITORAGGIO\u003c/div>\u003ch2>Seleziona il tipo di analisi\u003c/h2>\u003c/div>\u003cdiv class=\"ml48-switch-buttons\">\u003cbutton type=\"button\" id=\"ml48Training\" class=\"ml48-nav active\" aria-pressed=\"true\">TRAINING\u003c/button>\u003cbutton type=\"button\" id=\"ml48Match\" class=\"ml48-nav\" aria-pressed=\"false\">MATCH\u003c/button>\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"ml48-mode-panel\" data-ml48-mode=\"match\">\u003csection class=\"panel\">\u003ch2>Modello prestativo individuale · migliori partite\u003c/h2>\u003cdiv class=\"widegrid\">\u003clabel>Giocatore\u003cselect id=\"monPlayer\">\u003c/select>\u003c/label>\u003clabel>Migliori partite per indicatore\u003cselect id=\"monBest\">\u003coption value=\"3\">Migliori 3\u003c/option>\u003coption value=\"4\">Migliori 4\u003c/option>\u003coption value=\"5\" selected>Migliori 5\u003c/option>\u003c/select>\u003c/label>\u003clabel>Minuti minimi per partita\u003cinput id=\"monMin\" type=\"number\" min=\"1\" max=\"120\" value=\"60\">\u003c/label>\u003c/div>\u003cp class=\"help muted\">Ogni indicatore seleziona autonomamente le migliori partite sulla base del valore al minuto. Il modello totale osservato è la media dei totali delle partite selezionate. La stima a 90' è una proiezione matematica, non un dato osservato.\u003c/p>\u003cdiv id=\"monModel\">\u003c/div>\u003cdiv id=\"mlIndividualAuto\">\u003c/div>\u003c/section>\n\u003c/div>\u003cdiv class=\"ml48-mode-panel\" data-ml48-mode=\"training\">\u003csection class=\"panel\" id=\"mlSeduta\">\u003cdiv class=\"ml-flow-step\">FASE 2 · SEDUTA E RIEPILOGO\u003c/div>\u003ch2>Riepilogo della seduta · Training\u003c/h2>\u003cp class=\"help\">Dopo l’importazione scegli la settimana: le analisi successive utilizzano i dati caricati.\u003c/p>\u003cdiv id=\"ml65WeeklyPicker\" class=\"ml65-picker\">\u003ch3>1 · Seleziona i parametri per l’analisi settimanale\u003c/h3>\u003cdiv id=\"ml65WeeklyOptions\">\u003c/div>\u003c/div>\u003cdiv class=\"widegrid\">\u003clabel>Settimana\u003cselect id=\"monWeek\" aria-label=\"Seleziona settimana\">\u003c/select>\u003csmall id=\"mlWeekSelectStatus\" class=\"help\" style=\"display:block;margin-top:5px\">\u003c/small>\u003c/label>\u003c/div>\u003cdiv id=\"monWeekly\">\u003c/div>\u003ch3>Rapporto WEEK / MATCH e variazione % rispetto alle settimane precedenti\u003c/h3>\u003cdiv id=\"monWeeklyInsights\">\u003c/div>\u003cdiv id=\"mlComparePanel\">\u003c/div>\u003cdiv id=\"monWeeklyDrills\" style=\"display:none\">\u003c/div>\u003cdiv id=\"mlExerciseLinks\" style=\"display:none\">\u003c/div>\u003cdiv id=\"mlScatterPanel\" style=\"display:none\">\u003c/div>\u003c/section>\n\u003c/div>\u003cdiv class=\"ml48-mode-panel\" data-ml48-mode=\"training\">\u003csection class=\"panel\" id=\"mlEsercitazioni\">\u003cdiv class=\"ml-flow-step\">FASE 3 · DAL GENERALE AL DETTAGLIO\u003c/div>\u003ch2>Esercitazioni → serie → giocatori\u003c/h2>\u003cp class=\"help\">Esplora le esercitazioni e le relative serie, poi confronta gli atleti usando i dati disponibili nel file.\u003c/p>\u003cdiv id=\"monExercises\">\u003c/div>\u003c/section>\u003c/div>\u003cdiv class=\"ml48-mode-panel\" data-ml48-mode=\"training\">\u003csection class=\"panel\" id=\"mlPdfTrainingPanel\">\n\u003ch2>Esporta report PDF · TRAINING\u003c/h2>\n\u003cp class=\"help\">Tre report: sintesi giornaliera, riepilogo completo di fine settimana e report partita. Usa la stampa del browser → Salva come PDF.\u003c/p>\n\u003cdiv class=\"widegrid\">\u003clabel>Settimana per report\u003cselect id=\"mlPdfWeek\">\u003c/select>\u003c/label>\u003clabel>Giornata per sintesi\u003cselect id=\"mlPdfDay\">\u003c/select>\u003c/label>\u003c/div>\n\u003cdiv class=\"widegrid\">\u003clabel>Esercitazione svolta (facoltativa)\u003cselect id=\"mlPdfExercise\">\u003coption value=\"\">Nessuna selezione\u003c/option>\u003c/select>\u003c/label>\u003clabel>Serie dell’esercitazione\u003cselect id=\"mlPdfSeries\">\u003coption value=\"\">Tutte le serie\u003c/option>\u003c/select>\u003c/label>\u003clabel>Oppure inserisci una descrizione\u003cinput id=\"mlPdfExerciseCustom\" placeholder=\"Es. Possesso 6 vs 6\">\u003c/label>\u003c/div>\u003csection class=\"panel\" style=\"margin:12px 0;padding:14px;border:1px solid #c9dce6;border-radius:10px\">\n\u003ch3>Associazione manuale · esercitazione alla giornata\u003c/h3>\n\u003cp class=\"help\">Seleziona settimana, giornata ed esercitazione sopra; scegli le serie e salva. Le associazioni sono conservate in questo browser.\u003c/p>\n\u003cdiv>\u003cstrong>Seleziona più esercitazioni da associare alla giornata\u003c/strong>\u003cdiv id=\"mlPdfMultiExercises\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px;max-height:190px;overflow:auto;margin:8px 0\">\u003c/div>\u003c/div>\u003clabel style=\"display:block;margin:10px 0\">Gruppo serie dal foglio SERIE\u003cselect id=\"mlPdfSeriesExercise\">\u003coption value=\"\">Seleziona il nome ESERCIZIO presente nel foglio SERIE\u003c/option>\u003c/select>\u003c/label>\u003cdiv id=\"mlPdfLinkSeries\" style=\"display:flex;flex-wrap:wrap;gap:12px;margin:10px 0\">\u003c/div>\n\u003cdiv class=\"actions\">\u003cbutton type=\"button\" id=\"mlPdfLinkSave\">Associa le esercitazioni selezionate\u003c/button>\u003cbutton type=\"button\" id=\"mlPdfLinkRemove\">Rimuovi associazione\u003c/button>\u003c/div>\n\u003cdiv id=\"mlPdfLinkStatus\" class=\"help\">\u003c/div>\u003cdiv id=\"mlPdfLinkList\" class=\"help\">\u003c/div>\n\u003c/section>\n\u003ch3>Parametri GPS da includere\u003c/h3>\u003cdiv id=\"mlPdfMetrics\" class=\"widegrid\">\u003c/div>\n\u003cdiv class=\"actions\">\u003cbutton type=\"button\" id=\"mlPdfDailyBtn\">PDF sintetico giornaliero\u003c/button>\u003cbutton type=\"button\" id=\"mlPdfWeeklyBtn\">PDF dettagliato fine settimana\u003c/button>\u003c/div>\n\u003cp class=\"help\" id=\"mlPdfTrainingStatus\">Importa il file Excel e scegli settimana e giornata.\u003c/p>\n\u003c/section>\u003c/div>\n\u003cdiv class=\"ml48-mode-panel\" data-ml48-mode=\"match\">\u003csection class=\"panel\">\u003ch2>Report partita\u003c/h2>\u003cdiv class=\"widegrid\">\u003clabel>Partita\u003cselect id=\"monMatch\">\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"ml49-player-control\">\u003clabel>Giocatore da analizzare \u003cselect id=\"ml49MatchPlayer\">\u003c/select>\u003c/label>\u003cp class=\"help\">Seleziona un atleta per confrontare la partita con modello medio e massimo individuale.\u003c/p>\u003c/div>\u003cdiv id=\"ml49MatchBars\">\u003c/div>\u003cdiv class=\"actions\">\u003cbutton type=\"button\" id=\"mlPdfMatchBtn\">Esporta report MATCH\u003c/button>\u003c/div>\u003cp id=\"mlPdfMatchStatus\" class=\"help\">\u003c/p>\u003cdiv id=\"monMatchReport\">\u003c/div>\u003cdiv id=\"monMatchInsights\">\u003c/div>\u003c/section>\n\u003c/div>\u003cdiv class=\"ml48-mode-panel\" data-ml48-mode=\"match\">\u003csection class=\"panel\">\u003ch2>Esportazione PDF · report dell’area selezionata\u003c/h2>\u003cp class=\"help muted\">Crea un report completo con grafici, tabelle e osservazioni tecniche. Il browser apre la stampa: scegli «Salva come PDF». I dati restano sul dispositivo.\u003c/p>\n\u003cdiv class=\"widegrid\">\u003clabel>Tipo report\u003cselect id=\"pdfReportType\">\u003coption value=\"match\">Report partita\u003c/option>\u003coption value=\"week\">Report settimana di lavoro\u003c/option>\u003coption value=\"player\">Report individuale\u003c/option>\u003coption value=\"team\">Report squadra e ruoli\u003c/option>\u003coption value=\"exercise\">Report esercitazioni\u003c/option>\u003coption value=\"series\">Report serie\u003c/option>\u003c/select>\u003c/label>\u003clabel style=\"display:none\" aria-hidden=\"true\">Formato\u003cselect id=\"pdfReportFormat\">\u003coption value=\"full\">Completo\u003c/option>\u003coption value=\"short\">Sintetico\u003c/option>\u003c/select>\u003c/label>\u003clabel>Partite di riferimento\u003cselect id=\"pdfCompareMode\">\u003coption value=\"manual\">Selezione manuale\u003c/option>\u003coption value=\"last3\">Ultime 3\u003c/option>\u003coption value=\"last5\">Ultime 5\u003c/option>\u003c/select>\u003c/label>\u003clabel>Livello\u003cselect id=\"pdfScope\">\u003coption value=\"team\">Squadra\u003c/option>\u003coption value=\"role\">Ruolo\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n\u003cdiv class=\"widegrid\">\u003clabel>Settimane di confronto (Ctrl/Cmd per selezioni multiple)\u003cselect id=\"pdfCompareWeeks\" multiple size=\"5\">\u003c/select>\u003c/label>\u003clabel>Atleta per report individuale\u003cselect id=\"pdfIndividualPlayer\">\u003c/select>\u003c/label>\u003c/div>\u003cp class=\"help\">Seleziona le partite di confronto (Ctrl/Cmd per selezioni multiple):\u003c/p>\u003cselect id=\"pdfCompareMatches\" multiple size=\"5\" style=\"width:100%;max-width:620px\">\u003c/select>\n\u003cdiv class=\"actions\">\u003clabel>\u003cinput type=\"checkbox\" id=\"pdfCharts\" checked> Grafici\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" id=\"pdfTables\" checked> Tabelle\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" id=\"pdfNotes\" checked> Osservazioni tecniche\u003c/label>\u003c/div>\n\u003clabel>Osservazioni dello staff (modificabili)\u003ctextarea id=\"pdfStaffNotes\" rows=\"4\" placeholder=\"Annotazioni tecniche, contesto partita, considerazioni dello staff...\" style=\"width:100%\">\u003c/textarea>\u003c/label>\n\u003cdiv class=\"actions\">\u003cbutton id=\"pdfGenerateMatch\">🖨️ Esporta report MATCH / Salva PDF\u003c/button>\u003c/div>\u003cp id=\"pdfStatus\" class=\"help muted\">\u003c/p>\u003c/section>\n\u003c/div>\u003c/div>\u003cdiv id=\"strengthPane\" class=\"newPane\">\u003csection class=\"panel\" style=\"background:#173e32;color:white\">\u003ch2>METHODLAB · STRENGTH TRAINING\u003c/h2>\u003cdiv class=\"actions\">\u003cbutton id=\"stMain\">STRENGTH TRAINING\u003c/button>\u003cbutton id=\"stOff\" class=\"alt\">OFF SEASON\u003c/button>\u003c/div>\u003c/section>\u003cdiv id=\"stOffPane\" hidden>\u003csection class=\"panel\">\u003ch2>OFF SEASON · Programmazione individuale\u003c/h2>\u003cp class=\"warning\">Versione locale: anteprima atleta sullo stesso dispositivo, non accesso privato online. Video conservati nel browser.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton id=\"osCoach\">Area preparatore\u003c/button>\u003cbutton id=\"osAthlete\">Anteprima atleta\u003c/button>\u003c/div>\u003clabel>Programma salvato\u003cselect id=\"osPrograms\">\u003c/select>\u003c/label>\u003c/section>\u003cdiv id=\"osCoachPane\">\u003csection class=\"panel\">\u003ch2>1 · Programma\u003c/h2>\u003cdiv class=\"widegrid\">\u003clabel>Atleta dalla rosa\u003cselect id=\"osPlayer\">\u003c/select>\u003c/label>\u003clabel>Atleta esterno (se non in rosa)\u003cinput id=\"osExternal\">\u003c/label>\u003clabel>Titolo programma\u003cinput id=\"osTitle\">\u003c/label>\u003clabel>Inizio\u003cinput id=\"osStart\" type=\"date\">\u003c/label>\u003clabel>Settimane\u003cinput id=\"osWeeks\" type=\"number\" min=\"1\" max=\"24\" value=\"4\">\u003c/label>\u003clabel>Obiettivi\u003cinput id=\"osGoal\">\u003c/label>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"osNew\">Nuovo programma\u003c/button>\u003cbutton id=\"osSave\">Salva programma\u003c/button>\u003cbutton id=\"osDelete\" class=\"danger\">Elimina programma\u003c/button>\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003ch2>2 · Seduta e esercizi\u003c/h2>\u003cdiv class=\"widegrid\">\u003clabel>Giorno della settimana\u003cselect id=\"osDay\">\u003coption value=\"0\">Giorno 1\u003c/option>\u003coption value=\"1\">Giorno 2\u003c/option>\u003coption value=\"2\">Giorno 3\u003c/option>\u003coption value=\"3\">Giorno 4\u003c/option>\u003coption value=\"4\">Giorno 5\u003c/option>\u003coption value=\"5\">Giorno 6\u003c/option>\u003coption value=\"6\">Giorno 7\u003c/option>\u003c/select>\u003c/label>\u003clabel>Nome seduta\u003cinput id=\"osSession\" value=\"Forza\">\u003c/label>\u003clabel>Importa scheda Strength Training\u003cselect id=\"osStrength\">\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"osImport\">Carica scheda\u003c/button>\u003cbutton id=\"osAdd\">+ Esercizio\u003c/button>\u003c/div>\u003cdiv id=\"osRows\" class=\"scroll\">\u003c/div>\u003ch3>Progressioni cumulative per settimana\u003c/h3>\u003cdiv class=\"widegrid\">\u003clabel>Carico %\u003cinput id=\"osLoad\" type=\"number\" value=\"0\">\u003c/label>\u003clabel>Serie %\u003cinput id=\"osSets\" type=\"number\" value=\"0\">\u003c/label>\u003clabel>Ripetizioni %\u003cinput id=\"osReps\" type=\"number\" value=\"0\">\u003c/label>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"osGenerate\">Genera sedute nel blocco\u003c/button>\u003c/div>\u003cp class=\"help\">La generazione sostituisce le sedute dello stesso giorno del blocco; non sostituisce sedute già registrate.\u003c/p>\u003cdiv id=\"osPreview\" class=\"scroll\">\u003c/div>\u003c/section>\u003c/div>\u003csection class=\"panel\">\u003ch2>3 · Agenda del programma\u003c/h2>\u003cdiv id=\"osAgenda\">\u003c/div>\u003c/section>\u003csection class=\"panel\" id=\"osDetail\" hidden>\u003ch2 id=\"osDetailTitle\">\u003c/h2>\u003cdiv id=\"osDetailRows\">\u003c/div>\u003cdiv class=\"widegrid\">\u003clabel>RPE seduta (1–10)\u003cinput id=\"osRpe\" type=\"number\" min=\"1\" max=\"10\">\u003c/label>\u003clabel>Sensazioni\u003ctextarea id=\"osFeel\">\u003c/textarea>\u003c/label>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"osComplete\">Salva seduta completata\u003c/button>\u003c/div>\u003cdiv id=\"osReview\">\u003ch3>Feedback preparatore\u003c/h3>\u003ctextarea id=\"osFeedback\" style=\"width:100%\">\u003c/textarea>\u003cbutton id=\"osFeedbackSave\">Salva feedback\u003c/button>\u003c/div>\u003cp id=\"osFeedbackView\">\u003c/p>\u003c/section>\u003cp id=\"osStatus\" role=\"status\" class=\"info\">\u003c/p>\u003c/div>\n\u003cdiv id=\"stMainPane\">\u003csection class=\"panel\">\u003ch2>1 · Profilo individuale e riferimenti di forza\u003c/h2>\u003cdiv class=\"widegrid\">\u003clabel>Atleta\u003cselect id=\"stAthlete\">\u003c/select>\u003c/label>\u003clabel>Peso corporeo (kg)\u003cinput id=\"stBW\" type=\"number\" min=\"1\" step=\"0.1\">\u003c/label>\u003cdiv>\u003cbutton id=\"stBWSave\">Salva peso corporeo\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"widegrid\">\u003clabel>Esercizio\u003cinput id=\"stRefName\" list=\"stOptions\" placeholder=\"Back Squat\">\u003c/label>\u003clabel>Metodo\u003cselect id=\"stRefMode\">\u003coption value=\"1RM\">Massimale diretto\u003c/option>\u003coption value=\"e1RM\">Massimale stimato\u003c/option>\u003coption value=\"BW\">Peso corporeo\u003c/option>\u003c/select>\u003c/label>\u003clabel>Data test\u003cinput id=\"stRefDate\" type=\"date\">\u003c/label>\u003clabel>Carico test (kg)\u003cinput id=\"stRefKg\" type=\"number\" min=\"0.1\" step=\"0.1\">\u003c/label>\u003clabel>Ripetizioni (stima)\u003cinput id=\"stRefReps\" type=\"number\" min=\"1\" max=\"10\" value=\"8\">\u003c/label>\u003clabel>Formula\u003cselect id=\"stRefFormula\">\u003coption>Epley\u003c/option>\u003coption>Brzycki\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cp id=\"stRefPreview\" class=\"info\">\u003c/p>\u003cbutton id=\"stRefSave\">Salva riferimento esercizio\u003c/button>\u003cdiv id=\"stRefs\" class=\"scroll\">\u003c/div>\u003cp class=\"help\">La stima è indicativa: usare 1–10 ripetizioni vicine al limite. % BW indica il carico esterno rispetto al peso corporeo, non il peso totale spostato.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch2>2 · Costruisci scheda individuale\u003c/h2>\u003cdiv class=\"widegrid\">\u003clabel>Data\u003cinput type=\"date\" id=\"stDate\">\u003c/label>\u003clabel>Nome scheda\u003cinput id=\"stTitle\" placeholder=\"Lower body\">\u003c/label>\u003clabel>Obiettivo\u003cinput id=\"stGoal\" placeholder=\"Forza massima / potenza\">\u003c/label>\u003clabel>Settimana / blocco\u003cinput id=\"stBlock\">\u003c/label>\u003clabel>Note seduta\u003cinput id=\"stNote\">\u003c/label>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"stNew\">Nuova scheda\u003c/button>\u003cbutton id=\"stSave\">Salva scheda\u003c/button>\u003cbutton id=\"stDuplicate\" class=\"alt\">Duplica scheda\u003c/button>\u003c/div>\u003cdiv id=\"stRows\" class=\"scroll\">\u003c/div>\u003cbutton id=\"stAdd\">+ Esercizio\u003c/button>\u003cp id=\"stStatus\" role=\"status\">\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch2>Agenda delle schede salvate\u003c/h2>\u003clabel>Filtra mese\u003cinput type=\"month\" id=\"stMonth\">\u003c/label>\u003cdiv id=\"stAgenda\">\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003ch2>Libreria esercizi\u003c/h2>\u003cdiv class=\"widegrid\">\u003clabel>Nome\u003cinput id=\"stLibName\">\u003c/label>\u003clabel>Video dimostrativo (URL)\u003cinput id=\"stLibVideo\" type=\"url\">\u003c/label>\u003clabel>Indicazioni tecniche\u003cinput id=\"stLibNote\">\u003c/label>\u003c/div>\u003cbutton id=\"stLibSave\">Aggiungi alla libreria\u003c/button>\u003cdiv id=\"stLibrary\">\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003ch2>Test individuali\u003c/h2>\u003cdiv class=\"widegrid\">\u003clabel>Data\u003cinput type=\"date\" id=\"stTestDate\">\u003c/label>\u003clabel>Test / esercizio\u003cinput id=\"stTestName\" placeholder=\"Back Squat\">\u003c/label>\u003clabel>Tipo\u003cselect id=\"stTestType\">\u003coption>1RM\u003c/option>\u003coption>e1RM\u003c/option>\u003coption>CMJ\u003c/option>\u003coption>SJ\u003c/option>\u003coption>RSI\u003c/option>\u003coption>Isometria\u003c/option>\u003coption>Altro\u003c/option>\u003c/select>\u003c/label>\u003clabel>Valore\u003cinput type=\"number\" step=\"any\" id=\"stTestValue\">\u003c/label>\u003clabel>Unità\u003cinput id=\"stTestUnit\" value=\"kg\">\u003c/label>\u003c/div>\u003cbutton id=\"stTestSave\">Salva test per atleta selezionato\u003c/button>\u003cdiv id=\"stTests\">\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003ch2>Progressioni settimanali\u003c/h2>\u003cp>Seleziona una scheda salvata: la settimana 1 è la base. Le settimane successive applicano variazioni percentuali cumulative a kg, serie e ripetizioni. Serie e ripetizioni sono arrotondate a interi.\u003c/p>\u003cdiv class=\"widegrid\">\u003clabel>Scheda di partenza\u003cselect id=\"stBase\">\u003c/select>\u003c/label>\u003clabel>Nome blocco\u003cinput id=\"stProgBlock\">\u003c/label>\u003clabel>Settimane totali (inclusa la base)\u003cinput type=\"number\" id=\"stWeeks\" min=\"2\" max=\"24\" value=\"4\">\u003c/label>\u003clabel>Variazione carico % / settimana\u003cinput type=\"number\" id=\"stInc\" step=\"0.5\" value=\"5\">\u003c/label>\u003clabel>Variazione serie % / settimana\u003cinput type=\"number\" id=\"stSeriesInc\" step=\"1\" value=\"0\">\u003c/label>\u003clabel>Variazione ripetizioni % / settimana\u003cinput type=\"number\" id=\"stRepsInc\" step=\"1\" value=\"-10\">\u003c/label>\u003c/div>\u003cbutton id=\"stProgress\" type=\"button\">Genera / aggiorna anteprima\u003c/button> \u003cbutton id=\"stProgSave\" type=\"button\">Salva blocco in agenda\u003c/button>\u003cdiv id=\"stProgStatus\" class=\"info\" role=\"status\">\u003c/div>\u003cdiv id=\"stProgPreview\" class=\"scroll\">\u003c/div>\u003c/section>\u003c/div>\u003c/div>\u003c/main>\n\u003cscript>/* pako 0.2.9 nodeca/pako */\n!function(e){if(\"object\"==typeof exports&&\"undefined\"!=typeof module)module.exports=e();else if(\"function\"==typeof define&&define.amd)define([],e);else{var t;t=\"undefined\"!=typeof window?window:\"undefined\"!=typeof global?global:\"undefined\"!=typeof self?self:this,t.pako=e()}}(function(){return function e(t,i,n){function a(o,s){if(!i[o]){if(!t[o]){var f=\"function\"==typeof require&&require;if(!s&&f)return f(o,!0);if(r)return r(o,!0);var l=new Error(\"Cannot find module '\"+o+\"'\");throw l.code=\"MODULE_NOT_FOUND\",l}var d=i[o]={exports:{}};t[o][0].call(d.exports,function(e){var i=t[o][1][e];return a(i?i:e)},d,d.exports,e,t,i,n)}return i[o].exports}for(var r=\"function\"==typeof require&&require,o=0;o\u003cn.length;o++)a(n[o]);return a}({1:[function(e,t,i){\"use strict\";var n=\"undefined\"!=typeof Uint8Array&&\"undefined\"!=typeof Uint16Array&&\"undefined\"!=typeof Int32Array;i.assign=function(e){for(var t=Array.prototype.slice.call(arguments,1);t.length;){var i=t.shift();if(i){if(\"object\"!=typeof i)throw new TypeError(i+\"must be non-object\");for(var n in i)i.hasOwnProperty(n)&&(e[n]=i[n])}}return e},i.shrinkBuf=function(e,t){return e.length===t?e:e.subarray?e.subarray(0,t):(e.length=t,e)};var a={arraySet:function(e,t,i,n,a){if(t.subarray&&e.subarray)return void e.set(t.subarray(i,i+n),a);for(var r=0;r\u003cn;r++)e[a+r]=t[i+r]},flattenChunks:function(e){var t,i,n,a,r,o;for(n=0,t=0,i=e.length;t\u003ci;t++)n+=e[t].length;for(o=new Uint8Array(n),a=0,t=0,i=e.length;t\u003ci;t++)r=e[t],o.set(r,a),a+=r.length;return o
