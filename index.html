entSibling;while(n&&!/^H[23]$/.test(n.tagName)){n.classList.add('ml51-training-hidden');n=n.nextElementSibling}}}}\n  const pdf=document.getElementById('pdfReportType');if(pdf&&document.getElementById('monitoringPane')?.dataset.mlView==='match'){\n   [...pdf.options].forEach(o=>o.hidden=!['match','player','team'].includes(o.value));\n   if(!['match','player','team'].includes(pdf.value))pdf.value='match';\n  }\n }\n const original=window.renderMonitoringReports;if(typeof original==='function')window.renderMonitoringReports=function(){const r=original.apply(this,arguments);arrange();return r};\n document.addEventListener('DOMContentLoaded',()=>{arrange();const match=document.getElementById('ml48Match');match?.addEventListener('click',()=>setTimeout(arrange,0));});\n // Wikipedia API: ricerca online con controllo sul titolo, senza sostituire gli stemmi caricati manualmente.\n function clean(s){return String(s||'').replace(/\\b(U\\s*17|UNDER\\s*17|U\\s*19|U\\s*16)\\b/gi,'').replace(/\\b(19|20)\\d\\d\\b/g,'').trim()}\n const names={BOLOGNA:'Bologna FC 1909',SAMPDORIA:'UC Sampdoria',JUVENTUS:'Juventus FC',INTER:'Inter Milan',MILAN:'AC Milan',ROMA:'AS Roma',LAZIO:'SS Lazio',TORINO:'Torino FC',FIORENTINA:'ACF Fiorentina',ATALANTA:'Atalanta BC',NAPOLI:'SSC Napoli',PARMA:'Parma Calcio 1913',GENOA:'Genoa CFC',SASSUOLO:'US Sassuolo Calcio',EMPOLI:'Empoli FC',VERONA:'Hellas Verona FC',UDINESE:'Udinese Calcio',CAGLIARI:'Cagliari Calcio'};\n async function findLogo(){const sel=document.getElementById('ml50Team'),status=document.getElementById('ml50LogoStatus');if(!sel||!status)return;\n  const team=sel.value,upper=clean(team).toUpperCase();const key=Object.keys(names).find(n=>upper.includes(n));const query=key?names[key]:clean(team)+' football club';\n  status.textContent='Ricerca online dello scudetto per '+team+'…';\n  try{const api='https://en.wikipedia.org/w/api.php?origin=*&action=query&format=json&generator=search&gsrsearch='+encodeURIComponent(query)+'&gsrlimit=5&prop=pageimages&piprop=thumbnail&pithumbsize=180';\n   const response=await fetch(api);if(!response.ok)throw Error('Servizio non disponibile');const data=await response.json();const pages=Object.values(data.query?.pages||{});\n   const expected=(key?names[key]:clean(team)).toLowerCase();const first=pages.find(p=>p.thumbnail?.source&&p.title.toLowerCase()===expected)||pages.find(p=>p.thumbnail?.source&&p.title.toLowerCase().includes(expected));\n   if(!first){status.textContent='Nessuno scudetto verificabile trovato automaticamente. Puoi caricarlo manualmente.';return}\n   const url=first.thumbnail.source;const saved=JSON.parse(localStorage.getItem('methodlab-official-logos-v1')||'{}');const norm=t=>String(t||'').toLocaleUpperCase('it').replace(/\\b(U\\s*17|UNDER\\s*17|U\\s*19|U\\s*16)\\b/g,'').replace(/[^A-ZÀ-Ÿ0-9]/g,'').trim();saved[norm(team)]=url;\n   localStorage.setItem('methodlab-official-logos-v1',JSON.stringify(saved));\n   // Lo script originale conserva una cache in memoria: ricaricare per sincronizzarla.\n   status.innerHTML='Scudetto trovato da Wikipedia: '+first.title+'. \u003cstrong>Ricarica la pagina\u003c/strong> per visualizzarlo nello storico. La visualizzazione automatica richiede internet.';\n  }catch(e){status.textContent='Ricerca non disponibile: verifica la connessione o carica lo scudetto manualmente.'}\n }\n document.addEventListener('DOMContentLoaded',()=>{const section=document.querySelector('.ml50-logos');if(!section)return;const box=document.createElement('div');box.className='ml51-logo-actions';box.innerHTML='\u003cbutton type=\"button\" id=\"ml51AutoLogo\">Cerca scudetto online\u003c/button>\u003cspan class=\"ml51-logo-note\">Ricerca Wikipedia, quando connesso. Conferma che lo stemma corrisponda alla squadra.\u003c/span>';section.append(box);box.querySelector('button').addEventListener('click',findLogo)});\n})();\n\u003c/script>\n\u003cstyle>\n/* V52: separate analytical workspaces, clear reading order */\n#monitoringPane[data-ml-view=\"match\"] .ml48-mode-panel[data-ml48-mode=\"training\"],\n#monitoringPane[data-ml-view=\"training\"] .ml48-mode-panel[data-ml48-mode=\"match\"]{display:none!important}\n#monitoringPane .ml48-mode-panel[hidden]{display:none!important}\n#monitoringPane .ml48-mode-panel>section.panel{margin:20px 0;padding:24px;border-radius:16px}\n#monitoringPane .ml48-mode-panel>section.panel>h2{font-size:22px;letter-spacing:-.025em;line-height:1.25}\n#monitoringPane .ml-mini-table{font-variant-numeric:tabular-nums}\n#monitoringPane .ml-scatter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}\n#monitoringPane .ml49-player-control{margin-top:26px;border-top:3px solid #0e7490}\n#monitoringPane[data-ml-view=\"home\"] .ml48-mode-panel{display:none!important}\n#monitoringPane .ml50-logos summary{font-weight:700;cursor:pointer}\n@media print{.player-page{break-before:page!important;page-break-before:always!important;break-inside:avoid!important}.player-page h2{text-transform:capitalize}}\n\u003c/style>\n\u003cscript>\n(function(){\n function tidy(){\n  const match=document.querySelector('#monitoringPane [data-ml48-mode=\"match\"]');if(!match)return;\n  const report=match.querySelector('#monMatchReport')?.closest('section.panel');\n  const player=report?.querySelector('.ml49-player-control'),bars=report?.querySelector('#ml49MatchBars');\n  const insights=report?.querySelector('#monMatchInsights');\n  if(report&&player&&bars){if(insights)insights.after(player,bars);else report.append(player,bars)}\n  // Match model contains ONLY the prestative model and match history.\n  const individual=match.querySelector('#mlIndividualAuto');\n  if(individual){const headers=[...individual.querySelectorAll('h3')];\n   for(const h of headers){if(/settiman|microciclo|esercitazion|confronto settimanale/i.test(h.textContent)){\n    let cur=h;while(cur){const next=cur.nextElementSibling;cur.remove();if(!next||next.matches('h2,h3'))break;cur=next}\n   }}\n  }\n  const logo=match.querySelector('.ml50-logos');if(logo&&!logo.querySelector('details.ml52-logo-settings')){\n   const det=document.createElement('details');det.className='ml52-logo-settings';const summary=document.createElement('summary');summary.textContent='Gestione scudetti ufficiali · ricerca e correzione';\n   while(logo.firstChild)det.appendChild(logo.firstChild);det.prepend(summary);logo.append(det);\n  }\n }\n const old=window.renderMonitoringReports;if(typeof old==='function')window.renderMonitoringReports=function(){const r=old.apply(this,arguments);tidy();return r};\n document.addEventListener('DOMContentLoaded',()=>{tidy();document.getElementById('ml48Match')?.addEventListener('click',()=>setTimeout(tidy,0))});\n})();\n\u003c/script>\n\u003cstyle>\n#monitoringPane .ml49-player-control{display:none!important}\n#monitoringPane .ml54-chooser{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;padding:18px;background:#f1f6fb;border:1px solid #d7e4ef;border-radius:14px;margin:16px 0}\n#monitoringPane .ml54-chooser label{display:grid;gap:6px;font-size:12px;font-weight:750;color:#28465e}\n#monitoringPane .ml54-chooser select{width:100%;padding:10px;border-radius:8px;border:1px solid #bccfdf;background:white;color:#15374f}\n#monitoringPane .ml54-summary{font-size:12px;color:#5b7287;margin:8px 0 16px}\n#monitoringPane .ml54-visual{max-width:900px;margin:0 auto}\n\u003c/style>\n\u003cscript>\n(function(){\n'use strict';\nconst id=x=>document.getElementById(x);\nconst esc=x=>String(x??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst defaults=['TD_m','ACC_n','DEC_n','HSR_m','SPRINT_m','N_SPRINT'];\nfunction metricDefs(rows){\n const found=new Map();\n for(const [k,label,unit] of (typeof monMetrics!=='undefined'?monMetrics:[]))found.set(k,{key:k,label:label+' ('+unit+')',original:false});\n for(const row of rows){\n  for(const [k,v] of Object.entries(row)){\n   if(!k.startsWith('Originale: '))continue;\n   const raw=k.slice(11).trim();if(!raw)continue;\n   if(!found.has(k))found.set(k,{key:k,label:raw+' · Excel',original:true});\n  }\n }\n return [...found.values()].filter(d=>rows.some(r=>{\n  const v=d.original?String(r[d.key]??'').trim():r[d.key];\n  return v!==''&&v!=null&&Number.isFinite(monNumber(v));\n }));\n}\nfunction renderCustom(){\n const host=id('mlIndividualAuto'),player=id('monPlayer');\n if(!host||!player||typeof state==='undefined')return;\n const name=player.value,rows=state.monitoring.match.filter(r=>monKey(r)===name);\n if(!name){host.innerHTML='\u003cp class=\"help\">Seleziona un giocatore per visualizzare lo storico.\u003c/p>';return}\n const metrics=metricDefs(rows);\n const oldX=id('ml54X')?.value||'ACC_n',oldY=id('ml54Y')?.value||'DEC_n',oldMode=id('ml54Mode')?.value||'relative';\n const options=metrics.map(d=>'\u003coption value=\"'+esc(d.key)+'\">'+esc(d.label)+'\u003c/option>').join('');\n host.innerHTML='\u003ch3>Storico partite · '+esc(window.ml49TitleName?window.ml49TitleName(name):name)+'\u003c/h3>'+\n '\u003cp class=\"ml54-summary\">Scegli liberamente gli indicatori presenti nel foglio Excel DATI PARTITA. Ogni simbolo corrisponde a una partita importata.\u003c/p>'+\n '\u003cdiv class=\"ml54-chooser\">\u003clabel>Asse orizzontale (X)\u003cselect id=\"ml54X\">'+options+'\u003c/select>\u003c/label>'+\n '\u003clabel>Asse verticale (Y)\u003cselect id=\"ml54Y\">'+options+'\u003c/select>\u003c/label>'+\n '\u003clabel>Tipo di valore\u003cselect id=\"ml54Mode\">\u003coption value=\"relative\">Relativo al minuto\u003c/option>\u003coption value=\"total\">Totale partita\u003c/option>\u003c/select>\u003c/label>\u003c/div>'+\n '\u003cdiv class=\"ml54-visual\" id=\"ml54Chart\">\u003c/div>'+\n '\u003cdiv class=\"ml-scroll\" id=\"ml54Data\">\u003c/div>';\n const x=id('ml54X'),y=id('ml54Y'),mode=id('ml54Mode');\n x.value=metrics.some(d=>d.key===oldX)?oldX:metrics[0]?.key||'';\n y.value=metrics.some(d=>d.key===oldY)?oldY:metrics[Math.min(1,metrics.length-1)]?.key||'';\n mode.value=oldMode;\n const update=()=>{\n  const mx=metrics.find(d=>d.key===x.value),my=metrics.find(d=>d.key===y.value);\n  if(!mx||!my){id('ml54Chart').textContent='Nessun parametro numerico disponibile.';return}\n  const rel=mode.value==='relative';\n  const val=(r,d)=>{const n=monNumber(r[d.key]),min=monNumber(r.Minuti);return Number.isFinite(n)?(rel?(min>0?n/min:NaN):n):NaN};\n  const pts=rows.map(r=>({label:r.Partita||'Partita',x:val(r,mx),y:val(r,my)}));\n  const valid=pts.filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y));\n  id('ml54Chart').innerHTML=mlScatterSvg(pts,'x','y',mx.label+' × '+my.label+(rel?' · /min':' · totali'));\n  id('ml54Data').innerHTML='\u003cp class=\"ml54-summary\">'+valid.length+' partite con entrambi i parametri validi su '+rows.length+' osservazioni.\u003c/p>'+\n   '\u003ctable class=\"ml-mini-table\">\u003cthead>\u003ctr>\u003cth>Partita\u003c/th>\u003cth>Minuti\u003c/th>\u003cth>'+esc(mx.label)+'\u003c/th>\u003cth>'+esc(my.label)+'\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n   rows.map(r=>'\u003ctr>\u003ctd>'+esc(r.Partita||'—')+'\u003c/td>\u003ctd>'+esc(monNumber(r.Minuti))+'\u003c/td>\u003ctd>'+esc(Number.isFinite(val(r,mx))?val(r,mx).toFixed(2):'—')+'\u003c/td>\u003ctd>'+esc(Number.isFinite(val(r,my))?val(r,my).toFixed(2):'—')+'\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>';\n };\n [x,y,mode].forEach(el=>el.addEventListener('change',update));update();\n}\nfunction syncPlayer(){\n const select=id('ml49MatchPlayer'),primary=id('monPlayer'),match=id('monMatch'),bars=id('ml49MatchBars');\n if(!select||!primary||!match||!bars)return;\n select.value=primary.value;\n bars.innerHTML=primary.value&&typeof ml45MatchBars==='function'?ml45MatchBars(primary.value,match.value):'\u003cp class=\"help\">Seleziona un giocatore dal modello prestativo in alto.\u003c/p>';\n}\ndocument.addEventListener('change',e=>{\n if(e.target?.id==='monPlayer'){setTimeout(()=>{syncPlayer();renderCustom()},0)}\n if(e.target?.id==='monMatch')setTimeout(syncPlayer,0);\n});\nconst old=window.renderMonitoringReports;\nif(typeof old==='function')window.renderMonitoringReports=function(){\n const result=old.apply(this,arguments);\n renderCustom();syncPlayer();return result;\n};\ndocument.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{renderCustom();syncPlayer()},250));\n})();\n\u003c/script>\n\n\u003cstyle>\n#monitoringPane[data-ml-view=\"match\"] .ml55-individual{border-top:5px solid #236ca3;margin-top:28px}\n#monitoringPane .ml55-analytics{margin:24px 0;padding:20px;background:#f5f9fc;border:1px solid #d7e5ef;border-radius:15px}\n#monitoringPane .ml55-analytics h3{margin:10px 0}\n#monitoringPane .ml55-chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:16px 0}\n#monitoringPane .ml55-chart{background:white;border:1px solid #dae5ed;border-radius:12px;padding:14px;overflow:hidden}\n#monitoringPane .ml55-chart svg{display:block;width:100%;height:auto}\n#monitoringPane .ml55-chart h4{margin:0 0 10px;font-size:14px}\n#monitoringPane .ml55-tab{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}\n#monitoringPane .ml55-tab button{border-radius:8px;padding:8px 15px}\n#monitoringPane .ml55-tab button[aria-pressed=\"true\"]{background:#185d8f;color:white}\n#monitoringPane .ml55-hint{font-size:13px;color:#476276;line-height:1.5}\n\u003c/style>\n\u003cscript>\n(function(){\n 'use strict';\n const get=id=>document.getElementById(id);\n const esc=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n let mode='rate';\n function moveIndividual(){\n  const report=get('monMatchReport')?.closest('section.panel'),model=get('monModel')?.closest('section.panel');\n  if(!report||!model)return;\n  if(model.previousElementSibling!==report)report.after(model);\n  model.classList.add('ml55-individual');\n  const h=model.querySelector('h2');if(h)h.textContent='Analisi individuale · modello prestativo e storico partite';\n  const control=report.querySelector('.ml49-player-control'),bars=get('ml49MatchBars');\n  if(control)control.remove();\n  if(bars&&bars.parentElement!==model)model.append(bars);\n  if(bars){let title=get('ml55BarsTitle');if(!title){title=document.createElement('h3');title.id='ml55BarsTitle';title.textContent='Confronto individuale della partita · media e massimo';bars.before(title)}}\n  const detail=get('ml46MatchAthlete')?.closest('div');\n  if(detail&&report.contains(detail)&&!model.contains(detail)){const panel=detail.closest('section')||detail;if(panel!==report&&report.contains(panel))model.append(panel)}\n }\n function avg(rows,k,relative){const values=rows.map(r=>{const v=monNumber(r[k]);if(!Number.isFinite(v))return NaN;const minutes=monNumber(r.Minuti);return relative?(minutes>60?v/minutes:NaN):v}).filter(Number.isFinite);return {value:values.length?values.reduce((a,b)=>a+b,0)/values.length:NaN,n:values.length};}\n function barSvg(label,groups,k,relative){\n  const values=groups.map(g=>avg(g.rows,k,relative));const max=Math.max(1,...values.map(v=>Number.isFinite(v.value)?v.value:0));\n  const W=440,H=74+groups.length*43;let html='\u003csvg viewBox=\"0 0 '+W+' '+H+'\" role=\"img\" aria-label=\"'+esc(label)+'\">';\n  values.forEach((v,i)=>{const y=34+i*43,bar=Number.isFinite(v.value)?Math.max(0,v.value/max*245):0;\n   html+='\u003ctext x=\"0\" y=\"'+(y+13)+'\" fill=\"#34516a\" font-size=\"12\">'+esc(groups[i].label.slice(0,19))+'\u003c/text>'+\n   '\u003crect x=\"143\" y=\"'+y+'\" width=\"245\" height=\"19\" rx=\"4\" fill=\"#e7eef4\"/>'+\n   '\u003crect x=\"143\" y=\"'+y+'\" width=\"'+bar.toFixed(2)+'\" height=\"19\" rx=\"4\" fill=\"'+(i===0?'#1476a8':'#70a9c6')+'\"/>'+\n   '\u003ctext x=\"'+Math.min(392,148+bar)+'\" y=\"'+(y+14)+'\" fill=\"#173c57\" font-size=\"11\" font-weight=\"bold\">'+(Number.isFinite(v.value)?v.value.toFixed(2):'—')+'\u003c/text>';\n  });return html+'\u003c/svg>';\n }\n function make(){\n  moveIndividual();const report=get('monMatchReport')?.closest('section.panel');if(!report||typeof state==='undefined'||!state.monitoring)return;\n  let host=get('ml55MatchObservations');if(!host){host=document.createElement('section');host.id='ml55MatchObservations';host.className='ml55-analytics';const insights=get('monMatchInsights');if(insights)insights.before(host);else report.append(host)}\n  const match=get('monMatch')?.value,cur=state.monitoring.match.filter(r=>r.Partita===match),ref=state.monitoring.match.filter(r=>r.Partita!==match);\n  if(!cur.length){host.innerHTML='\u003ch3>Osservazione collettiva\u003c/h3>\u003cp>Importa i dati e seleziona una partita.\u003c/p>';return}\n  const relative=mode==='rate',qual=relative?cur.filter(r=>monNumber(r.Minuti)>60):cur;\n  const roles=[...new Set(qual.map(pdfRole).filter(Boolean))].sort();\n  const groups=[{label:'Squadra',rows:qual,base:relative?ref.filter(r=>monNumber(r.Minuti)>60):ref},...roles.map(role=>({label:role,rows:qual.filter(r=>pdfRole(r)===role),base:ref.filter(r=>pdfRole(r)===role&&(!relative||monNumber(r.Minuti)>60))}))];\n  let html='\u003ch3>Osservazione collettiva · squadra e ruoli\u003c/h3>\u003cp class=\"ml55-hint\">Confronto con le altre partite importate. La modalità \u003cb>relativa al minuto\u003c/b> considera esclusivamente le osservazioni con \u003cb>più di 60 minuti\u003c/b> (60 esatti esclusi), sia per la partita selezionata sia per lo storico di riferimento. I valori sono medie per giocatore, non somme.\u003c/p>'+\n   '\u003cdiv class=\"ml55-tab\">\u003cbutton type=\"button\" id=\"ml55Rate\" aria-pressed=\"'+relative+'\">Valori / minuto · &gt;60′\u003c/button>\u003cbutton type=\"button\" id=\"ml55Total\" aria-pressed=\"'+(!relative)+'\">Valori totali\u003c/button>\u003c/div>'+\n   '\u003cp class=\"ml55-hint\">Osservazioni incluse: \u003cb>'+qual.length+'\u003c/b> su '+cur.length+' nella partita. Le medie sono calcolate sui soli valori disponibili per ogni indicatore.\u003c/p>';\n  for(const group of groups){html+='\u003ch4>'+esc(group.label)+' · '+group.rows.length+' giocatori\u003c/h4>\u003cdiv class=\"ml55-chart-grid\">';\n   for(const [k,label,unit] of monMetrics.slice(0,6))html+='\u003cdiv class=\"ml55-chart\">\u003ch4>'+esc(label)+' ('+esc(unit)+(relative?'/min':'')+')\u003c/h4>'+barSvg(label,[{label:'Partita',rows:group.rows},{label:'Storico',rows:group.base}],k,relative)+'\u003c/div>';\n   html+='\u003c/div>\u003cdiv class=\"ml-scroll\">\u003ctable class=\"ml-stats\">\u003cthead>\u003ctr>\u003cth>Indicatore\u003c/th>\u003cth>Media partita\u003c/th>\u003cth>Mediana partita\u003c/th>\u003cth>Media storico\u003c/th>\u003cth>N partita\u003c/th>\u003cth>N storico\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n   for(const [k,label,unit] of monMetrics){const a=group.rows.map(r=>{const v=monNumber(r[k]);return relative?v/monNumber(r.Minuti):v}).filter(Number.isFinite),b=group.base.map(r=>{const v=monNumber(r[k]);return relative?v/monNumber(r.Minuti):v}).filter(Number.isFinite);const mean=x=>x.length?(x.reduce((p,c)=>p+c,0)/x.length).toFixed(2):'—';const med=x=>x.length?monMedian(x).toFixed(2):'—';html+='\u003ctr>\u003ctd>'+esc(label)+' ('+esc(unit)+(relative?'/min':'')+')\u003c/td>\u003ctd>'+mean(a)+'\u003c/td>\u003ctd>'+med(a)+'\u003c/td>\u003ctd>'+mean(b)+'\u003c/td>\u003ctd>'+a.length+'\u003c/td>\u003ctd>'+b.length+'\u003c/td>\u003c/tr>'}html+='\u003c/tbody>\u003c/table>\u003c/div>';\n  }\n  host.innerHTML=html;get('ml55Rate').onclick=()=>{mode='rate';make()};get('ml55Total').onclick=()=>{mode='total';make()};\n }\n const old=window.renderMonitoringReports;if(typeof old==='function')window.renderMonitoringReports=function(){const result=old.apply(this,arguments);make();return result};\n document.addEventListener('DOMContentLoaded',()=>setTimeout(make,100));\n document.addEventListener('click',e=>{if(e.target?.id==='ml48Match')setTimeout(make,0)});\n})();\n\u003c/script>\n\n\u003cstyle>\n#ml57Radar{margin-top:24px;padding:20px;border:1px solid #cbd9e7;border-radius:14px;background:#f8fbff}\n#ml57Radar .ml57-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}\n#ml57Radar label{display:grid;gap:5px;font-weight:700;font-size:12px}\n#ml57Radar select{width:100%;padding:9px;border:1px solid #b8c9db;border-radius:8px;background:white}\n#ml57Radar svg{display:block;max-width:750px;width:100%;margin:auto}\n#ml57Radar .ml57-foot{font-size:12px;color:#50687d}\n\u003c/style>\n\u003cscript>\n(function(){\n'use strict';\nconst $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst keys=['TD_m','HSR_m','SPRINT_m','ACC_n','DEC_n','N_SPRINT'];\nlet settings={mode:'players',p1:'',p2:'',m1:'',m2:'',w1:'',w2:'',value:'relative'};\nfunction records(){return typeof state==='undefined'?[]:state.monitoring.match}\nfunction weekly(){return typeof state==='undefined'?[]:state.monitoring.week}\nfunction weeks(player){return [...new Set(weekly().filter(r=>monKey(r)===player).map(r=>String(r.Settimana||'')).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}))}\nfunction names(match){return [...new Set(records().filter(r=>r.Partita===match).map(monKey).filter(Boolean))].sort()}\nfunction matches(player){return [...new Set(records().filter(r=>monKey(r)===player).map(r=>r.Partita).filter(Boolean))].sort()}\nfunction mean(rows,k,mode){\n const relative=mode!=='total',over60=mode==='relative60'&&settings.mode!=='weeks';\n const vals=rows.map(r=>{\n  const v=monNumber(r[k]),min=monNumber(r.Minuti);\n  return Number.isFinite(v)&&(!relative||min>0)&&(!over60||min>60)?(relative?v/min:v):NaN;\n }).filter(Number.isFinite);\n return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:NaN;\n}\nfunction options(items,value){return items.map(x=>'\u003coption value=\"'+esc(x)+'\"'+(x===value?' selected':'')+'>'+esc(x)+'\u003c/option>').join('')}\nfunction selected(){\n const current=$('monMatch')?.value||'';let a=settings.p1,b=settings.p2;\n if(settings.mode==='weeks'){\n  const n=[...new Set(weekly().map(monKey).filter(Boolean))].sort();a=n.includes(a)?a:n[0]||'';settings.p1=a;\n  const ww=weeks(a),w1=ww.includes(settings.w1)?settings.w1:ww[0]||'',w2=ww.includes(settings.w2)&&settings.w2!==w1?settings.w2:ww.find(x=>x!==w1)||'';\n  settings.w1=w1;settings.w2=w2;\n  return [{name:a+' · settimana '+w1,rows:weekly().filter(r=>monKey(r)===a&&String(r.Settimana)===w1)},{name:a+' · settimana '+w2,rows:weekly().filter(r=>monKey(r)===a&&String(r.Settimana)===w2)}];\n }\n if(settings.mode==='players'){\n  const n=names(current);a=n.includes(a)?a:n[0]||'';b=n.includes(b)&&b!==a?b:n.find(x=>x!==a)||'';\n  settings.p1=a;settings.p2=b;\n  return [{name:a+' · '+current,rows:records().filter(r=>r.Partita===current&&monKey(r)===a)},{name:b+' · '+current,rows:records().filter(r=>r.Partita===current&&monKey(r)===b)}];\n }\n const n=[...new Set(records().map(monKey).filter(Boolean))].sort();a=n.includes(a)?a:n[0]||'';settings.p1=a;\n const mm=matches(a);const m1=mm.includes(settings.m1)?settings.m1:(mm.includes(current)?current:mm[0]||'');\n const m2=mm.includes(settings.m2)&&settings.m2!==m1?settings.m2:mm.find(x=>x!==m1)||'';\n settings.m1=m1;settings.m2=m2;\n return [{name:a+' · '+m1,rows:records().filter(r=>monKey(r)===a&&r.Partita===m1)},{name:a+' · '+m2,rows:records().filter(r=>monKey(r)===a&&r.Partita===m2)}];\n}\nfunction radarSvg(series){\n const activeKeys=window.ml65WeeklyKeys?.length?keys.filter(k=>window.ml65WeeklyKeys.includes(k)):keys;\n const defs=activeKeys.map(k=>monMetrics.find(d=>d[0]===k)||[k,k,'']);\n const vals=series.map(s=>activeKeys.map(k=>mean(s.rows,k,settings.value)));\n const cx=260,cy=220,R=140,n=activeKeys.length,colors=['#1767a4','#e47b36'];\n const point=(i,r)=>[cx+Math.sin(i*2*Math.PI/n)*r,cy-Math.cos(i*2*Math.PI/n)*r];\n let svg='\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 670 470\" role=\"img\" aria-label=\"Radar comparativo GPS\">\u003crect width=\"670\" height=\"470\" fill=\"white\" rx=\"12\"/>';\n for(const f of [.25,.5,.75,1])svg+='\u003cpolygon points=\"'+activeKeys.map((_,i)=>point(i,R*f).join(',')).join(' ')+'\" fill=\"none\" stroke=\"#cfdae4\" stroke-width=\"1.4\"/>';\n defs.forEach((d,i)=>{const [x,y]=point(i,R+31),[ex,ey]=point(i,R);svg+='\u003cline x1=\"'+cx+'\" y1=\"'+cy+'\" x2=\"'+ex+'\" y2=\"'+ey+'\" stroke=\"#d9e2eb\"/>\u003ctext x=\"'+x+'\" y=\"'+y+'\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#24445c\">'+esc(d[1])+'\u003c/text>'});\n const maxes=activeKeys.map((_,i)=>Math.max(0,...vals.map(v=>Number.isFinite(v[i])?v[i]:0)));\n vals.forEach((v,j)=>{if(!series[j].rows.length)return;const points=v.map((x,i)=>point(i,Number.isFinite(x)&&maxes[i]>0?R*Math.max(0,x/maxes[i]):0));\n svg+='\u003cpolygon points=\"'+points.map(x=>x.join(',')).join(' ')+'\" fill=\"'+colors[j]+'\" fill-opacity=\".16\" stroke=\"'+colors[j]+'\" stroke-width=\"3\"/>';\n points.forEach((p,i)=>{if(Number.isFinite(v[i]))svg+='\u003ccircle cx=\"'+p[0]+'\" cy=\"'+p[1]+'\" r=\"4\" fill=\"'+colors[j]+'\"/>'});\n svg+='\u003crect x=\"450\" y=\"'+(90+j*48)+'\" width=\"15\" height=\"15\" fill=\"'+colors[j]+'\"/>\u003ctext x=\"473\" y=\"'+(103+j*48)+'\" font-size=\"11\" fill=\"#203d55\">'+esc(series[j].name.slice(0,28))+'\u003c/text>';\n });return svg+'\u003c/svg>';\n}\nfunction render(){\n const model=$('monWeeklyInsights')?.closest('section.panel')||$('monModel')?.closest('section.panel');if(!model)return;\n let host=$('ml57Radar');if(!host){host=document.createElement('section');host.id='ml57Radar';model.append(host)}\n const series=selected(),cur=$('monMatch')?.value||'',n=settings.mode==='players'?names(cur):[...new Set((settings.mode==='weeks'?weekly():records()).map(monKey).filter(Boolean))].sort();\n host.innerHTML='\u003ch3>Radar comparativo · giocatori, partite e settimane\u003c/h3>\u003cp class=\"ml57-foot\">Confronta due giocatori, due partite oppure due settimane dello stesso calciatore.\u003c/p>'+\n '\u003cdiv class=\"ml57-controls\">\u003clabel>Tipo di confronto\u003cselect id=\"ml57Mode\">\u003coption value=\"players\">Due giocatori · stessa partita\u003c/option>\u003coption value=\"matches\">Un giocatore · due partite\u003c/option>\u003coption value=\"weeks\">Un giocatore · due settimane\u003c/option>\u003c/select>\u003c/label>'+\n '\u003clabel>Valori\u003cselect id=\"ml57Value\">\u003coption value=\"total\">Totale partita\u003c/option>\u003coption value=\"relative\">Relativi / minuto · tutte le presenze\u003c/option>\u003coption value=\"relative60\">Relativi / minuto · oltre 60′\u003c/option>\u003c/select>\u003c/label>'+\n '\u003clabel>'+(settings.mode==='players'?'Primo giocatore':'Giocatore')+'\u003cselect id=\"ml57P1\">'+options(n,settings.p1)+'\u003c/select>\u003c/label>'+\n (settings.mode==='players'?'\u003clabel>Secondo giocatore\u003cselect id=\"ml57P2\">'+options(n.filter(x=>x!==settings.p1),settings.p2)+'\u003c/select>\u003c/label>':\n settings.mode==='weeks'?'\u003clabel>Prima settimana\u003cselect id=\"ml57W1\">'+options(weeks(settings.p1),settings.w1)+'\u003c/select>\u003c/label>\u003clabel>Seconda settimana\u003cselect id=\"ml57W2\">'+options(weeks(settings.p1).filter(x=>x!==settings.w1),settings.w2)+'\u003c/select>\u003c/label>':'\u003clabel>Prima partita\u003cselect id=\"ml57M1\">'+options(matches(settings.p1),settings.m1)+'\u003c/select>\u003c/label>\u003clabel>Seconda partita\u003cselect id=\"ml57M2\">'+options(matches(settings.p1).filter(x=>x!==settings.m1),settings.m2)+'\u003c/select>\u003c/label>')+'\u003c/div>'+\n (series.every(s=>s.rows.length)?radarSvg(series):'\u003cp>Seleziona due osservazioni valide.\u003c/p>')+\n '\u003cp class=\"ml57-foot\">Ogni asse è normalizzato al valore maggiore fra le due osservazioni (100%). Il radar mostra il profilo comparativo, non valori assoluti. Puoi scegliere totali, relativi al minuto per tutte le presenze con minuti validi, oppure relativi al minuto limitati alle presenze oltre 60 minuti.\u003c/p>'+\n '\u003cdiv class=\"ml-scroll\">\u003ctable class=\"ml-mini-table\">\u003cthead>\u003ctr>\u003cth>Indicatore\u003c/th>\u003cth>'+esc(series[0].name)+'\u003c/th>\u003cth>'+esc(series[1].name)+'\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n keys.filter(k=>!window.ml65WeeklyKeys||window.ml65WeeklyKeys.includes(k)).map(k=>{const d=monMetrics.find(x=>x[0]===k)||[k,k,''];return '\u003ctr>\u003ctd>'+esc(d[1])+'\u003c/td>'+series.map(a=>{const v=mean(a.rows,k,settings.value);return '\u003ctd>'+(Number.isFinite(v)?v.toFixed(2):'—')+'\u003c/td>'}).join('')+'\u003c/tr>'}).join('')+'\u003c/tbody>\u003c/table>\u003c/div>';\n $('ml57Mode').value=settings.mode;$('ml57Value').value=settings.value;\n for(const [id,key] of [['ml57Mode','mode'],['ml57Value','value'],['ml57P1','p1'],['ml57P2','p2'],['ml57M1','m1'],['ml57M2','m2'],['ml57W1','w1'],['ml57W2','w2']])if($(id))$(id).onchange=e=>{settings[key]=e.target.value;if(key==='p1'){settings.m1='';settings.m2='';settings.w1='';settings.w2=''}render()};\n}\nwindow.ml57PdfRadar=function(){\n const series=selected();if(!series.every(x=>x.rows.length))return '';\n const table='\u003ctable>\u003cthead>\u003ctr>\u003cth>Indicatore\u003c/th>'+series.map(x=>'\u003cth>'+esc(x.name)+'\u003c/th>').join('')+'\u003c/tr>\u003c/thead>\u003ctbody>'+keys.map(k=>{const d=monMetrics.find(x=>x[0]===k)||[k,k,''];return '\u003ctr>\u003ctd>'+esc(d[1])+'\u003c/td>'+series.map(x=>{const v=mean(x.rows,k,settings.value);return '\u003ctd>'+(Number.isFinite(v)?v.toFixed(2):'—')+'\u003c/td>'}).join('')+'\u003c/tr>'}).join('')+'\u003c/tbody>\u003c/table>';\n return '\u003csection class=\"reportsection\" style=\"break-before:page\">\u003ch2>Radar comparativo · '+(settings.mode==='players'?'due giocatori':settings.mode==='weeks'?'due settimane':'due partite')+'\u003c/h2>\u003cp class=\"sub\">'+(settings.value==='relative60'?'Valori al minuto · solo presenze oltre 60 minuti':settings.value==='relative'?'Valori al minuto · tutte le presenze con minuti validi':'Valori totali')+' · assi normalizzati al maggiore valore delle due osservazioni\u003c/p>'+radarSvg(series)+table+'\u003c/section>';\n};\nconst old=window.renderMonitoringReports;\nif(typeof old==='function')window.renderMonitoringReports=function(){const r=old.apply(this,arguments);render();return r};\ndocument.addEventListener('DOMContentLoaded',()=>setTimeout(render,150));\ndocument.addEventListener('change',e=>{if(e.target?.id==='monMatch')setTimeout(render,0)});\n})();\n\u003c/script>\n\u003cstyle>\n#ml60Training{padding:18px;border:1px solid #c9dbe9;border-radius:14px;background:#f7fbff;margin:18px 0;color:#183b52}\n#ml60Training h3{margin:18px 0 10px}#ml60Training .ml60-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}\n#ml60Training label{font-size:12px;font-weight:750;display:grid;gap:5px}#ml60Training select{padding:9px;width:100%;border:1px solid #b4c9da;border-radius:8px;background:white}\n#ml60Training .ml60-metrics{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}#ml60Training .ml60-metrics label{display:flex;align-items:center;gap:5px;background:white;border:1px solid #c7d9e6;border-radius:20px;padding:7px 11px;cursor:pointer}\n#ml60Training .ml60-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}#ml60Training .ml60-chart{padding:12px;background:white;border:1px solid #d4e2ed;border-radius:10px;min-width:0}\n#ml60Training .ml60-chart svg{width:100%;height:auto}#ml60Training table{font-size:12px;width:100%;border-collapse:collapse;background:white}#ml60Training td,#ml60Training th{padding:7px;border-bottom:1px solid #dfe8f0;text-align:left}\n#ml60Training .ml60-scroll{overflow:auto;max-height:440px}#ml60Training .ml60-note{font-size:12px;color:#567188}\n.ml60-tag{display:inline-block;padding:3px 7px;border-radius:7px;font-weight:750;background:#e5e7eb;color:#444}.ml60-tag.red{background:#fbe1e1;color:#9b1c1c}.ml60-tag.yellow{background:#fff0b9;color:#805b00}.ml60-tag.green{background:#d9f5df;color:#176b35}.ml60-tag.blue{background:#dcecff;color:#1956a0}.ml60-tag.purple{background:#e8dafa;color:#7138a1}\n#ml60Training .ml60-matrix{min-width:max-content}#ml60Training .ml60-matrix th:first-child{position:sticky;left:0;background:#edf4fa;z-index:1;min-width:155px}#ml60Training .ml60-matrix td{min-width:125px;text-align:center}#ml60Training .ml60-cellmeta{margin-top:4px;white-space:nowrap}#ml60Training .ml60-cellmeta small{font-size:10px;color:#597082}\n\u003c/style>\n\u003cscript>\n(function(){'use strict';\nconst $=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst store='methodlab_v60_exercise_links';let links={};try{links=JSON.parse(localStorage.getItem(store)||'{}')}catch(_){}\nconst settings={exercise:'',series:'',metrics:[],view:'relative',week:'',role:'',player:'',seriesPlayer:''};\nconst save=()=>{try{localStorage.setItem(store,JSON.stringify(links))}catch(_){}};\nfunction n(v){return monNumber(v)}\nfunction id(r){return String(r.Esercizio||r['Originale: ESERCIZIO']||r.Esercitazione||[r.Focus||'',r.Formato||''].filter(Boolean).join(' · ')||'').trim()}\nfunction week(r){return links[id(r)]||r.Settimana||''}\nfunction metrics(){const rows=[...state.monitoring.exercise,...state.monitoring.series];const found=new Map(monMetrics.map(d=>[d[0],{k:d[0],label:d[1],unit:d[2]}]));for(const r of rows)for(const k of Object.keys(r)){if(!k.startsWith('Originale: ')||found.has(k))continue;if(rows.some(x=>Number.isFinite(n(x[k]))))found.set(k,{k,label:k.slice(11),unit:''})}return [...found.values()].filter(d=>rows.some(r=>Number.isFinite(n(r[d.k]))))}\nfunction opts(items,sel){return items.map(x=>'\u003coption value=\"'+e(x)+'\"'+(x===sel?' selected':'')+'>'+e(x)+'\u003c/option>').join('')}\nfunction val(r,k){const v=n(r[k]),m=n(r.Minuti);return Number.isFinite(v)&&m>0?v/m:NaN}\nfunction avg(rows,k){const a=rows.map(r=>val(r,k)).filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN}\nfunction pct(v,b){return Number.isFinite(v)&&Number.isFinite(b)&&b>0?100*v/b:NaN}\nfunction fmt(v){return Number.isFinite(v)?v.toLocaleString('it-IT',{maximumFractionDigits:2}):'—'}\nfunction color(p){return !Number.isFinite(p)?'':p\u003c90?'red':p\u003c100?'yellow':'green'}\nfunction chip(p,variation=false){const c=variation?(!Number.isFinite(p)?'':p\u003c90?'blue':p\u003c=110?'yellow':p\u003c=130?'green':'red'):color(p);return '\u003cspan class=\"ml60-tag '+c+'\">'+(Number.isFinite(p)?fmt(variation?p-100:p)+'%':'—')+'\u003c/span>'}\nfunction bars(title,items){const data=items.filter(x=>Number.isFinite(x[1]));if(!data.length)return '\u003cdiv class=\"ml60-chart\">\u003cstrong>'+e(title)+'\u003c/strong>\u003cp class=\"ml60-note\">Dati insufficienti.\u003c/p>\u003c/div>';const max=Math.max(...data.map(x=>Math.max(0,x[1])),.001),width=350,ht=32*data.length+32;return '\u003cdiv class=\"ml60-chart\">\u003cstrong>'+e(title)+'\u003c/strong>\u003csvg viewBox=\"0 0 '+width+' '+ht+'\" role=\"img\" aria-label=\"'+e(title)+'\">'+data.map((a,i)=>{const y=12+i*32,w=Math.max(0,a[1]/max*175);return '\u003ctext x=\"0\" y=\"'+(y+12)+'\" font-size=\"10\" fill=\"#284b65\">'+e(a[0].slice(0,20))+'\u003c/text>\u003crect x=\"130\" y=\"'+y+'\" width=\"'+w+'\" height=\"17\" rx=\"3\" fill=\"'+(['#2475a6','#40a58a','#e89b52','#9a75c3'][i%4])+'\"/>\u003ctext x=\"'+(137+w)+'\" y=\"'+(y+12)+'\" font-size=\"10\" fill=\"#24475d\">'+fmt(a[1])+'\u003c/text>'}).join('')+'\u003c/svg>\u003c/div>'}\nfunction columns(title,items,unit){\n const vals=items.filter(x=>Number.isFinite(x[1]));if(!vals.length)return '\u003cdiv class=\"ml60-chart\">Dati insufficienti\u003c/div>';\n const w=540,h=260,left=54,top=25,base=210,plotW=450,scale=Math.max(...vals.map(x=>Math.abs(x[1])),1),step=plotW/vals.length;\n const color=v=>v\u003c0?'#d46b62':'#2475a6';\n return '\u003cdiv class=\"ml60-chart\">\u003cstrong>'+e(title)+'\u003c/strong>\u003csvg viewBox=\"0 0 '+w+' '+h+'\" role=\"img\" aria-label=\"'+e(title)+'\">'+\n [0,.25,.5,.75,1].map(q=>'\u003cline x1=\"'+left+'\" y1=\"'+(base-160*q)+'\" x2=\"'+(left+plotW)+'\" y2=\"'+(base-160*q)+'\" stroke=\"#e0e8f0\"/>\u003ctext x=\"'+(left-8)+'\" y=\"'+(base-160*q+4)+'\" text-anchor=\"end\" font-size=\"10\" fill=\"#607789\">'+fmt(scale*q)+'\u003c/text>').join('')+\n vals.map((v,i)=>{const x=left+i*step+step*.18,bh=Math.abs(v[1])/scale*160,y=v[1]>=0?base-bh:base;return '\u003crect x=\"'+x+'\" y=\"'+y+'\" width=\"'+(step*.64)+'\" height=\"'+bh+'\" rx=\"3\" fill=\"'+color(v[1])+'\"/>\u003ctext x=\"'+(x+step*.32)+'\" y=\"'+(y-7)+'\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#25465e\">'+fmt(v[1])+(unit||'')+'\u003c/text>\u003ctext x=\"'+(x+step*.32)+'\" y=\"'+(base+20)+'\" text-anchor=\"middle\" font-size=\"10\" fill=\"#536d80\">'+e(String(v[0]).slice(0,13))+'\u003c/text>'}).join('')+'\u003c/svg>\u003c/div>';\n}\nfunction mount(){const root=$('monExercises');if(!root)return;root.innerHTML='';let box=$('ml60Training');if(!box){box=document.createElement('div');box.id='ml60Training';root.append(box)}const d=state.monitoring,all=metrics();if(!settings.metrics.length)settings.metrics=all.slice(0,6).map(x=>x.k);settings.metrics=settings.metrics.filter(k=>all.some(m=>m.k===k));const exercises=[...new Set(d.exercise.map(id).filter(Boolean))].sort(),series=[...new Set(d.series.map(id).filter(Boolean))].sort(),weeks=[...new Set(d.week.map(r=>r.Settimana).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'it',{numeric:true}));if(!exercises.includes(settings.exercise))settings.exercise=exercises[0]||'';if(!series.includes(settings.series))settings.series=series[0]||'';const chosen=d.exercise.find(r=>id(r)===settings.exercise)||d.series.find(r=>id(r)===settings.series);if(!settings.week||!weeks.includes(settings.week))settings.week=weeks.includes($('monWeek')?.value)?$('monWeek').value:weeks[0]||'';\nbox.innerHTML='\u003ch2>TRAINING · Analisi grafica esercitazioni e serie\u003c/h2>\u003cp class=\"ml60-note\">Seleziona i parametri Excel: tutte le analisi sono al minuto e rappresentate graficamente. Le associazioni esercitazione–settimana sono salvate nel browser.\u003c/p>\u003cdiv class=\"ml60-controls\">\u003clabel>Settimana di riferimento\u003cselect id=\"ml60Week\">'+opts(weeks,settings.week)+'\u003c/select>\u003c/label>\u003c/div>\u003ch3>Parametri GPS\u003c/h3>\u003cdiv class=\"ml60-metrics\">'+all.map(m=>'\u003clabel>\u003cinput type=\"checkbox\" data-ml60metric=\"'+e(m.k)+'\" '+(settings.metrics.includes(m.k)?'checked':'')+'>'+e(m.label)+'\u003c/label>').join('')+'\u003c/div>\u003cp class=\"ml60-note\">Confronti esercitazione / modello gara: sempre relativi al minuto. Nessuna tabella.\u003c/p>\u003ch3>Esercitazioni\u003c/h3>\u003cdiv class=\"ml60-controls\">\u003clabel>Seleziona esercitazione\u003cselect id=\"ml60Exercise\">'+opts(exercises,settings.exercise)+'\u003c/select>\u003c/label>\u003clabel>Associa questa esercitazione alla settimana\u003cselect id=\"ml60ExWeek\">\u003coption value=\"\">Non associata\u003c/option>'+opts(weeks,links[settings.exercise]||'')+'\u003c/select>\u003c/label>\u003c/div>\u003cdiv id=\"ml60ExResults\">\u003c/div>\u003ch3>Serie\u003c/h3>\u003cdiv class=\"ml60-controls\">\u003clabel>Seleziona esercitazione con serie\u003cselect id=\"ml60Series\">'+opts(series,settings.series)+'\u003c/select>\u003c/label>\u003clabel>Associa questa esercitazione alla settimana\u003cselect id=\"ml60SeriesWeek\">\u003coption value=\"\">Non associata\u003c/option>'+opts(weeks,links[settings.series]||'')+'\u003c/select>\u003c/label>\u003c/div>\u003cdiv id=\"ml60SeriesResults\">\u003c/div>\u003cp class=\"ml60-note\">Legenda giocatore/ruolo: rosso &lt;90%, giallo 90–99,99%, verde ≥100%, grigio dato assente. Variazione settimana/riferimento: blu &lt;−10%, giallo −10%/+10%, verde +10%/+30%, rosso &gt;+30%.\u003c/p>';\n\n$('ml60Week').onchange=x=>{settings.week=x.target.value;$('monWeek').value=settings.week;renderMonitoringReports();renderResults()};$('ml60Exercise').onchange=x=>{settings.exercise=x.target.value;mount()};$('ml60Series').onchange=x=>{settings.series=x.target.value;mount()};\nfor(const [which,key]of [['ml60ExWeek','exercise'],['ml60SeriesWeek','series']])$(which).onchange=x=>{links[settings[key]]=x.target.value;settings.week=x.target.value||settings.week;if($('ml60Week'))$('ml60Week').value=settings.week;save();renderResults()};\nbox.querySelectorAll('[data-ml60metric]').forEach(el=>el.onchange=()=>{settings.metrics=[...box.querySelectorAll('[data-ml60metric]:checked')].map(x=>x.dataset.ml60metric);renderResults()});renderResults();}\nfunction renderResults(){\n const d=state.monitoring,mm=metrics().filter(m=>settings.metrics.includes(m.k));\n const ex=d.exercise.filter(r=>id(r)===settings.exercise&&String(week(r))===String(settings.week));\n const st=$('ml60SeriesResults'),target=$('ml60ExResults');if(!target)return;\n const players=rs=>[...new Set(rs.map(monKey).filter(Boolean))].sort();\n const role=r=>{const name=monKey(r);const candidate=[r,...d.week.filter(x=>monKey(x)===name),...d.match.filter(x=>monKey(x)===name)];return String(candidate.map(x=>x.Ruolo||x['Originale: RUOLI']||x['Originale: Ruolo']||x['Originale: RUOLO']||'').find(Boolean)||'Non specificato').trim()};\n const model=(name,k)=>{if(!name)return NaN;const min=monNumber($('monMin').value),top=Number($('monBest').value)||3;const values=d.match.filter(r=>monKey(r)===name&&monNumber(r.Minuti)>=min).map(r=>val(r,k)).filter(Number.isFinite).sort((a,b)=>b-a).slice(0,top);return values.length?values.reduce((a,b)=>a+b,0)/values.length:NaN};\n const matchRef=(rs,k)=>{\n  const names=players(rs),vals=names.map(name=>model(name,k)).filter(v=>Number.isFinite(v)&&v>0);\n  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:NaN;\n };\n const compare=(title,rs)=>{\n  if(!rs.length)return '';\n  let h='\u003ch4>'+e(title)+'\u003c/h4>\u003cdiv class=\"ml60-grid\">';\n  for(const m of mm){\n   const actual=avg(rs,m.k),base=matchRef(rs,m.k),percent=pct(actual,base);\n   h+='\u003cdiv class=\"ml60-chart\">\u003cstrong>'+e(m.label)+'\u003c/strong>\u003cdiv class=\"ml62-number\">'+chip(percent)+' \u003csmall>del modello gara /min\u003c/small>\u003c/div>'+\n   columns('Esercitazione vs modello gara /min',[['Esercitazione',actual],['Modello',base]],'')+\n   '\u003cp class=\"ml60-note\">Esercitazione '+fmt(actual)+'/min · Modello '+fmt(base)+'/min\u003c/p>\u003c/div>';\n  }\n  return h+'\u003c/div>';\n };\n if(!ex.length)target.innerHTML='\u003cp class=\"ml60-note\">Associa l’esercitazione alla settimana selezionata.\u003c/p>';\n else {\n  const roles=[...new Set(ex.map(role))].sort(),names=players(ex);\n  let h=compare('Squadra · percentuale del modello gara',ex);\n  h+='\u003ch3>Ruoli\u003c/h3>\u003cdiv class=\"ml60-controls\">\u003clabel>Seleziona ruolo\u003cselect id=\"ml62Role\">'+opts(roles,settings.role||roles[0])+'\u003c/select>\u003c/label>\u003c/div>';\n  if(!roles.includes(settings.role))settings.role=roles[0];\n  h+=compare('Ruolo · '+settings.role,ex.filter(r=>role(r)===settings.role));\n  h+='\u003ch3>Singolo giocatore\u003c/h3>\u003cdiv class=\"ml60-controls\">\u003clabel>Seleziona calciatore\u003cselect id=\"ml62Player\">'+opts(names,settings.player||names[0])+'\u003c/select>\u003c/label>\u003c/div>';\n  if(!names.includes(settings.player))settings.player=names[0];\n  h+=compare('Calciatore · '+settings.player,ex.filter(r=>monKey(r)===settings.player));\n  h+='\u003ch3>Confronto grafico fra giocatori · esercitazione\u003c/h3>\u003cp class=\"ml60-note\">Valori medi per minuto di ciascun giocatore nell’esercitazione selezionata. Il riferimento è il modello delle cinque migliori partite individuali per indicatore.\u003c/p>\u003cdiv class=\"ml60-grid\">';\n  for(const m of mm){const data=names.map(name=>{const rows=ex.filter(r=>monKey(r)===name),actual=avg(rows,m.k),ref=model(name,m.k);return [name,pct(actual,ref)]});h+=bars(m.label+' · % del modello gara',data)}\n  h+='\u003c/div>';\n  target.innerHTML=h;\n  $('ml62Role').onchange=ev=>{settings.role=ev.target.value;renderResults()};\n  $('ml62Player').onchange=ev=>{settings.player=ev.target.value;renderResults()};\n }\n const series=d.series.filter(r=>id(r)===settings.series&&String(week(r))===String(settings.week));\n if(!series.length){st.innerHTML='\u003cp class=\"ml60-note\">Associa l’esercitazione con serie alla settimana selezionata.\u003c/p>';return}\n const names=players(series);\n if(!names.includes(settings.seriesPlayer))settings.seriesPlayer=names[0];\n const seq=r=>String(r.Serie??r.Ordine??r['Originale: Serie']??'');\n const chosen=series.filter(r=>monKey(r)===settings.seriesPlayer).sort((a,b)=>seq(a).localeCompare(seq(b),'it',{numeric:true}));\n let h='\u003cdiv class=\"ml60-controls\">\u003clabel>Calciatore\u003cselect id=\"ml61SeriesPlayer\">'+opts(names,settings.seriesPlayer)+'\u003c/select>\u003c/label>\u003c/div>'+\n '\u003cp class=\"ml60-note\">Tutti i valori sono relativi al minuto. Il decremento confronta l’intensità della prima serie valida con le successive.\u003c/p>\u003cdiv class=\"ml60-grid\">';\n for(const m of mm){\n  const pts=chosen.map((r,i)=>['Serie '+(seq(r)||i+1),val(r,m.k)]);\n  const valid=pts.filter(x=>Number.isFinite(x[1]));\n  const first=valid[0]?.[1],last=valid[valid.length-1]?.[1];\n  const delta=Number.isFinite(first)&&first>0&&Number.isFinite(last)?100*(last-first)/first:NaN;\n  const decreases=valid.map((x,i)=>[x[0],Number.isFinite(first)&&first>0?Math.max(0,100*(first-x[1])/first):NaN]);\n  h+='\u003cdiv class=\"ml60-chart\">\u003cstrong>'+e(m.label)+' /min\u003c/strong>\u003cdiv class=\"ml62-number\">'+(Number.isFinite(delta)?fmt(Math.max(0,-delta))+'%':'—')+' \u003csmall>decremento prima → ultima\u003c/small>\u003c/div>'+\n    columns('Intensità /min per serie',pts,'')+columns('Decremento % dalla prima serie',decreases,'%')+\n    '\u003cp class=\"ml60-note\">Variazioni consecutive: '+valid.slice(1).map((x,i)=>{const prev=valid[i][1];return e(valid[i][0])+' → '+e(x[0])+': '+fmt(prev>0?100*(prev-x[1])/prev:NaN)+'%'}).join(' · ')+'\u003c/p>\u003c/div>';\n }\n h+='\u003c/div>\u003ch3>Confronto grafico tra giocatori · serie\u003c/h3>\u003cp class=\"ml60-note\">Confronto della media per minuto nelle serie disponibili per ogni giocatore; i dati mancanti non vengono stimati.\u003c/p>\u003cdiv class=\"ml60-grid\">';\n for(const m of mm){h+=bars(m.label+' · media /min',names.map(name=>[name,avg(series.filter(r=>monKey(r)===name),m.k)]))}\n h+='\u003c/div>';\n st.innerHTML=h;\n $('ml61SeriesPlayer').onchange=ev=>{settings.seriesPlayer=ev.target.value;renderResults()};\n}\nwindow.ml60RatioBadge=function(r){const c=!Number.isFinite(r)?'':r\u003c1.5?'red':r\u003c2.5?'yellow':r\u003c=3.5?'green':'purple';return '\u003cspan class=\"ml60-tag '+c+'\">'+fmt(r)+'\u003c/span>'};\nwindow.ml60VariationBadge=function(p){return chip(p,true)};\nwindow.ml64Mount=mount;window.renderAdvancedMonAnalyses=mount;\ndocument.addEventListener('DOMContentLoaded',()=>setTimeout(mount,150));\n})();\n\u003c/script>\u003cscript>\n(function(){\n const all=monMetrics.slice();\n window.ml65WeeklyKeys=all.slice(0,6).map(x=>x[0]);\n function draw(){const host=document.getElementById('ml65WeeklyOptions');if(!host)return;host.innerHTML=all.map(([k,label])=>'\u003clabel>\u003cinput type=\"checkbox\" data-ml65-key=\"'+k+'\" '+(window.ml65WeeklyKeys.includes(k)?'checked':'')+'>'+label+'\u003c/label>').join('');host.querySelectorAll('input').forEach(x=>x.addEventListener('change',()=>{window.ml65WeeklyKeys=[...host.querySelectorAll('input:checked')].map(y=>y.dataset.ml65Key);renderMonitoringReports()}));}\n document.addEventListener('DOMContentLoaded',draw);\n})();\n\u003c/script>\u003cstyle>#ml65WeeklyPicker{padding:14px;border:1px solid #c9dbe9;border-radius:12px;background:#f7fbff;margin-bottom:14px}#ml65WeeklyOptions{display:grid;grid-template-columns: s,x)=>s+x,0)/a.length:NaN;\nconst key=r=>String(r.Nome||'').trim(),role=r=>String(r.Ruolo||'Non indicato').trim()||'Non indicato',wk=r=>String(r.Settimana||'').trim();\nconst unique=a=>[...new Set(a.filter(Boolean))];\nconst isMax=k=>/MAXS|MAX SPEED|VELOCITÀ MASSIMA|VELOCITA MASSIMA|V\\s*MAX/i.test(k);\nconst isMean=k=>/RPE|HRL|HR85|PERCENT|%|MEDIA|AVERAGE/i.test(k);\nconst combine=(rows,k)=>{const a=rows.map(r=>num(r[k])).filter(Number.isFinite);return !a.length?NaN:isMax(k)?Math.max(...a):isMean(k)?avg(a):a.reduce((x,y)=>x+y,0)};\nconst pct=(a,b)=>Number.isFinite(a)&&Number.isFinite(b)&&b!==0?(a/b-1)*100:NaN;\nlet metric='',chosen=new Set(),selectedWeek='',scope='squadra',allSelected=true;\nconst getData=()=>{try{return typeof state!=='undefined'&&state.monitoring?state.monitoring:{}}catch(e){return {}}};\nconst getMetrics=rows=>unique(rows.flatMap(r=>Object.keys(r))).filter(k=>(k.startsWith('Originale: ')||['TD_m','HSR_m','SPRINT_m','ACC_n','DEC_n','N_SPRINT'].includes(k))&&rows.some(r=>Number.isFinite(num(r[k]))));\nconst weekSort=(a,b)=>{const ma=a.match(/^(.*?)(\\d+)\\s*$/),mb=b.match(/^(.*?)(\\d+)\\s*$/);return ma&&mb&&ma[1]===mb[1]?Number(ma[2])-Number(mb[2]):a.localeCompare(b,'it',{numeric:true})};\nfunction getWeekValues(rows,k){const map=new Map();for(const r of rows){if(!wk(r)||!key(r))continue;const id=wk(r)+'\\0'+key(r);if(!map.has(id))map.set(id,[]);map.get(id).push(r)}return map}\nfunction table(headers,rows){return '\u003cdiv class=\"mf-table\">\u003ctable>\u003cthead>\u003ctr>'+headers.map(x=>'\u003cth>'+esc(x)+'\u003c/th>').join('')+'\u003c/tr>\u003c/thead>\u003ctbody>'+rows.map(row=>'\u003ctr>'+row.map(x=>'\u003ctd>'+x+'\u003c/td>').join('')+'\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003c/div>'}\nfunction render(){const data=getData(),weeksRows=data.week||[],matchRows=data.match||[];const weeks=unique(weeksRows.map(wk)).sort(weekSort);if(!weeks.includes(selectedWeek))selectedWeek=$('monWeek')?.value&&weeks.includes($('monWeek').value)?$('monWeek').value:weeks.at(-1)||'';const keys=getMetrics([...weeksRows,...matchRows]);if(!keys.includes(metric))metric=keys.find(k=>k==='TD_m')||keys[0]||'';\nconst players=unique(weeksRows.filter(r=>wk(r)===selectedWeek).map(key)).sort((a,b)=>a.localeCompare(b,'it'));if(allSelected){chosen=new Set(players)}else chosen=new Set([...chosen].filter(x=>players.includes(x)));\nlet html='\u003cdiv class=\"mf-head\">\u003ch2>TRAINING · Dashboard monitoraggio\u003c/h2>\u003cdiv>Confronto storico di 5 settimane e rapporto WEEK / MATCH sulle 5 migliori partite\u003c/div>\u003c/div>';\nhtml+='\u003cdiv class=\"mf-grid\">\u003clabel>Settimana di riferimento\u003cselect id=\"mfWeek\">'+weeks.map(w=>'\u003coption '+(w===selectedWeek?'selected':'')+'>'+esc(w)+'\u003c/option>').join('')+'\u003c/select>\u003c/label>\u003clabel>Parametro GPS Excel\u003cselect id=\"mfMetric\">'+keys.map(k=>'\u003coption value=\"'+esc(k)+'\" '+(k===metric?'selected':'')+'>'+esc(k.replace(/^Originale: /,''))+'\u003c/option>').join('')+'\u003c/select>\u003c/label>\u003clabel>Livello confronto\u003cselect id=\"mfScope\">\u003coption value=\"squadra\" '+(scope==='squadra'?'selected':'')+'>Squadra e ruoli\u003c/option>\u003coption value=\"giocatori\" '+(scope==='giocatori'?'selected':'')+'>Giocatori selezionati\u003c/option>\u003c/select>\u003c/label>\u003c/div>';\nif(!weeksRows.length){panel.innerHTML=html+'\u003cdiv class=\"mf-note\">Importa il file Excel dalla sezione CARICAMENTO DATI qui sopra, poi premi “Aggiorna dati da Excel”.\u003c/div>';return}\nhtml+='\u003cdiv class=\"mf-card\">\u003cstrong>Giocatori da confrontare\u003c/strong>\u003cdiv class=\"actions\">\u003cbutton type=\"button\" class=\"alt\" id=\"mfAll\">Seleziona tutti\u003c/button>\u003cbutton type=\"button\" class=\"alt\" id=\"mfNone\">Deseleziona tutti\u003c/button>\u003c/div>\u003cdiv class=\"mf-checks\">'+players.map(p=>'\u003clabel>\u003cinput type=\"checkbox\" data-mf-player=\"'+esc(p)+'\" '+(chosen.has(p)?'checked':'')+'>'+esc(p)+'\u003c/label>').join('')+'\u003c/div>\u003c/div>';\nconst i=weeks.indexOf(selectedWeek),previous=weeks.slice(Math.max(0,i-5),i),current=weeksRows.filter(r=>wk(r)===selectedWeek);const map=getWeekValues(weeksRows,metric);\nconst playerRole=new Map(current.map(r=>[key(r),role(r)]));\nconst playerCur=new Map(players.map(p=>[p,combine(map.get(selectedWeek+'\\0'+p)||[],metric)]));\nconst playerHist=new Map(players.map(p=>[p,previous.map(w=>combine(map.get(w+'\\0'+p)||[],metric)).filter(Number.isFinite)]));\nfunction groupLine(label,ps){const now=ps.map(p=>playerCur.get(p)).filter(Number.isFinite),historical=previous.map(w=>{const values=ps.map(p=>combine(map.get(w+'\\0'+p)||[],metric)).filter(Number.isFinite);return avg(values)}).filter(Number.isFinite);const h=avg(historical),c=avg(now);return {label,c,h,delta:pct(c,h),n:historical.length}}\nconst active=players.filter(p=>chosen.has(p));const groups=scope==='giocatori'?active.map(p=>({label:p,c:playerCur.get(p),h:avg(playerHist.get(p)||[]),delta:pct(playerCur.get(p),avg(playerHist.get(p)||[])),n:(playerHist.get(p)||[]).length})): [groupLine('MEDIA SQUADRA',players),...unique(players.map(p=>playerRole.get(p))).sort().map(r=>groupLine('Ruolo · '+r,players.filter(p=>playerRole.get(p)===r)))];\nhtml+='\u003ch3>1 · Settimana corrente vs media delle 5 settimane precedenti\u003c/h3>\u003cp class=\"mf-muted\">Media per giocatore nel periodo; per squadra e ruolo, media dei valori individuali. Le settimane sono ordinate per etichetta numerica. I valori mancanti non sono considerati zero.\u003c/p>';\nhtml+='\u003cdiv class=\"mf-chart\">'+groups.map(g=>{const d=g.delta,mag=Math.min(50,Math.abs(d||0)),left=Number.isFinite(d)?(d>=0?50:50-mag):50;return '\u003cdiv class=\"mf-barline\">\u003cspan title=\"'+esc(g.label)+'\">'+esc(g.label)+'\u003c/span>\u003cdiv class=\"mf-track\">\u003cdiv class=\"mf-mid\">\u003c/div>'+(Number.isFinite(d)?'\u003cdiv class=\"mf-fill '+(d>=0?'mf-pos':'mf-neg')+'\" style=\"left:'+left+'%;width:'+mag+'%\">\u003c/div>':'')+'\u003c/div>\u003cb>'+(Number.isFinite(d)?(d>0?'+':'')+fmt(d)+'%':'—')+'\u003c/b>\u003c/div>'}).join('')+'\u003c/div>';\nhtml+=table(['Squadra / ruolo / atleta','Settimana attuale','Media storica','Δ %','Settimane storiche'],groups.map(g=>[esc(g.label),fmt(g.c),fmt(g.h),'\u003cspan class=\"'+(g.delta>=0?'mf-good':'mf-low')+'\">'+(Number.isFinite(g.delta)?fmt(g.delta)+'%':'—')+'\u003c/span>',g.n+'/5']));\nif(previous.length\u003c5)html+='\u003cdiv class=\"mf-note\">Sono disponibili soltanto '+previous.length+' settimane precedenti: il confronto non costituisce ancora uno storico completo di 5 settimane.\u003c/div>';\nhtml+='\u003ch3>2 · WEEK / MATCH LOAD · 5 migliori partite individuali\u003c/h3>\u003cp class=\"mf-muted\">Per ogni parametro, selezione delle 5 migliori partite per valore al minuto (minimo 60 minuti). Riferimento: media dei valori totali di quelle partite. Il rapporto è WEEK / MATCH × 100. Per MAXS si usa il massimo settimanale, non una somma.\u003c/p>';\nconst output=players.map(p=>{const curr=playerCur.get(p);const matches=matchRows.filter(r=>key(r)===p&&num(r.Minuti)>=60&&num(r.Minuti)>0&&Number.isFinite(num(r[metric]))).sort((a,b)=>num(b[metric])/num(b.Minuti)-num(a[metric])/num(a.Minuti)).slice(0,5);const ref=avg(matches.map(r=>num(r[metric])));const ratio=Number.isFinite(curr)&&Number.isFinite(ref)&&ref>0?curr/ref*100:NaN;return {p,r:playerRole.get(p),curr,ref,ratio,n:matches.length}});\nconst valid=output.filter(x=>Number.isFinite(x.ratio));const meanRatio=avg(valid.map(x=>x.ratio));const meanCur=avg(output.map(x=>x.curr).filter(Number.isFinite)),meanRef=avg(output.map(x=>x.ref).filter(Number.isFinite));\nconst loadClass=v=>!Number.isFinite(v)?'':v\u003c100?'mf-low':v\u003c200?'mf-warn':v\u003c=300?'mf-good':'mf-red';\nconst cells=output.map(x=>[esc(x.p),esc(x.r),fmt(x.curr),fmt(x.ref),'\u003cspan class=\"'+loadClass(x.ratio)+'\">'+(Number.isFinite(x.ratio)?fmt(x.ratio)+'%':'—')+'\u003c/span>',x.n+'/5']);cells.push(['\u003cstrong>MEDIA SQUADRA\u003c/strong>','—','\u003cstrong>'+fmt(meanCur)+'\u003c/strong>','\u003cstrong>'+fmt(meanRef)+'\u003c/strong>','\u003cstrong class=\"'+loadClass(meanRatio)+'\">'+fmt(meanRatio)+'%\u003c/strong>',valid.length+' giocatori']);\nhtml+=table(['Giocatore','Ruolo','WEEK','MATCH (top 5)','WEEK / MATCH','Partite valide'],cells);\nhtml+='\u003cdiv class=\"mf-note\">Colori descrittivi: blu sotto 100%; giallo da 100% a meno di 200%; verde da 200% a 300% inclusi; rosso sopra 300%. Se ci sono meno di 5 partite valide il numero è esplicitato. Media squadra = media dei rapporti individuali validi.\u003c/div>';\nhtml+='\u003cp class=\"mf-muted\">Le sezioni sottostanti mantengono l’analisi delle esercitazioni, delle serie e dei giocatori. La modalità MATCH resta disponibile dal selettore in alto.\u003c/p>';\npanel.innerHTML=html;\n$('mfWeek').onchange=e=>{selectedWeek=e.target.value;const original=$('monWeek');if(original){original.value=selectedWeek;original.dispatchEvent(new Event('change',{bubbles:true}))}allSelected=true;render()};$('mfMetric').onchange=e=>{metric=e.target.value;render()};$('mfScope').onchange=e=>{scope=e.target.value;render()};$('mfAll').onclick=()=>{allSelected=true;render()};$('mfNone').onclick=()=>{allSelected=false;chosen.clear();render()};panel.querySelectorAll('[data-mf-player]').forEach(el=>el.onchange=()=>{allSelected=false;if(el.checked)chosen.add(el.dataset.mfPlayer);else chosen.delete(el.dataset.mfPlayer);render()});\n}\nwindow.mlFinalDashboardRender=render;\n$('monWorkbookUpdate')?.addEventListener('click',()=>setTimeout(render,1100));$('monWeek')?.addEventListener('change',()=>{const v=$('monWeek').value;if(v&&v!==selectedWeek){selectedWeek=v;allSelected=true;render()}});\nsetTimeout(render,400);\n})();\n\u003c/script>\u003cscript>\n/* MethodLab V4: confronto simultaneo /min con modello gara individuale top 5 */\n(()=>{'use strict';\nconst css=document.createElement('style');css.textContent=`#mlAllPlayersCharts{margin:20px 0}#mlAllPlayersCharts .ap-card{background:#fff;border:1px solid #d7e4e8;border-radius:12px;padding:16px;margin:14px 0}#mlAllPlayersCharts .ap-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}#mlAllPlayersCharts .ap-small{font-size:12px;color:#64748b}#mlAllPlayersCharts .ap-plot{overflow-x:auto;padding:8px 0}#mlAllPlayersCharts .ap-bars{min-width:680px;display:grid;gap:8px}#mlAllPlayersCharts .ap-row{display:grid;grid-template-columns:165px minmax(320px,1fr) 145px;gap:10px;align-items:center;font-size:12px}#mlAllPlayersCharts .ap-track{height:23px;background:#edf2f4;border-radius:5px;position:relative;overflow:hidden}#mlAllPlayersCharts .ap-fill{height:100%;border-radius:4px}#mlAllPlayersCharts .ap-100{position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed #334155;z-index:2}#mlAllPlayersCharts .ap-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:10px 0}#mlAllPlayersCharts .ap-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}#mlAllPlayersCharts .ap-matrix{overflow-x:auto}#mlAllPlayersCharts table{width:100%;border-collapse:collapse}#mlAllPlayersCharts td,#mlAllPlayersCharts th{padding:8px;border-bottom:1px solid #e2e8ec;text-align:left;white-space:nowrap}#mlAllPlayersCharts .ap-note{padding:10px;border-left:3px solid #d6a34d;background:#fffbeb;margin:10px 0;font-size:12px}#mlAllPlayersCharts .ap-val{font-variant-numeric:tabular-nums}#mlAllPlayersCharts .ap-missing{color:#64748b}`;document.head.append(css);\nconst target=document.getElementById('monExercises');if(!target)return;\nconst root=document.createElement('section');root.id='mlAllPlayersCharts';root.className='panel';target.parentNode.insertBefore(root,target);\nroot.innerHTML='\u003ch2>Confronto simultaneo · tutti i giocatori vs modello gara individuale o media ruolo\u003c/h2>\u003cp class=\"ap-small\">Intensità GPS al minuto per esercitazione o singola serie. Quando manca un modello individuale attendibile, si usa la media del ruolo, segnalata come stima.\u003c/p>\u003cdiv class=\"ap-controls\">\u003clabel>Archivio\u003cselect id=\"apType\">\u003coption value=\"exercise\">Esercitazioni\u003c/option>\u003coption value=\"series\">Serie\u003c/option>\u003c/select>\u003c/label>\u003clabel>Esercitazione\u003cselect id=\"apExercise\">\u003c/select>\u003c/label>\u003clabel>Parametro GPS\u003cselect id=\"apMetric\">\u003c/select>\u003c/label>\u003c/div>\u003cdiv id=\"apOutput\">\u003c/div>';\nconst $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst num=x=>{if(typeof x==='number')return Number.isFinite(x)?x:NaN;let t=String(x??'').trim();if(!t)return NaN;if(t.includes(','))t=t.replace(/\\./g,'').replace(',','.');const n=Number(t);return Number.isFinite(n)?n:NaN};\nconst fmt=x=>Number.isFinite(x)?x.toLocaleString('it-IT',{maximumFractionDigits:2}):'—';\nconst get=()=>{try{return state.monitoring||{}}catch(_){return {}}};\nconst player=r=>String([r.Nome||'',r.Cognome||''].join(' ')).trim().toLocaleLowerCase('it');\nconst exname=r=>String(r.Esercizio||r['Originale: ESERCIZIO']||r.Esercitazione||[r.Focus||'',r.Formato||''].filter(Boolean).join(' · ')||'').trim();\nconst metricList=rows=>[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(k=>(k.startsWith('Originale: ')||['TD_m','HSR_m','SPRINT_m','ACC_n','DEC_n','N_SPRINT'].includes(k))&&rows.some(r=>Number.isFinite(num(r[k]))));\nconst isRateMetric=k=>!/MAXS|VELOCIT[ÀA] MASSIMA|RPE|HRL|HR85|MEDIA|%|KM\\/H/i.test(k);\nconst rate=(rows,k)=>{let total=0,mins=0,found=false;for(const r of rows){const v=num(r[k]),m=num(r.Minuti);if(Number.isFinite(v)&&Number.isFinite(m)&&m>0){total+=v;mins+=m;found=true}}return found&&mins>0?total/mins:NaN};\nconst pct=(v,ref)=>Number.isFinite(v)&&Number.isFinite(ref)&&ref>0?100*v/ref:NaN;\nconst refCache=new Map();let cacheMatch=null;\nconst norm=s=>String(s??'').trim().toLocaleLowerCase('it');\nfunction roleOf(name,d){const all=[...(d.match||[]),...(d.week||[]),...(d.exercise||[]),...(d.series||[])];const row=all.find(r=>player(r)===name&&String(r.Ruolo||r['Originale: RUOLO']||r['Originale: RUOLI']||'').trim());return row?String(row.Ruolo||row['Originale: RUOLO']||row['Originale: RUOLI']).trim():''}\nfunction reference(name,k){const d=get(),match=d.match||[];if(cacheMatch!==match){refCache.clear();cacheMatch=match}const cacheKey=name+'\\0'+k;if(refCache.has(cacheKey))return refCache.get(cacheKey);\n const rates=rows=>rows.map(r=>({v:num(r[k]),min:num(r.Minuti)})).filter(r=>Number.isFinite(r.v)&&r.min>0).map(r=>r.v/r.min).filter(v=>Number.isFinite(v)&&v>0).sort((a,b)=>b-a);\n const own=rates(match.filter(r=>player(r)===name&&num(r.Minuti)>=60)).slice(0,5);\n let result;\n if(own.length===5){result={v:own.reduce((a,b)=>a+b,0)/5,n:5,source:'Individuale · 5 partite',role:roleOf(name,d)}}\n else {const role=roleOf(name,d);const peers=match.filter(r=>role&&norm(roleOf(player(r),d))===norm(role)&&num(r.Minuti)>0);\n const peerNames=[...new Set(peers.map(player))].filter(Boolean);\n const strong=peerNames.map(p=>rates(peers.filter(r=>player(r)===p&&num(r.Minuti)>=60)).slice(0,5)).filter(a=>a.length===5).map(a=>a.reduce((x,y)=>x+y,0)/5);\n let refs=strong,source='Media ruolo · modelli completi';\n if(!refs.length){refs=peerNames.map(p=>rates(peers.filter(r=>player(r)===p)).slice(0,5)).filter(a=>a.length).map(a=>a.reduce((x,y)=>x+y,0)/a.length);source='Media ruolo provvisoria · partite disponibili'}\n result={v:refs.length?refs.reduce((a,b)=>a+b,0)/refs.length:NaN,n:own.length,source:refs.length?source:'Nessun riferimento disponibile',role};}\n refCache.set(cacheKey,result);return result}\nconst color=v=>!Number.isFinite(v)?'#94a3b8':v\u003c90?'#c65a59':v\u003c100?'#d5a137':'#248d72';\nfunction chart(rows,k,title){const valid=rows.filter(x=>Number.isFinite(x.percent));const max=Math.max(200,...valid.map(x=>x.percent),1);const refX=100/max*100;return '\u003cdiv class=\"ap-card\">\u003ch3>'+esc(title)+'\u003c/h3>\u003cp class=\"ap-small\">'+esc(k.replace(/^Originale: /,''))+' · % del modello gara individuale (migliori 5 partite per intensità /min). Linea tratteggiata = 100%.\u003c/p>\u003cdiv class=\"ap-plot\">\u003cdiv class=\"ap-bars\">'+rows.map(x=>'\u003cdiv class=\"ap-row\">\u003cspan title=\"'+esc(x.name)+'\">'+esc(x.name)+'\u003c/span>\u003cdiv class=\"ap-track\">\u003cdiv class=\"ap-100\" style=\"left:'+refX+'%\">\u003c/div>'+(Number.isFinite(x.percent)?'\u003cdiv class=\"ap-fill\" style=\"width:'+Math.min(100,x.percent/max*100)+'%;background:'+color(x.percent)+'\">\u003c/div>':'')+'\u003c/div>\u003cstrong class=\"ap-val\">'+(Number.isFinite(x.percent)?fmt(x.percent)+'%':'—')+'\u003c/strong>\u003c/div>').join('')+'\u003c/div>\u003c/div>\u003cdiv class=\"ap-matrix\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Giocatore\u003c/th>\u003cth>Es./serie per min\u003c/th>\u003cth>Modello gara per min\u003c/th>\u003cth>% modello\u003c/th>\u003cth>Partite individuali\u003c/th>\u003cth>Fonte riferimento\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+rows.map(x=>'\u003ctr>\u003ctd>'+esc(x.name)+'\u003c/td>\u003ctd>'+fmt(x.actual)+'\u003c/td>\u003ctd>'+fmt(x.ref.v)+'\u003c/td>\u003ctd style=\"color:'+color(x.percent)+'\">'+(Number.isFinite(x.percent)?fmt(x.percent)+'%':'—')+'\u003c/td>\u003ctd>'+x.ref.n+'/5\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003c/div>'+(rows.some(x=>x.ref.n\u003c5)?'\u003cp class=\"ap-note\">I giocatori senza 5 partite individuali valide vengono confrontati con la media del proprio ruolo. La fonte è indicata per ogni atleta; se mancano dati anche nel ruolo, il confronto resta non disponibile.\u003c/p>':'')+'\u003c/div>'}\nlet previousType='',previousExercise='',previousMetric='';\nfunction render(){const type=$('apType').value,d=get(),all=(d[type]||[]).filter(r=>player(r)&&exname(r));const names=[...new Set(all.map(exname))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));let chosen=$('apExercise').value;if(type!==previousType||!names.includes(chosen))chosen=names[0]||'';previousType=type;\n$('apExercise').innerHTML=names.map(n=>'\u003coption value=\"'+esc(n)+'\" '+(n===chosen?'selected':'')+'>'+esc(n)+'\u003c/option>').join('');const data=all.filter(r=>exname(r)===chosen);const match=d.match||[];const available=metricList(data).filter(k=>match.some(r=>Number.isFinite(num(r[k]))));let metric=$('apMetric').value;if(chosen!==previousExercise||!available.includes(metric))metric=available.includes(previousMetric)?previousMetric:(available.includes('TD_m')?'TD_m':available[0]||'');previousExercise=chosen;previousMetric=metric;\n$('apMetric').innerHTML=available.map(k=>'\u003coption value=\"'+esc(k)+'\" '+(k===metric?'selected':'')+'>'+esc(k.replace(/^Originale: /,''))+'\u003c/option>').join('');if(!data.length){$('apOutput').innerHTML='\u003cdiv class=\"ap-card\">Nessun dato. Importa l’Excel e premi Aggiorna dati da Excel.\u003c/div>';return}if(!available.length){$('apOutput').innerHTML='\u003cdiv class=\"ap-card\">Nessun parametro GPS confrontabile tra questo archivio e DATI PARTITA.\u003c/div>';return}if(!isRateMetric(metric)){$('apOutput').innerHTML='\u003cdiv class=\"ap-card ap-note\">Il parametro selezionato non è un volume cumulabile al minuto (ad esempio velocità massima o RPE). Seleziona un parametro di distanza o conteggio GPS per il confronto /min.\u003c/div>';return}\nconst players=[...new Set(data.map(player))].sort((a,b)=>a.localeCompare(b,'it'));const make=(subset,n)=>{const actual=rate(subset,metric),ref=reference(n,metric);return {name:n,actual,ref,percent:pct(actual,ref.v)}};\nlet html='\u003cp class=\"ap-small\">'+esc(chosen)+' · '+players.length+' giocatori · solo valori al minuto. Il 100% è il riferimento individuale di ciascun atleta, non la media squadra.\u003c/p>';\nif(type==='exercise'){html+=chart(players.map(n=>make(data.filter(r=>player(r)===n),n)),metric,'Esercitazione · tutti i giocatori contemporaneamente')}\nelse {const series=[...new
