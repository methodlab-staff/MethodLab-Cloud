
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MethodLab Cloud</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #1d2939;
      padding: 32px;
      border-radius: 16px;
    }
    h1 { margin-top: 0; }
    p { color: #b9c5d7; }
    input, button {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 12px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      border: 1px solid #718096;
      background: white;
      color: #101827;
    }
    button {
      background: #16a34a;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .link {
      background: transparent;
      color: #93c5fd;
      padding: 8px;
      text-decoration: underline;
    }
    #message {
      min-height: 22px;
      overflow-wrap: anywhere;
    }
    .team {
      padding: 14px;
      margin: 12px 0;
      background: #101827;
      border-radius: 10px;
    }
    .team strong {
      display: block;
      margin-bottom: 6px;
    }
    .team small { color: #b9c5d7; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>MethodLab Cloud</h1>
    <p>Accesso riservato allo staff tecnico</p>

    <section id="login">
      <form id="loginForm">
        <input id="email" type="email"
          placeholder="Email" required
          autocomplete="email">
        <input id="password" type="password"
          placeholder="Password" required
          autocomplete="current-password">
        <button id="loginButton" type="submit">
          Accedi
        </button>
      </form>
      <button class="link" id="forgotButton"
        type="button">
        Password dimenticata?
      </button>
    </section>

    <section id="recovery" hidden>
      <h2>Recupera password</h2>
      <p>Inserisci l'email del tuo account.</p>
      <form id="recoveryForm">
        <input id="recoveryEmail" type="email"
          placeholder="Email" required>
        <button id="recoveryButton" type="submit">
          Invia email di recupero
        </button>
      </form>
      <button class="link" id="backButton"
        type="button">
        Torna al login
      </button>
    </section>

    <section id="newPassword" hidden>
      <h2>Imposta nuova password</h2>
      <form id="passwordForm">
        <input id="newPasswordInput"
          type="password"
          placeholder="Nuova password"
          minlength="12" required
          autocomplete="new-password">
        <button id="savePasswordButton" type="submit">
          Salva nuova password
        </button>
      </form>
    </section>

    <section id="account" hidden>
      <h2>Accesso effettuato</h2>
      <p id="userEmail"></p>
      <p id="teamsStatus">
        Caricamento delle squadre...
      </p>
      <div id="teamsList"></div>
      <button id="logoutButton" type="button">
        Esci
      </button>
    </section>

    <p id="message" role="status"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL =
      "https://vygxyzpncwkwnwygifql.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_R3z-VS0YebzOSCPfxs6F6Q_HLYOIRLk";

    const message = document.getElementById("message");
    const teamsStatus =
      document.getElementById("teamsStatus");
    const teamsList =
      document.getElementById("teamsList");

    let client;
    let recovering = false;
    let activeUserId = null;
    let requestNumber = 0;

    function showSection(id) {
      ["login", "recovery", "newPassword", "account"]
        .forEach(section => {
          document.getElementById(section).hidden =
            section !== id;
        });
    }

    async function loadTeams(userId) {
      const currentRequest = ++requestNumber;

      teamsList.replaceChildren();
      teamsStatus.textContent =
        "Caricamento delle squadre...";

      try {
        const {
          data: memberships,
          error: membershipError
        } = await client
          .from("memberships")
          .select("team_id, role")
          .eq("user_id", userId);

        if (membershipError) throw membershipError;

        if (
          currentRequest !== requestNumber ||
          activeUserId !== userId ||
          recovering
        ) return;

        if (!memberships || memberships.length === 0) {
          teamsStatus.textContent =
            "Nessuna squadra associata al tuo account.";
          return;
        }

        const ids = [
          ...new Set(
            memberships
              .map(m => m.team_id)
              .filter(Boolean)
          )
        ];

        const {
          data: teams,
          error: teamsError
        } = await client
          .from("teams")
          .select("id, name")
          .in("id", ids);

        if (teamsError) throw teamsError;

        if (
          currentRequest !== requestNumber ||
          activeUserId !== userId ||
          recovering
        ) return;

        const teamById = new Map(
          (teams || []).map(t => [t.id, t])
        );

        let shown = 0;

        for (const membership of memberships) {
          const team = teamById.get(membership.team_id);
          if (!team) continue;

          const item = document.createElement("div");
          item.className = "team";

          const title = document.createElement("strong");
          title.textContent = team.name;

          const role = document.createElement("small");
          role.textContent =
            "Ruolo: " + membership.role;

          item.append(title, role);
          teamsList.append(item);
          shown++;
        }

        teamsStatus.textContent = shown
          ? "Le tue squadre:"
          : "Le squadre associate non sono visibili. Verifica i permessi Supabase.";

      } catch (error) {
        if (
          currentRequest !== requestNumber ||
          activeUserId !== userId ||
          recovering
        ) return;

        teamsStatus.textContent =
          "Impossibile caricare le squadre: " +
          error.message;
      }
    }

    function showUser(user) {
      if (recovering) return;

      const userId = user?.id || null;

      showSection(user ? "account" : "login");

      document.getElementById("userEmail").textContent =
        user?.email || "";

      if (userId !== activeUserId) {
        activeUserId = userId;
        ++requestNumber;

        teamsList.replaceChildren();

        if (userId) loadTeams(userId);
      }

      if (!userId) teamsStatus.textContent = "";
    }

    try {
      if (!window.supabase) {
        throw new Error(
          "Libreria Supabase non disponibile."
        );
      }

      client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      client.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") {
          recovering = true;
          ++requestNumber;
          message.textContent = "";
          showSection("newPassword");
        } else if (!recovering) {
          showUser(session?.user || null);
        }
      });

      client.auth.getUser()
        .then(({ data, error }) => {
          if (!error && !recovering) {
            showUser(data.user);
          }
        })
        .catch(error => {
          message.textContent =
            "Errore di connessione: " + error.message;
        });

    } catch (error) {
      message.textContent =
        "Errore di configurazione: " + error.message;

      document.getElementById("loginButton").disabled =
        true;
    }

    document.getElementById("loginForm")
      .addEventListener("submit", async event => {
        event.preventDefault();
        if (!client) return;

        const button =
          document.getElementById("loginButton");

        button.disabled = true;
        message.textContent = "Accesso in corso...";

        try {
          const { error } =
            await client.auth.signInWithPassword({
              email:
                document.getElementById("email").value,
              password:
                document.getElementById("password").value
            });

          message.textContent = error
            ? "Errore di accesso: " + error.message
            : "";

        } catch (error) {
          message.textContent =
            "Errore di connessione: " + error.message;
        } finally {
          button.disabled = false;
        }
      });

    document.getElementById("forgotButton")
      .addEventListener("click", () => {
        document.getElementById("recoveryEmail").value =
          document.getElementById("email").value;

        message.textContent = "";
        showSection("recovery");
      });

    document.getElementById("backButton")
      .addEventListener("click", () => {
        message.textContent = "";
        showSection("login");
      });

    document.getElementById("recoveryForm")
      .addEventListener("submit", async event => {
        event.preventDefault();
        if (!client) return;

        const button =
          document.getElementById("recoveryButton");

        button.disabled = true;
        message.textContent = "Invio in corso...";

        try {
          const { error } =
            await client.auth.resetPasswordForEmail(
              document.getElementById("recoveryEmail").value,
              {
                redirectTo:
                  "https://methodlab-cloud.vercel.app/"
              }
            );

          message.textContent = error
            ? "Errore Supabase: " + error.message
            : "Se l'account esiste, riceverai un'email con il link per reimpostare la password.";

        } catch (error) {
          message.textContent =
            "Errore di connessione: " + error.message;
        } finally {
          button.disabled = false;
        }
      });

    document.getElementById("passwordForm")
      .addEventListener("submit", async event => {
        event.preventDefault();
        if (!client) return;

        const button =
          document.getElementById("savePasswordButton");

        button.disabled = true;
        message.textContent = "Salvataggio in corso...";

        try {
          const { error } =
            await client.auth.updateUser({
              password:
                document.getElementById("newPasswordInput").value
            });

          if (error) {
            message.textContent =
              "Errore: " + error.message;
          } else {
            recovering = false;
            await client.auth.signOut();

            activeUserId = null;
            ++requestNumber;

            showSection("login");
            message.textContent =
              "Password aggiornata. Ora puoi accedere.";
          }

        } catch (error) {
          message.textContent =
            "Errore di connessione: " + error.message;
        } finally {
          button.disabled = false;
        }
      });

    document.getElementById("logoutButton")
      .addEventListener("click", async () => {
        if (!client) return;

        try {
          const { error } =
            await client.auth.signOut();

          if (error) throw error;

          showUser(null);
          message.textContent = "";

        } catch (error) {
          message.textContent =
            "Errore durante l'uscita: " + error.message;
        }
      });
  </script>
</body>
</html>
