(!relative?' selected':'')+'>Valore totale\u003c/option>\u003c/select>\u003c/label>\u003c/div>'+\n   '\u003cdiv class=\"ml-all-legend\">\u003cspan class=\"ml-all-key\" style=\"background:#1679b3\">\u003c/span>Partita selezionata \u003cspan class=\"ml-all-key\" style=\"background:#e0a52e\">\u003c/span>Media altre partite · stesso giocatore. La percentuale è partita / storico × 100.\u003c/div>'+\n   '\u003cdiv class=\"ml-all-scroll\">'+svg+'\u003c/div>\u003cdiv class=\"ml-all-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Giocatore\u003c/th>\u003cth>Partita\u003c/th>\u003cth>Media storico\u003c/th>\u003cth>Rapporto\u003c/th>\u003cth>Partite riferimento\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n   rows.map(r=>'\u003ctr>\u003ctd>'+esc(r.name)+'\u003c/td>\u003ctd>'+(Number.isFinite(r.a)?r.a.toFixed(2):'—')+'\u003c/td>\u003ctd>'+(Number.isFinite(r.b)?r.b.toFixed(2):'—')+'\u003c/td>\u003ctd>'+(Number.isFinite(r.percent)?r.percent.toFixed(0)+'%':'—')+'\u003c/td>\u003ctd>'+r.n+'\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003c/div>';\n  $('mlAllMetric').onchange=e=>{chosenMetric=e.target.value;render()};$('mlAllMode').onchange=e=>{chosenMode=e.target.value;render()};\n }\n document.addEventListener('DOMContentLoaded',()=>{setTimeout(render,300);$('monMatch')?.addEventListener('change',()=>setTimeout(render,0));$('monWorkbookUpdate')?.addEventListener('click',()=>setTimeout(render,1000));$('ml48Match')?.addEventListener('click',()=>setTimeout(render,50))});\n})();\n\u003c/script>\n\u003cscript>\n(function(){\n\"use strict\";\nconst $id=id=>document.getElementById(id);\nconst safe=v=>String(v??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst num=v=>{const n=typeof monNumber==='function'?monNumber(v):Number(v);return Number.isFinite(n)?n:NaN};\nconst fmt=v=>Number.isFinite(v)?v.toLocaleString('it-IT',{maximumFractionDigits:2}):'—';\nconst person=r=>typeof monKey==='function'?monKey(r):[r.Nome,r.Cognome].filter(Boolean).join(' ');\nconst dayOf=r=>String(r.Data||r.Giorno||r.MD||'').trim();\nconst metricDefs=()=>typeof monMetrics!=='undefined'?monMetrics:[];\nfunction getWeek(){return $id('mlPdfWeek')?.value||$id('monWeek')?.value||''}\nfunction sync(){\n const m=window.state?.monitoring||(typeof state!=='undefined'?state.monitoring:null);\n if(!m)return;\n const week=$id('mlPdfWeek'),current=week.value||$id('monWeek')?.value;\n const weeks=[...new Set((m.week||[]).map(r=>String(r.Settimana||'')).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));\n if(week.options.length!==weeks.length||weeks.some((w,i)=>week.options[i]?.value!==w)){\n   week.replaceChildren(...weeks.map(w=>new Option(w,w)));\n   week.value=weeks.includes(current)?current:(weeks.at(-1)||'');\n }\n const host=$id('mlPdfMetrics');\n if(!host.childElementCount)host.innerHTML=metricDefs().map(([k,label],i)=>'\u003clabel style=\"display:flex;gap:7px;align-items:center\">\u003cinput type=\"checkbox\" data-mlpdf-metric=\"'+safe(k)+'\" '+(i\u003c6?'checked':'')+'>'+safe(label)+'\u003c/label>').join('');\n const days=[...new Set((m.week||[]).filter(r=>String(r.Settimana||'').trim()===String(getWeek()).trim()).map(dayOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));\n const day=$id('mlPdfDay'),before=day.value;\n day.replaceChildren(...days.map(d=>new Option(d,d)));\n if(days.includes(before))day.value=before;\n $id('mlPdfTrainingStatus').textContent=days.length?'Giornate disponibili: '+days.length+'. La sintesi usa solo righe con la giornata selezionata.':'Nessuna giornata identificabile nei dati importati: per il report giornaliero occorre una colonna Data, Giorno o MD.';\n}\nfunction metrics(){const keys=[...$id('mlPdfMetrics').querySelectorAll('input:checked')].map(e=>e.dataset.mlpdfMetric);return metricDefs().filter(([k])=>keys.includes(k))}\nfunction aggregate(rows,k){const vals=rows.map(r=>num(r[k])).filter(Number.isFinite);return vals.length?vals.reduce((a,b)=>a+b,0):NaN}\nfunction table(headers,rows){return '\u003ctable>\u003cthead>\u003ctr>'+headers.map(x=>'\u003cth>'+safe(x)+'\u003c/th>').join('')+'\u003c/tr>\u003c/thead>\u003ctbody>'+rows.map(r=>'\u003ctr>'+r.map(x=>'\u003ctd>'+safe(x)+'\u003c/td>').join('')+'\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>'}\nfunction model(name,k){\n if(typeof monModelRate==='function'){const v=monModelRate(name,k);if(Number.isFinite(v)&&v>0)return {value:v,source:'Individuale'}}\n const m=state.monitoring,first=[...m.match,...m.exercise,...m.series].find(r=>person(r)===name);\n const role=first?.Ruolo||first?.Posizione||'';\n const peers=m.match.filter(r=>r.Ruolo===role&&role&&num(r.Minuti)>0&&num(r[k])>=0);\n const rates=peers.map(r=>num(r[k])/num(r.Minuti)).filter(v=>Number.isFinite(v)&&v>0);\n return rates.length?{value:rates.reduce((a,b)=>a+b,0)/rates.length,source:'Media ruolo (provvisoria)'}:{value:NaN,source:'Non disponibile'};\n}\nfunction bars(rows,k){\n const max=Math.max(100,...rows.map(r=>Number.isFinite(r.pct)?r.pct:0));\n return '\u003cdiv class=\"graph\">'+rows.map(r=>'\u003cdiv class=\"barline\">\u003cspan>'+safe(r.name)+'\u003c/span>\u003cdiv class=\"track\">\u003cdiv class=\"fill\" style=\"width:'+Math.max(0,Math.min(100,(r.pct||0)/max*100))+'%\">\u003c/div>\u003c/div>\u003cb>'+fmt(r.pct)+'%\u003c/b>\u003c/div>').join('')+'\u003cp class=\"hint\">100% = modello prestativo al minuto; la barra indica il rapporto del volume giornaliero rispetto al modello di un minuto (non un rapporto di intensità).\u003c/p>\u003c/div>';\n}\nfunction printReport(title,body,statusId){\n const css='@page{size:A4;margin:12mm}body{font:11px Arial,sans-serif;color:#19334a}h1{font-size:23px;color:#17536e}h2{font-size:16px;border-bottom:2px solid #c8dbe7;padding-bottom:6px}h3{font-size:13px}table{border-collapse:collapse;width:100%;font-size:9px;margin:12px 0}th{background:#17536e;color:#fff;text-align:left}td,th{padding:6px;border:1px solid #dce6ed}tr{break-inside:avoid}.graph{margin:15px 0;break-inside:avoid}.barline{display:flex;align-items:center;gap:7px;margin:6px 0}.barline span{width:140px;flex-shrink:0}.barline b{width:65px}.track{background:#e4edf3;flex:1;height:12px}.fill{background:#2786ae;height:100%}.hint{font-size:9px;color:#607588}.section{break-inside:auto;margin:16px 0}.page{break-before:page}';\n const html='\u003c!doctype html>\u003chtml lang=\"it\">\u003cmeta charset=\"utf-8\">\u003ctitle>'+safe(title)+'\u003c/title>\u003cstyle>'+css+'\u003c/style>\u003cbody>\u003ch1>'+safe(title)+'\u003c/h1>\u003cp>MethodLab · '+new Date().toLocaleDateString('it-IT')+' · dati importati localmente\u003c/p>'+body+'\u003cp class=\"hint\">I dati assenti sono indicati con —. Verificare sempre le unità e la completezza del file Excel.\u003c/p>\u003cscript>window.addEventListener(\"load\",()=>setTimeout(()=>window.print(),400))\u003c\\/script>\u003c/body>\u003c/html>';\n const frame=document.createElement('iframe');frame.style.cssText='position:fixed;left:-9999px;top:0;width:900px;height:1100px;border:0';document.body.append(frame);frame.onload=()=>{try{frame.contentWindow.focus();frame.contentWindow.print()}catch(e){$id(statusId).textContent=\"Stampa automatica non disponibile: apri il report con il browser.\"}};frame.srcdoc=html;\n $id(statusId).textContent='Report generato: nella finestra di stampa scegli «Salva come PDF».';\n setTimeout(()=>frame.remove(),90000);\n}\nfunction daily(){\n const m=state.monitoring,day=$id('mlPdfDay').value,week=getWeek(),defs=metrics();\n if(!day||!defs.length){$id('mlPdfTrainingStatus').textContent='Seleziona una giornata e almeno un parametro.';return}\n const source=[...m.exercise,...m.series];\n let rows=source.filter(r=>dayOf(r)===day);\n // Evita somma duplicata di esercitazioni e serie per lo stesso carico.\n const exercise=m.exercise.filter(r=>dayOf(r)===day);\n if(exercise.length)rows=exercise;\n else rows=m.week.filter(r=>String(r.Settimana||'')===week&&dayOf(r)===day);\n if(!rows.length){$id('mlPdfTrainingStatus').textContent='Nessun dato GPS associato alla giornata selezionata.';return}\n const names=[...new Set(rows.map(person).filter(Boolean))].sort();\n const summary=names.map(n=>[n,...defs.map(([k])=>fmt(aggregate(rows.filter(r=>person(r)===n),k)))]);\n let body='\u003csection class=\"section\">\u003ch2>Giornata '+safe(day)+' · Settimana '+safe(week)+'\u003c/h2>\u003cp>Giocatori: '+names.length+' · Fonte: '+(exercise.length?'ESERCITAZIONI':'DATI SETTIMANA')+'\u003c/p>\u003ch2>Tabella dati · parametri selezionati\u003c/h2>'+table(['Giocatore',...defs.map(x=>x[1])],summary)+'\u003c/section>';\n for(const [k,label,unit] of defs){\n  const data=names.map(name=>{const mine=rows.filter(r=>person(r)===name),total=aggregate(mine,k),minutes=aggregate(mine,'Minuti'),ref=model(name,k);return {name,total,minutes,ref,pct:Number.isFinite(total)&&minutes>0&&ref.value>0?total/minutes/ref.value*100:NaN}});\n  body+='\u003csection class=\"section\">\u003ch2>'+safe(label)+' · confronto individuale al minuto\u003c/h2>\u003cp>Valore/min giornaliero confrontato con il modello prestativo individuale o, se assente, con la media del ruolo.\u003c/p>'+bars(data,k)+table(['Giocatore','Totale','Minuti','Valore/min','Modello/min','% modello','Riferimento'],data.map(r=>[r.name,fmt(r.total),fmt(r.minutes),fmt(r.total/r.minutes),fmt(r.ref.value),fmt(r.pct),r.ref.source]))+'\u003c/section>';\n }\n printReport('TRAINING · Report sintetico giornaliero',body,'mlPdfTrainingStatus');\n}\nfunction weekly(){\n const week=getWeek();\n if(!week||!state.monitoring.week.some(r=>String(r.Settimana)===week)){$id('mlPdfTrainingStatus').textContent='Seleziona una settimana con dati.';return}\n // Riutilizza il report dettagliato esistente per mantenere tutte le analisi.\n $id('pdfReportType').value='week';$id('pdfReportFormat').value='full';$id('pdfCharts').checked=true;$id('pdfTables').checked=true;\n $id('monWeek').value=week;\n if(typeof pdfGenerateAll==='function')pdfGenerateAll();\n $id('mlPdfTrainingStatus').textContent='Report settimanale dettagliato avviato: scegli «Salva come PDF».';\n}\nfunction match(){\n if(!$id('monMatch').value){$id('mlPdfMatchStatus').textContent='Seleziona prima una partita.';return}\n $id('pdfReportType').value='match';$id('pdfReportFormat').value='full';$id('pdfCharts').checked=true;$id('pdfTables').checked=true;\n if(typeof pdfGenerateAll==='function')pdfGenerateAll();\n $id('mlPdfMatchStatus').textContent='Report partita completo avviato: scegli «Salva come PDF».';\n}\ndocument.addEventListener('DOMContentLoaded',()=>{\n $id('mlPdfWeek')?.addEventListener('change',sync);\n $id('mlPdfDailyBtn')?.addEventListener('click',daily);\n $id('mlPdfWeeklyBtn')?.addEventListener('click',weekly);\n $id('mlPdfMatchBtn')?.addEventListener('click',match);\n $id('monWorkbookUpdate')?.addEventListener('click',()=>{setTimeout(sync,700);setTimeout(sync,1700)});\n sync();\n});\n})();\n\u003c/script>\u003cscript>\n/* STEP 5B — report visuali, una pagina A4 per atleta. */\n(function(){\n'use strict';\nconst E=id=>document.getElementById(id);\nconst esc=v=>String(v??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;','\\'':'&#39;'}[c]));\nconst val=v=>typeof monNumber==='function'?monNumber(v):Number(v);\nconst f=v=>Number.isFinite(v)?v.toLocaleString('it-IT',{maximumFractionDigits:1}):'—';\nconst who=r=>typeof monKey==='function'?monKey(r):[r.Nome,r.Cognome].join(' ').trim().toLowerCase();\nconst defs=()=>typeof monMetrics!=='undefined'?monMetrics:[];\nconst sum=(rs,k)=>{const vs=rs.map(r=>val(r[k])).filter(Number.isFinite);return vs.length?vs.reduce((a,b)=>a+b,0):NaN};\nconst mean=vs=>{const ok=vs.filter(Number.isFinite);return ok.length?ok.reduce((a,b)=>a+b,0)/ok.length:NaN};\nconst percent=(v,ref)=>Number.isFinite(v)&&ref>0?100*v/ref:NaN;\nconst matchKey=r=>String(r.Partita||'');\nfunction model(n,k){const own=typeof monModelRate==='function'?monModelRate(n,k):NaN;if(own>0)return {v:own,label:'Modello individuale'};const role=state.monitoring.match.find(r=>who(r)===n)?.Ruolo||state.monitoring.week.find(r=>who(r)===n)?.Ruolo||'';const peers=state.monitoring.match.filter(r=>role&&r.Ruolo===role&&val(r.Minuti)>0).map(r=>val(r[k])/val(r.Minuti));const avg=mean(peers);return {v:avg,label:Number.isFinite(avg)?'Media ruolo (provvisoria)':'Non disponibile'};}\nfunction bar(label,pct,note){\n const ok=Number.isFinite(pct),width=ok?Math.min(100,Math.max(0,pct/2)):0;\n const hue=!ok?'#aeb9c6':pct\u003c100?'#2476c8':pct\u003c200?'#e4b34e':pct\u003c=300?'#3a9a67':'#cf5b52';\n return '\u003cdiv class=\"metric\">\u003cdiv class=\"metric-head\">\u003cspan>'+esc(label)+'\u003c/span>\u003cstrong>'+ (ok?f(pct)+'%':'n.d.')+'\u003c/strong>\u003c/div>\u003cdiv class=\"track\">\u003cdiv class=\"fill\" style=\"width:'+width+'%;background:'+hue+'\">\u003c/div>\u003ci class=\"mark\">\u003c/i>\u003c/div>\u003cdiv class=\"note\">'+esc(note)+'\u003c/div>\u003c/div>';\n}\nfunction playerPage(n,rows,kind,caption,chosen){\n const cards=chosen.slice(0,kind==='weekly'?5:9).map(([k,label,unit])=>{\n  const mine=rows.filter(r=>who(r)===n),total=sum(mine,k),mins=sum(mine,'Minuti');\n  let current=kind==='match'?(mins>0?total/mins:NaN):total;\n  let reference,refLabel;\n  if(kind==='match'){\n    const others=state.monitoring.match.filter(r=>who(r)===n&&matchKey(r)!==E('monMatch').value&&val(r.Minuti)>0).map(r=>val(r[k])/val(r.Minuti));\n    reference=mean(others);refLabel='Media altre partite';\n  }else if(kind==='daily'){\n    const mod=model(n,k);reference=Number.isFinite(mod.v)?mod.v*90:NaN;refLabel=mod.label+' (proiezione su 90 min)';\n  }else{\n    const weeks=[...new Set(state.monitoring.week.map(r=>String(r.Settimana||'')))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));\n    const idx=weeks.indexOf(E('mlPdfWeek').value||E('monWeek').value);\n    const prior=weeks.slice(Math.max(0,idx-5),idx);\n    reference=mean(prior.map(w=>sum(state.monitoring.week.filter(r=>who(r)===n&&String(r.Settimana)===w),k)));\n    refLabel='Media '+prior.length+' settimane precedenti';\n  }\n  const pct=percent(current,reference);\n  let out=bar(label,pct,'Totale: '+f(current)+' '+esc(unit)+(kind==='match'?'/min':'')+' · Rif.: '+f(reference)+' · '+refLabel);\n  if(kind==='weekly'){\n   const role=mine[0]?.Ruolo||mine[0]?.Posizione||'';\n   const match90=model(n,k);\n   const matchRef=Number.isFinite(match90.v)?match90.v*90:NaN;\n   out+=bar('WEEK / MATCH · '+label,percent(total,matchRef),'Totale settimana: '+f(total)+' '+esc(unit)+' · Modello partita 90 min: '+f(matchRef)+' · '+match90.label);\n  }\n  return out;\n }).join('');\n const minutes=sum(rows.filter(r=>who(r)===n),'Minuti');\n let details='';\n if(kind==='daily'){\n  const week=E('mlPdfWeek').value,day=E('mlPdfDay').value;\n  details=mlPdfActivity(n,mlPdfLinksFor(week,day),chosen);\n }\n if(kind==='weekly'){\n  const week=E('mlPdfWeek').value||E('monWeek').value;\n  details=mlPdfActivity(n,mlPdfLinksFor(week),chosen);\n }\n return '\u003csection class=\"sheet athlete\">\u003cdiv class=\"eyebrow\">METHODLAB / '+esc(kind.toUpperCase())+'\u003c/div>\u003ch1>'+esc(n)+'\u003c/h1>\u003cdiv class=\"subtitle\">'+esc(caption)+'\u003c/div>\u003cdiv class=\"hero\">\u003cdiv>\u003csmall>MINUTI RILEVATI\u003c/small>\u003cb>'+f(minutes)+'\u003c/b>\u003c/div>\u003cdiv>\u003csmall>PARAMETRI ANALIZZATI\u003c/small>\u003cb>'+chosen.length+'\u003c/b>\u003c/div>\u003cdiv>\u003csmall>RIFERIMENTO\u003c/small>\u003cb>'+esc(kind==='weekly'?'Storico settimanale':kind==='match'?'Altre partite':'Modello gara')+'\u003c/b>\u003c/div>\u003c/div>\u003ch2>Prestazione e confronto\u003c/h2>\u003cdiv class=\"metrics\">'+cards+'\u003c/div>'+(details?'\u003cp class=\"note\">Dettaglio esercitazioni nelle pagine successive.\u003c/p>':'')+'\u003cdiv class=\"footer\">Barre: percentuale del riferimento · linea verticale: 100% · dati assenti: n.d.\u003cspan>MethodLab\u003c/span>\u003c/div>\u003c/section>';\n}\nfunction mlPdfActivityPages(n,kind,chosen){\n if(kind==='match')return '';\n const week=E('mlPdfWeek')?.value||E('monWeek')?.value,day=kind==='daily'?E('mlPdfDay')?.value:null;\n const links=mlPdfLinksFor(week,day);\n let html='';\n for(const link of links){\n  const {er,sr}=mlPdfDataForLink(link),personEx=er.filter(r=>who(r)===n),personSr=sr.filter(r=>who(r)===n);\n  const params=chosen;\n  const ids=[...new Set(personSr.map(r=>String(r.Serie||r.Ordine||'').trim()))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));\n  // Sezione esercitazione: tutti i parametri, suddivisi per evitare sovrapposizioni A4.\n  const exGroups=[];\n  for(let i=0;i\u003cparams.length;i+=8)exGroups.push(params.slice(i,i+8));\n  if(!exGroups.length)exGroups.push([]);\n  for(let i=0;personEx.length&&i\u003cexGroups.length;i++){\n   html+='\u003csection class=\"sheet activity-sheet\">\u003cdiv class=\"eyebrow\">METHODLAB / ESERCITAZIONE\u003c/div>\u003ch1>'+esc(n)+'\u003c/h1>\u003cdiv class=\"subtitle\">'+esc(link.day+' · '+link.name)+' · '+esc(week)+(exGroups.length>1?' · Parte '+(i+1)+'/'+exGroups.length:'')+'\u003c/div>\u003ch2>Totali esercitazione e intensità/min\u003c/h2>';\n   if(!personEx.length)html+='\u003cp class=\"note\">Totali esercitazione non disponibili per questo giocatore.\u003c/p>';\n   for(const [k,label,unit] of exGroups[i]){\n    if(!personEx.length)break;\n    const v=sum(personEx,k),mins=sum(personEx,'Minuti'),rate=mins>0?v/mins:NaN,mod=model(n,k);\n    html+=bar(label,percent(rate,mod.v),'Totale '+f(v)+' '+unit+' · '+f(rate)+' '+unit+'/min · Modello gara '+f(mod.v)+' '+unit+'/min');\n   }\n   if(i===exGroups.length-1){const comments=mlTrainingActivityComment(kind,exGroups[i]);html+='\u003cdiv class=\"mlm-detail-comment\">'+comments+'\u003c/div>';}\n   html+='\u003cdiv class=\"footer\">Confronto esercitazione / modello gara\u003cspan>MethodLab\u003c/span>\u003c/div>\u003c/section>';\n  }\n  // Serie separate: un'unica scheda compatta per gruppo di parametri, con decremento rispetto alla serie precedente.\n  if(ids.length){\n   const seriesById=ids.map(id=>personSr.filter(r=>String(r.Serie||r.Ordine||'').trim()===id));\n   const metricGroups=[];\n   for(let i=0;i\u003cparams.length;i+=5)metricGroups.push(params.slice(i,i+5));\n   for(let g=0;g\u003cmetricGroups.length;g++){\n    html+='\u003csection class=\"sheet activity-sheet series-sheet\">\u003cdiv class=\"eyebrow\">METHODLAB / SERIE SEPARATE\u003c/div>\u003ch1>'+esc(n)+'\u003c/h1>\u003cdiv class=\"subtitle\">'+esc(link.day+' · '+link.name)+' · '+esc(week)+(metricGroups.length>1?' · Parametri '+(g+1)+'/'+metricGroups.length:'')+'\u003c/div>\u003ch2>Serie separate · decremento percentuale\u003c/h2>';\n    for(const [k,label,unit] of metricGroups[g]){\n     html+='\u003cdiv class=\"series-metric\">\u003ch3>'+esc(label)+'\u003c/h3>\u003cdiv class=\"series-grid\">';\n     let prevRate=NaN;\n     for(let i=0;i\u003cids.length;i++){\n      const part=seriesById[i],v=sum(part,k),mins=sum(part,'Minuti'),rate=mins>0?v/mins:NaN,mod=model(n,k);\n      const delta=Number.isFinite(prevRate)&&prevRate>0&&Number.isFinite(rate)?100*(rate/prevRate-1):NaN;\n      const deltaText=i===0?'Base':Number.isFinite(delta)?(delta>0?'+':'')+f(delta)+'%':'n.d.';\n      const deltaColor=i===0?'#667d8b':delta\u003c0?'#b63c37':delta>0?'#187d62':'#667d8b';\n      html+='\u003cdiv class=\"series-cell\">\u003cdiv class=\"series-cell-top\">\u003cb>Serie '+esc(ids[i])+'\u003c/b>\u003cstrong style=\"color:'+deltaColor+'\">'+deltaText+'\u003c/strong>\u003c/div>\u003cdiv class=\"series-rate\">'+f(rate)+' \u003csmall>'+esc(unit)+'/min\u003c/small>\u003c/div>\u003cdiv class=\"series-track\">\u003cdiv style=\"width:'+Math.max(0,Math.min(100,Number.isFinite(rate)&&Number.isFinite(mod.v)&&mod.v>0?rate/mod.v*100:0))+'%;height:100%;background:#2681a2\">\u003c/div>\u003c/div>\u003cdiv class=\"series-sub\">Tot. '+f(v)+' '+esc(unit)+' · Modello '+f(mod.v)+'/min\u003c/div>\u003c/div>';\n      prevRate=rate;\n     }\n     html+='\u003c/div>\u003c/div>';\n    }\n    html+='\u003cdiv class=\"footer\">Variazione % rispetto alla serie precedente · rosso: decremento · verde: incremento\u003cspan>MethodLab\u003c/span>\u003c/div>\u003c/section>';\n   }\n  }\n\n }\n return html;\n}\nfunction overview(kind,caption,rows,chosen){\n const names=[...new Set(rows.map(who).filter(Boolean))].sort();\n const currentWeek=E('mlPdfWeek')?.value||E('monWeek')?.value;\n const weeks=[...new Set(state.monitoring.week.map(r=>String(r.Settimana||'')))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));\n const idx=weeks.indexOf(currentWeek),prior=weeks.slice(Math.max(0,idx-5),idx);\n let html='\u003csection class=\"sheet athlete team-sheet\">\u003cdiv class=\"eyebrow\">METHODLAB / SQUADRA · '+esc(kind.toUpperCase())+'\u003c/div>\u003ch1>Media squadra\u003c/h1>\u003cdiv class=\"subtitle\">'+esc(caption)+'\u003c/div>\u003cdiv class=\"hero\">\u003cdiv>\u003csmall>GIOCATORI\u003c/small>\u003cb>'+names.length+'\u003c/b>\u003c/div>\u003cdiv>\u003csmall>PARAMETRI\u003c/small>\u003cb>'+chosen.length+'\u003c/b>\u003c/div>\u003cdiv>\u003csmall>CONFRONTO\u003c/small>\u003cb>'+esc(kind==='weekly'?'Storico + WEEK/MATCH':kind==='match'?'Altre partite':'Modello gara 90′')+'\u003c/b>\u003c/div>\u003c/div>\u003ch2>Prestazione media della squadra\u003c/h2>\u003cdiv class=\"metrics\">';\n for(const [k,label,unit] of chosen.slice(0,kind==='weekly'?5:9)){\n  const actuals=[],refs=[],weekMatch=[];\n  for(const n of names){\n   const mine=rows.filter(r=>who(r)===n),total=sum(mine,k),mins=sum(mine,'Minuti');\n   const actual=kind==='match'?(mins>0?total/mins:NaN):total;\n   let ref=NaN;\n   if(kind==='daily'){const rate=model(n,k).v;ref=Number.isFinite(rate)?rate*90:NaN}\n   else if(kind==='match')ref=mean(state.monitoring.match.filter(r=>who(r)===n&&matchKey(r)!==E('monMatch').value&&val(r.Minuti)>0).map(r=>val(r[k])/val(r.Minuti)));\n   else ref=mean(prior.map(w=>sum(state.monitoring.week.filter(r=>who(r)===n&&String(r.Settimana)===w),k)));\n   if(Number.isFinite(actual)&&Number.isFinite(ref)&&ref>0){actuals.push(actual);refs.push(ref)}\n   if(kind==='weekly'){const rate=model(n,k).v;if(Number.isFinite(total)&&Number.isFinite(rate)&&rate>0)weekMatch.push([total,rate*90])}\n  }\n  const avg=mean(actuals),reference=mean(refs);\n  html+=bar(label,percent(avg,reference),'Media '+f(avg)+' '+esc(unit)+(kind==='match'?'/min':'')+' · Riferimento medio '+f(reference)+' · '+actuals.length+' giocatori confrontabili');\n  if(kind==='weekly')html+=bar('WEEK / MATCH · '+label,percent(mean(weekMatch.map(x=>x[0])),mean(weekMatch.map(x=>x[1]))),'Volume medio settimana vs modello gara medio 90′ · '+weekMatch.length+' giocatori');\n }\n return html+'\u003c/div>\u003cdiv class=\"footer\">Media dei giocatori con dati e riferimento validi · linea tratteggiata: 100%\u003cspan>MethodLab\u003c/span>\u003c/div>\u003c/section>';\n}\n\n/* DATI WCS: lettura del tracciato reale del file Excel MethodLab.\n   Il file di riferimento ha i dati da C2 in poi sfalsati di una colonna\n   rispetto alle intestazioni (C=Ruolo, D=Nome, E=Minuti, F=TD). */\nasync function mlReadWcsSheet(file){\n const zip=await monZipEntries(file);\n const xml=async path=>{const entry=zip.get(path);if(!entry)throw Error('WCS: file XLSX incompleto ('+path+')');return monXml(await entry())};\n const wb=await xml('xl/workbook.xml'),rels=await xml('xl/_rels/workbook.xml.rels');\n const sheet=[...wb.getElementsByTagName('*')].find(e=>e.localName==='sheet'&&/^DATI\\s+WCS$/i.test(e.getAttribute('name')||''));\n if(!sheet)return [];\n const id=sheet.getAttribute('r:id')||sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');\n const rel=[...rels.getElementsByTagName('*')].find(e=>e.localName==='Relationship'&&e.getAttribute('Id')===id);\n if(!rel)throw Error('Relazione foglio DATI WCS non trovata');\n let path=rel.getAttribute('Target');path=path.startsWith('/')?path.slice(1):'xl/'+path.replace(/^\\.\\.\\//,'');\n let strings=[];\n if(zip.has('xl/sharedStrings.xml')){const doc=await xml('xl/sharedStrings.xml');strings=[...doc.getElementsByTagName('*')].filter(x=>x.localName==='si').map(si=>[...si.getElementsByTagName('*')].filter(t=>t.localName==='t').map(t=>t.textContent).join(''))}\n const doc=await xml(path),raw=[];\n for(const row of [...doc.getElementsByTagName('*')].filter(e=>e.localName==='row')){\n  const cells=[];\n  for(const c of monXmlChildren(row,'c')){\n   const i=monColIndex(c.getAttribute('r')||''),v=monXmlChildren(c,'v')[0],inline=monXmlChildren(c,'is')[0];\n   let value=v?v.textContent:inline?inline.textContent:'';\n   if(c.getAttribute('t')==='s')value=strings[Number(value)]??'';\n   cells[i]=String(value??'').trim();\n  }\n  raw.push({number:Number(row.getAttribute('r')),cells});\n }\n const head=raw.find(r=>r.number===1)?.cells||[];\n const norm=x=>String(x||'').toUpperCase().replace(/\\s+/g,'').trim();\n const findHead=part=>head.findIndex(h=>norm(h).startsWith(norm(part)));\n const positions={TD_m:findHead('TD'),HSR_m:findHead('DS20'),SPRINT_m:findHead('DS22.5'),ACC_n:findHead('AC>3.0'),DEC_n:findHead('DC\u003c-3.0'),N_SPRINT:findHead('SPR(n)')};\n const out=[];\n for(const {number,cells:v} of raw){\n  if(number\u003c=1)continue;\n  const slot=Number(v[1]),name=String(v[3]||'').trim(),mins=monNumber(v[4]);\n  if(!name||!Number.isInteger(slot)||slot\u003c1||slot>6||!(mins>0))continue;\n  const record={Partita:String(v[0]||'').trim(),WCS:slot,Ruolo:String(v[2]||'').trim(),Nome:name,Cognome:'',Minuti:mins};\n  for(const [key,index] of Object.entries(positions))record[key]=index>=0?monNumber(v[index+1]):NaN;\n  out.push(record);\n }\n return out;\n}\nif(typeof monReadWorkbook==='function'){\n const mlOriginalWorkbook=monReadWorkbook;\n monReadWorkbook=async function(file){\n  const result=await mlOriginalWorkbook(file);\n  result['DATI WCS']=await mlReadWcsSheet(file);\n  if(state?.monitoring)state.monitoring.wcs=result['DATI WCS'];\n  return result;\n };\n}\n/* MATCH sintetico: media del ruolo nella partita, ultimi cinque match >60', classifiche. */\nfunction mlMatchHistory(n,current){\n const seen=new Set(),out=[];\n // L'ordine delle righe importate è l'unica cronologia disponibile nel formato attuale.\n for(const r of [...state.monitoring.match].reverse()){\n  const id=matchKey(r);\n  if(who(r)!==n||id===current||seen.has(id)||!(val(r.Minuti)>60))continue;\n  seen.add(id);out.push(r);\n  if(out.length===5)break;\n }\n return out;\n}\nfunction mlMatchStat(rows,k,rate){\n const minutes=sum(rows,'Minuti'),total=sum(rows,k);\n return rate?(minutes>0?total/minutes:NaN):total;\n}\nfunction mlMatchCompareChart(title,items,unit){\n const max=Math.max(1,...items.map(x=>Number.isFinite(x.v)?x.v:0));\n return '\u003cdiv class=\"mlm-chart\">\u003ch3>'+esc(title)+'\u003c/h3>'+items.map(x=>'\u003cdiv class=\"mlm-barline\">\u003cspan>'+esc(x.label)+'\u003c/span>\u003cdiv class=\"mlm-rail\">\u003ci style=\"width:'+Math.max(0,Math.min(100,Number.isFinite(x.v)?100*x.v/max:0))+'%;background:'+x.color+'\">\u003c/i>\u003c/div>\u003cb>'+f(x.v)+' '+esc(unit)+'\u003c/b>\u003c/div>').join('')+'\u003c/div>';\n}\nfunction mlMatchRanking(rows,k,label,unit,rate){\n const entries=[...new Set(rows.map(who))].map(n=>({n,v:mlMatchStat(rows.filter(r=>who(r)===n),k,rate)})).filter(x=>Number.isFinite(x.v)).sort((a,b)=>b.v-a.v);\n const max=Math.max(1,...entries.map(x=>x.v));\n return '\u003cdiv class=\"mlm-ranking\">\u003ch3>'+esc(label)+(rate?' · rel/min':' · totale')+'\u003c/h3>'+entries.map((x,i)=>'\u003cdiv class=\"mlm-rankline\">\u003cspan>'+(i+1)+'. '+esc(x.n)+'\u003c/span>\u003cdiv class=\"mlm-rail\">\u003ci style=\"width:'+100*x.v/max+'%;background:#2188a3\">\u003c/i>\u003c/div>\u003cb>'+f(x.v)+' '+esc(unit)+(rate?'/min':'')+'\u003c/b>\u003c/div>').join('')+'\u003c/div>';\n}\n\nfunction mlWcsSlot(r){return Number(r.WCS)-1}\nfunction mlWcsMatchId(v){return String(v||'').toLocaleLowerCase('it').replace(/\\bvs\\.?\\s*/g,'').replace(/[^a-z0-9]/g,'')}\nfunction mlWcsRows(name,match){\n const id=mlWcsMatchId(match),player=String(name).toLocaleLowerCase('it').trim();\n return (state.monitoring.wcs||[]).filter(r=>String(r.Nome||'').toLocaleLowerCase('it').trim()===player&&mlWcsMatchId(r.Partita)===id);\n}\nfunction mlWcsCharts(name,match,chosen){\n const rows=mlWcsRows(name,match);\n let out='\u003cdiv class=\"mlwcs\">\u003ch2>Analisi WCS · periodi consecutivi da 15′\u003c/h2>';\n if(!rows.length)return out+'\u003cp class=\"mlm-note\">Nessun dato WCS per questo giocatore e questa partita nel foglio DATI WCS.\u003c/p>\u003c/div>';\n out+='\u003cdiv class=\"mlwcs-grid\">';\n for(const [k,label,unit] of chosen){\n  const data=Array.from({length:6},(_,i)=>{\n   const records=rows.filter(r=>mlWcsSlot(r)===i),minutes=records.reduce((a,r)=>a+(Number.isFinite(monNumber(r.Minuti))?monNumber(r.Minuti):0),0);\n   const values=records.map(r=>monNumber(r[k])).filter(Number.isFinite);\n   const total=values.length?values.reduce((a,b)=>a+b,0):NaN;\n   return {total,rate:minutes>0&&Number.isFinite(total)?total/minutes:NaN,minutes};\n  });\n  const draw=(field,caption)=>{\n   const max=Math.max(1,...data.map(d=>d[field]).filter(Number.isFinite));\n   return '\u003cdiv class=\"mlwcs-mode\">\u003cdiv class=\"mlwcs-mode-title\">'+esc(caption)+'\u003c/div>\u003cdiv class=\"mlwcs-columns\">'+data.map((d,i)=>{\n    const v=d[field],previous=i?data[i-1][field]:NaN;\n    const delta=Number.isFinite(v)&&Number.isFinite(previous)&&previous>0?100*(v/previous-1):NaN;\n    const h=Number.isFinite(v)?Math.max(2,100*v/max):0;\n    return '\u003cdiv class=\"mlwcs-col\">\u003cdiv class=\"mlwcs-val\">'+(Number.isFinite(v)?f(v):'—')+'\u003c/div>\u003cdiv class=\"mlwcs-stick\">\u003ci style=\"height:'+h+'%\">\u003c/i>\u003c/div>\u003csmall>'+(i*15)+'–'+((i+1)*15)+'′\u003c/small>\u003cem style=\"color:'+(delta\u003c0?'#b53c3c':'#19805e')+'\">'+(i===0?'base':Number.isFinite(delta)?(delta>0?'+':'')+f(delta)+'%':'—')+'\u003c/em>\u003c/div>';\n   }).join('')+'\u003c/div>\u003c/div>';\n  };\n  out+='\u003cdiv class=\"mlwcs-param\">\u003ch3>'+esc(label)+'\u003c/h3>\u003cdiv class=\"mlwcs-dual\">'+draw('total',unit+' totali')+draw('rate',unit+'/min')+'\u003c/div>\u003c/div>';\n }\n return out+'\u003c/div>\u003cdiv class=\"mlwcs-unit\">Le percentuali indicano la variazione rispetto al periodo precedente. Il relativo/min usa TIME (min) del foglio DATI WCS. — = dato non disponibile.\u003c/div>\u003c/div>';\n}\nfunction mlMatchTeamPage(rows,names,chosen,current,caption){\n let html='\u003csection class=\"sheet mlm-sheet mlm-player\">\u003cdiv class=\"eyebrow\">METHODLAB / MATCH · MEDIA SQUADRA\u003c/div>\u003ch1>Modello squadra\u003c/h1>\u003cdiv class=\"subtitle\">'+esc(caption)+' · '+names.length+' giocatori\u003c/div>\u003cdiv class=\"mlm-legend\">\u003cspan>\u003ci style=\"background:#2579b9\">\u003c/i>Partita\u003c/span>\u003cspan>\u003ci style=\"background:#d9a339\">\u003c/i>Media storico\u003c/span>\u003cspan>\u003ci style=\"background:#32946c\">\u003c/i>Massimo storico\u003c/span>\u003c/div>\u003cdiv class=\"mlm-player-grid\">';\n for(const [k,label,unit] of chosen){\n  const currentTotal=mean(names.map(n=>mlMatchStat(rows.filter(r=>who(r)===n),k,false)));\n  const currentRate=mean(names.map(n=>mlMatchStat(rows.filter(r=>who(r)===n),k,true)));\n  const histories=names.map(n=>mlMatchHistory(n,current));\n  const meanTotal=mean(histories.map(h=>mean(h.map(r=>val(r[k])))));\n  const maxTotal=mean(histories.map(h=>{const a=h.map(r=>val(r[k])).filter(Number.isFinite);return a.length?Math.max(...a):NaN}));\n  const meanRate=mean(histories.map(h=>mean(h.map(r=>mlMatchStat([r],k,true)))));\n  const maxRate=mean(histories.map(h=>{const a=h.map(r=>mlMatchStat([r],k,true)).filter(Number.isFinite);return a.length?Math.max(...a):NaN}));\n  const render=(values,title)=>{const maximum=Math.max(1,...values.filter(Number.isFinite));return '\u003cdiv class=\"mlm-mini\">\u003cdiv class=\"mlm-mini-label\">'+esc(title)+'\u003c/div>'+values.map((v,i)=>'\u003cdiv class=\"mlm-mini-row\">\u003cspan>'+['Partita','Media','Massimo'][i]+'\u003c/span>\u003cdiv class=\"mlm-rail\">\u003ci style=\"width:'+(Number.isFinite(v)?Math.max(0,Math.min(100,100*v/maximum)):0)+'%;background:'+['#2579b9','#d9a339','#32946c'][i]+'\">\u003c/i>\u003c/div>\u003cb>'+f(v)+'\u003c/b>\u003c/div>').join('')+'\u003c/div>'};\n  html+='\u003cdiv class=\"mlm-parameter\">\u003ch3>'+esc(label)+'\u003c/h3>\u003cdiv class=\"mlm-dual\">'+render([currentTotal,meanTotal,maxTotal],unit+' · totale')+render([currentRate,meanRate,maxRate],unit+'/min')+'\u003c/div>\u003c/div>';\n }\n return html+'\u003c/div>\u003cdiv class=\"mlm-foot\">Media aritmetica dei valori individuali. Il modello squadra è la media dei modelli individuali, calcolati sulle ultime cinque partite valide oltre 60′.\u003c/div>\u003c/section>';\n}\n/* Conclusioni automatiche MATCH: regole trasparenti, nessun servizio online. */\nfunction mlMatchConclusions(rows,names,chosen,current,caption){\n const fmt=x=>Number.isFinite(x)?(x>0?'+':'')+f(x)+'%':'n.d.';\n const matchWcs=(state.monitoring.wcs||[]).filter(r=>mlWcsMatchId(r.Partita)===mlWcsMatchId(current)&&names.some(n=>String(n).toLocaleLowerCase('it').trim()===String(r.Nome||'').toLocaleLowerCase('it').trim()));\n let html='\u003csection class=\"sheet mlm-sheet mlm-summary mlm-summary-all\">\u003cdiv class=\"eyebrow\">METHODLAB / MATCH · SINTESI AUTOMATICA\u003c/div>\u003ch1>Analisi conclusiva\u003c/h1>\u003cdiv class=\"subtitle\">'+esc(caption)+'\u003c/div>\u003cp class=\"mlm-note\">Tutti i parametri GPS selezionati: volume totale, intensità relativa/min, distribuzione individuale e andamento dei sei periodi WCS.\u003c/p>';\n let validCount=0;\n for(const [k,label,unit] of chosen){\n  const evaluations=[];\n  for(const rate of [false,true]){\n   const values=[];\n   for(const n of names){\n    const currentRows=rows.filter(r=>who(r)===n),hist=mlMatchHistory(n,current);\n    const actual=mlMatchStat(currentRows,k,rate);\n    const baseline=mean(hist.map(r=>mlMatchStat([r],k,rate)).filter(Number.isFinite));\n    if(Number.isFinite(actual)&&Number.isFinite(baseline)&&baseline>0)values.push({name:n,delta:100*(actual/baseline-1)});\n   }\n   evaluations.push(values);\n  }\n  const periods=Array.from({length:6},(_,i)=>{\n   const subset=matchWcs.filter(r=>mlWcsSlot(r)===i);\n   const rates=subset.map(r=>{const v=monNumber(r[k]),m=monNumber(r.Minuti);return Number.isFinite(v)&&m>0?v/m:NaN}).filter(Number.isFinite);\n   return {index:i,rate:mean(rates),count:rates.length};\n  }).filter(x=>Number.isFinite(x.rate));\n  const describe=values=>{\n   if(!values.length)return 'Storico insufficiente';\n   const delta=mean(values.map(x=>x.delta)),above=values.filter(x=>x.delta>0).length;\n   return '\u003cstrong>'+fmt(delta)+'\u003c/strong> sul modello medio · '+above+'/'+values.length+' giocatori sopra riferimento';\n  };\n  let wcs='WCS non disponibile';\n  if(periods.length>=2){\n   const hi=periods.reduce((a,b)=>a.rate>=b.rate?a:b),lo=periods.reduce((a,b)=>a.rate\u003c=b.rate?a:b);\n   const span=x=>(x.index*15)+'–'+((x.index+1)*15)+'′';\n   const diff=hi.rate>0?100*(lo.rate/hi.rate-1):NaN;\n   wcs='Picco '+span(hi)+' · minimo '+span(lo)+' · '+fmt(diff)+' dal picco';\n  }else if(periods.length===1)wcs='Un solo periodo WCS valido';\n  const total=evaluations[0],rel=evaluations[1];\n  const high=rel.length?[...rel].sort((a,b)=>b.delta-a.delta)[0]:null;\n  const low=rel.length?[...rel].sort((a,b)=>a.delta-b.delta)[0]:null;\n  html+='\u003cdiv class=\"mlm-conclusion mlm-conclusion-param\">\u003ch3>'+esc(label)+' \u003csmall>'+esc(unit)+'\u003c/small>\u003c/h3>\u003cdiv class=\"mlm-summary-grid\">\u003cdiv>\u003cb>Totale\u003c/b>\u003cp>'+describe(total)+'\u003c/p>\u003c/div>\u003cdiv>\u003cb>Rel/min\u003c/b>\u003cp>'+describe(rel)+'\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"mlm-summary-extra\">\u003cb>Confronto individuale rel/min:\u003c/b> '+(high?'migliore '+esc(high.name)+' ('+fmt(high.delta)+'); minore '+esc(low.name)+' ('+fmt(low.delta)+').':'storico insufficiente.')+'\u003c/p>\u003cp class=\"mlm-summary-extra\">\u003cb>WCS rel/min:\u003c/b> '+wcs+'.\u003c/p>\u003c/div>';\n  validCount++;\n }\n if(!validCount)html+='\u003cp>Nessun parametro GPS selezionato.\u003c/p>';\n html+='\u003cp class=\"mlm-foot\">Le variazioni sono medie delle differenze percentuali individuali rispetto alle ultime cinque partite disponibili oltre 60′, escluse quelle della gara analizzata. WCS: media dei valori per minuto dei giocatori disponibili in ciascun periodo consecutivo di 15′. Le differenze non dimostrano da sole cause fisiche o tattiche.\u003c/p>\u003c/section>';\n return html;\n}\n/* Prima pagina MATCH: lettura rapida della squadra e di ciascun atleta. */\n/* Pagina editoriale: interpretazione, non duplicazione delle tabelle. */\nfunction mlNarrativePage(kind,rows,caption,chosen,current){\n const names=[...new Set(rows.map(who).filter(Boolean))];\n const isMatch=kind==='match',isWeek=kind==='weekly';\n const fmt=x=>(x>=0?'+':'')+f(x)+'%';\n const week=E('mlPdfWeek')?.value||E('monWeek')?.value;\n const weeks=[...new Set((state.monitoring.week||[]).map(r=>String(r.Settimana||'')))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));\n const pos=weeks.indexOf(String(week)),previous=pos>0?weeks.slice(Math.max(0,pos-5),pos):[];\n // I filtri valgono esclusivamente per il commento interpretativo:\n // tabelle, grafici e dati originali rimangono completi.\n const trainingDaysFor=n=>{\n  const sameWeek=(state.monitoring.week||[]).filter(r=>who(r)===n&&String(r.Settimana||'').trim()===String(week||'').trim());\n  const days=new Set(sameWeek.map(r=>String(r.Data||r.Giorno||r.MD||'').trim()).filter(Boolean));\n  return days.size;\n };\n const includedNames=names.filter(n=>{\n  if(isMatch)return sum(rows.filter(r=>who(r)===n),'Minuti')>=30;\n  if(!isWeek)return true; // Il sintetico è giornaliero: nessuna soglia di presenze settimanali.\n  return trainingDaysFor(n)>=4;\n });\n const excludedCount=names.length-includedNames.length;\n const records=includedNames.map(n=>{\n  const mine=rows.filter(r=>who(r)===n);\n  const hist=isMatch?mlMatchHistory(n,current):[];\n  const metrics=chosen.map(([k,label])=>{\n   const minutes=sum(mine,'Minuti');\n   const actual=isMatch?mlMatchStat(mine,k,true):isWeek?sum(mine,k):(minutes>0?sum(mine,k)/minutes:NaN);\n   let baseline;\n   if(isMatch)baseline=mean(hist.map(r=>mlMatchStat([r],k,true)).filter(Number.isFinite));\n   else if(isWeek)baseline=mean(previous.map(w=>sum((state.monitoring.week||[]).filter(r=>who(r)===n&&String(r.Settimana||'')===w),k)).filter(x=>x>0));\n   else{const m=model(n,k);baseline=Number.isFinite(m.v)?m.v:NaN}\n   const matchRate=model(n,k).v;\n   const matchD=minutes>0&&Number.isFinite(matchRate)&&matchRate>0?100*((sum(mine,k)/minutes)/matchRate-1):NaN;\n   return {label,d:Number.isFinite(actual)&&Number.isFinite(baseline)&&baseline>0?100*(actual/baseline-1):NaN,matchD};\n  }).filter(x=>Number.isFinite(x.d));\n  return {n,metrics,mins:sum(mine,'Minuti')};\n });\n const metrics=chosen.map(([k,label])=>{\n  const d=records.map(r=>r.metrics.find(m=>m.label===label)?.d).filter(Number.isFinite);\n  return {label,d:mean(d),count:d.length};\n }).filter(x=>Number.isFinite(x.d));\n const matchMetrics=chosen.map(([k,label])=>{\n  const values=records.map(r=>r.metrics.find(m=>m.label===label)?.matchD).filter(Number.isFinite);\n  return {label,d:mean(values),count:values.length};\n }).filter(x=>Number.isFinite(x.d));\n const sorted=[...metrics].sort((a,b)=>b.d-a.d),higher=sorted[0],lower=sorted[sorted.length-1];\n const eligible=records.filter(r=>r.metrics.length),withAbove=eligible.filter(r=>mean(r.metrics.map(m=>m.d))>0);\n const outliers=records.map(r=>({n:r.n,d:mean(r.metrics.map(m=>m.d))})).filter(r=>Number.isFinite(r.d));\n const high=outliers.length?[...outliers].sort((a,b)=>b.d-a.d)[0]:null;\n const low=outliers.length?[...outliers].sort((a,b)=>a.d-b.d)[0]:null;\n const noun=isMatch?'partita':isWeek?'settimana':'seduta';\n let observations=[];\n if(excludedCount)observations.push('Per rendere il confronto attendibile, sono esclusi da questa lettura '+excludedCount+' giocatori '+(isMatch?'con meno di 30 minuti nella partita':'con meno di quattro sedute distinte nella settimana selezionata')+'. Restano presenti nelle tabelle e nei grafici del report.');\n if(metrics.length){\n  observations.push('Il profilo GPS della '+noun+' è '+(mean(metrics.map(m=>m.d))>=0?'mediamente superiore':'mediamente inferiore')+' ai riferimenti disponibili. Il confronto è calcolato sugli scostamenti individuali, non sui volumi aggregati.');\n  if(isWeek&&matchMetrics.length)observations.push('Intensità della settimana rispetto al modello partita individuale (tutti i valori relativi al minuto, media degli scostamenti dei giocatori con almeno quattro sedute): '+matchMetrics.map(x=>x.label+' '+fmt(x.d)).join('; ')+'. Questo confronto descrive l’intensità, non il volume settimanale.');\n  if(isWeek&&metrics.length)observations.push('Volume della settimana rispetto alle settimane precedenti (media fino a cinque settimane, stessi giocatori): '+metrics.map(x=>x.label+' '+fmt(x.d)).join('; ')+'.');\n  if(!isWeek&&!isMatch&&matchMetrics.length)observations.push('Intensità della singola seduta rispetto al modello partita individuale, per minuto: '+matchMetrics.map(x=>x.label+' '+fmt(x.d)).join('; ')+'.');\n  if(isMatch&&metrics.length)observations.push('Lettura di tutti i parametri rispetto allo storico: '+metrics.map(x=>x.label+' '+fmt(x.d)).join('; ')+'. '+(higher&&lower&&higher.label!==lower.label?'Il maggior scostamento è su '+higher.label+', il minore su '+lower.label+'.':'')+' Le variazioni descrivono i carichi, non la qualità della prestazione.');\n  if(eligible.length)observations.push('La risposta non è uniforme: '+withAbove.length+' giocatori su '+eligible.length+' con storico confrontabile hanno uno scostamento medio positivo sui parametri disponibili.'+(high&&low&&high.n!==low.n?' Tra gli estremi del gruppo: '+high.n+' ('+fmt(high.d)+') e '+low.n+' ('+fmt(low.d)+').':''));\n }else observations.push('Non sono disponibili riferimenti storici sufficienti per il confronto principale con '+(isMatch?'le partite precedenti':isWeek?'le settimane precedenti':'il modello partita')+'. Le pagine successive mostrano i valori rilevati.');\n if(isWeek&&!metrics.length&&matchMetrics.length)observations.push('È comunque disponibile il confronto dell’intensità settimanale al minuto con il modello partita individuale: '+matchMetrics.map(x=>x.label+' '+fmt(x.d)).join('; ')+'.');\n if(isMatch){\n  const wcs=(state.monitoring.wcs||[]).filter(r=>mlWcsMatchId(r.Partita)===mlWcsMatchId(current)&&includedNames.includes(who(r)));\n  if(wcs.length){\n   const descriptions=[];\n   for(const [key,label] of chosen){\n    const periods=Array.from({length:6},(_,i)=>{\n     const periodRows=wcs.filter(r=>mlWcsSlot(r)===i);\n     const rates=periodRows.map(r=>{\n      const v=monNumber(r[key]),m=monNumber(r.Minuti);\n      return Number.isFinite(v)&&Number.isFinite(m)&&m>0?v/m:NaN;\n     }).filter(Number.isFinite);\n     return {i,v:rates.length?mean(rates):NaN};\n    }).filter(x=>Number.isFinite(x.v));\n    if(periods.length\u003c2)continue;\n    const hi=periods.reduce((a,b)=>a.v>=b.v?a:b);\n    const lo=periods.reduce((a,b)=>a.v\u003c=b.v?a:b);\n    const period=x=>(x.i*15)+'–'+((x.i+1)*15)+'′';\n    descriptions.push(label+': picco '+period(hi)+', minimo '+period(lo));\n   }\n   if(descriptions.length)observations.push('Distribuzione WCS nei sei periodi consecutivi da 15′ (valori per minuto, tutti i parametri selezionati): '+descriptions.join('; ')+'. Il picco è relativo al singolo parametro e non indica necessariamente la fase migliore della partita.');\n   else observations.push('Dati WCS presenti, ma non sufficienti per confrontare almeno due periodi nei parametri selezionati.');\n  }\n\n }else{\n  const links=mlPdfLinksFor(week,isWeek?null:E('mlPdfDay')?.value);\n  if(links.length){\n   observations.push('La giornata comprende '+links.length+' esercitazioni associate. Il confronto seguente valuta l’intensità al minuto di ciascuna esercitazione rispetto al modello partita individuale, non il solo volume accumulato.');\n   for(const link of links){\n    const data=mlPdfDataForLink(link).er;\n    const participants=names.filter(n=>data.some(r=>who(r)===n));\n    const changes=chosen.map(([k,label])=>{\n     const deltas=participants.map(n=>{\n      const part=data.filter(r=>who(r)===n),mins=sum(part,'Minuti'),m=model(n,k);\n      return mins>0&&Number.isFinite(m.v)&&m.v>0?100*((sum(part,k)/mins)/m.v-1):NaN;\n     }).filter(Number.isFinite);\n     return {label,d:mean(deltas),count:deltas.length};\n    }).filter(x=>Number.isFinite(x.d));\n    if(changes.length){\n     const up=changes.filter(x=>x.d>=0),down=changes.filter(x=>x.d\u003c0);\n     const top=[...changes].sort((a,b)=>b.d-a.d)[0],low=[...changes].sort((a,b)=>a.d-b.d)[0];\n     observations.push('Esercitazione '+link.name+' ('+participants.length+' giocatori): '+up.length+' parametri sopra e '+down.length+' sotto l’intensità gara. Maggiore intensità relativa su '+top.label+' ('+fmt(top.d)+'), minore su '+low.label+' ('+fmt(low.d)+'). '+changes.map(x=>x.label+' '+fmt(x.d)).join('; ')+'.');\n    }else observations.push('Esercitazione '+link.name+': nessun confronto attendibile con il modello gara per i parametri selezionati.');\n   }\n  }\n }\n let html='\u003csection class=\"sheet mlm-sheet ml-narrative\">\u003cdiv class=\"eyebrow\">METHODLAB / '+(isMatch?'MATCH':'TRAINING')+' · LETTURA TECNICA\u003c/div>\u003ch1>Come leggere '+(isMatch?'il match':isWeek?'la settimana':'la seduta')+'\u003c/h1>\u003cdiv class=\"subtitle\">'+esc(caption)+'\u003c/div>';\n html+='\u003cp class=\"ml-narrative-intro\">Una lettura sintetica dei dati che mette in relazione '+(isMatch?'questa partita con le precedenti':'questa giornata con il modello gara individuale e con l’intensità delle esercitazioni')+'. I numeri completi sono nelle pagine successive.\u003c/p>';\n html+='\u003cdiv class=\"ml-narrative-list\">'+observations.map((v,i)=>'\u003cdiv class=\"ml-narrative-point\">\u003cb>'+String(i+1).padStart(2,'0')+'\u003c/b>\u003cp>'+esc(v)+'\u003c/p>\u003c/div>').join('')+'\u003c/div>';\n html+='\u003cdiv class=\"ml-narrative-method\">\u003cstrong>Riferimento di confronto\u003c/strong>\u003cp>'+(isMatch?'Nell’analisi interpretativa sono inclusi solo i giocatori con almeno 30 minuti nella partita. Riferimento: ultime cinque partite storiche valide (>60 minuti) per ciascun giocatore; confronto sui valori per minuto.':isWeek?'Nell’analisi interpretativa sono inclusi solo i giocatori con almeno quattro sedute distinte nella settimana. Doppio confronto: intensità media settimanale per minuto rispetto al modello partita individuale per minuto; volume totale della settimana rispetto alla media delle cinque settimane precedenti disponibili.':'Tutti i giocatori presenti nella giornata sono inclusi, senza soglia di sedute settimanali. Intensità GPS per minuto della seduta confrontata con il modello partita individuale per minuto.')+'\u003c/p>\u003cp>Uno scostamento positivo non significa automaticamente prestazione migliore; considerare ruolo, minutaggio, obiettivi e contesto.\u003c/p>\u003c/div>\u003c/section>';\n return html;\n}\nfunction mlMatchOpeningPage(rows,names,chosen,current,caption){\n return mlNarrativePage('match',rows,caption,chosen,current);\n}\nfunction mlMatchReport(rows,caption,chosen){\n const names=[...new Set(rows.map(who).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));\n const current=E('monMatch').value;\n const roles=new Map();\n for(const r of rows){\n  const role=String(r.Ruolo||'').trim().toLowerCase()||'non indicato';\n  if(!roles.has(role))roles.set(role,new Set());\n  roles.get(role).add(who(r));\n }\n const headers=chosen.map(([k,label])=>'\u003cth colspan=\"2\">'+esc(label)+'\u003c/th>').join('');\n let html=mlMatchOpeningPage(rows,names,chosen,current,caption);\n html+='\u003csection class=\"sheet mlm-sheet\">\u003cdiv class=\"eyebrow\">METHODLAB / MATCH · REPORT SINTETICO\u003c/div>\u003ch1>Analisi squadra\u003c/h1>\u003cdiv class=\"subtitle\">'+esc(caption)+'\u003c/div>\u003ch2>Rispetto alla media del ruolo · totali e rel/min\u003c/h2>\u003cp class=\"mlm-note\">Verde ≥70% · giallo 40–69,9% · rosso &lt;40%. Media dei giocatori dello stesso ruolo nella partita.\u003c/p>\u003ctable class=\"mlm-table\">\u003cthead>\u003ctr>\u003cth rowspan=\"2\">Giocatore\u003c/th>\u003cth rowspan=\"2\">Ruolo\u003c/th>\u003cth rowspan=\"2\">Min.\u003c/th>'+headers+'\u003c/tr>\u003ctr>'+chosen.map(()=>'\u003cth>Tot.\u003c/th>\u003cth>/min\u003c/th>').join('')+'\u003c/tr>\u003c/thead>\u003ctbody>';\n for(const n of names){\n  const mine=rows.filter(r=>who(r)===n),role=String(mine[0]?.Ruolo||'').trim().toLowerCase()||'non indicato';\n  html+='\u003ctr>\u003ctd>'+esc(n)+'\u003c/td>\u003ctd>'+esc(role)+'\u003c/td>\u003ctd>'+f(sum(mine,'Minuti'))+'\u003c/td>';\n  for(const [k] of chosen){\n   const peerNames=[...(roles.get(role)||[])];\n   for(const rate of [false,true]){\n    const ref=mean(peerNames.map(p=>mlMatchStat(rows.filter(r=>who(r)===p),k,rate)));\n    const pct=percent(mlMatchStat(mine,k,rate),ref);\n    const cls=!Number.isFinite(pct)?'none':pct>=70?'good':pct>=40?'warn':'bad';\n    html+='\u003ctd class=\"mlm-'+cls+'\">'+(Number.isFinite(pct)?f(pct)+'%':'n.d.')+'\u003c/td>';\n   }\n  }\n  html+='\u003c/tr>';\n }\n html+='\u003c/tbody>\u003c/table>\u003cdiv class=\"mlm-foot\">Tot. = volume complessivo; /min = intensità relativa. I due indicatori sono confrontati separatamente con la media del ruolo.\u003c/div>\u003c/section>';\n html+=mlMatchTeamPage(rows,names,chosen,current,caption);\n for(let start=0;start\u003cchosen.length;start+=2){\n  const subset=chosen.slice(start,start+2);\n  html+='\u003csection class=\"sheet mlm-sheet\">\u003cdiv class=\"eyebrow\">METHODLAB / MATCH · CLASSIFICHE\u003c/div>\u003ch1>Chi ha fatto di più?\u003c/h1>\u003cdiv class=\"subtitle\">'+esc(caption)+'\u003c/div>';\n  for(const [k,label,unit] of subset)html+='\u003cdiv class=\"mlm-rankpair\">'+mlMatchRanking(rows,k,label,unit,false)+mlMatchRanking(rows,k,label,unit,true)+'\u003c/div>';\n  html+='\u003cdiv class=\"mlm-foot\">Totali e intensità per minuto dei giocatori nella partita analizzata.\u003c/div>\u003c/section>';\n }\n for(const n of names){\n  const mine=rows.filter(r=>who(r)===n),hist=mlMatchHistory(n,current);\n  html+='\u003csection class=\"sheet mlm-sheet mlm-player\">\u003cdiv class=\"eyebrow\">METHODLAB / MATCH · MODELLO INDIVIDUALE\u003c/div>\u003ch1>'+esc(n)+'\u003c/h1>\u003cdiv class=\"subtitle\">'+esc(caption)+' · '+f(sum(mine,'Minuti'))+' min · storico '+hist.length+'/5 partite &gt;60′\u003c/div>';\n  html+='\u003cdiv class=\"mlm-legend\">\u003cspan>\u003ci style=\"background:#2579b9\">\u003c/i>Partita\u003c/span>\u003cspan>\u003ci style=\"background:#d9a339\">\u003c/i>Media ultime 5\u003c/span>\u003cspan>\u003ci style=\"background:#32946c\">\u003c/i>Massimo ultime 5\u003c/span>\u003c/div>';\n  html+='\u003cdiv class=\"mlm-player-grid\">';\n  for(const [k,label,unit] of chosen){\n   const vals=hist.map(r=>val(r[k])).filter(Number.isFinite);\n   const rates=hist.map(r=>mlMatchStat([r],k,true)).filter(Number.isFinite);\n   const total=mlMatchStat(mine,k,false),relative=mlMatchStat(mine,k,true);\n   const render=(actual,historyValues,suffix)=>{const av=mean(historyValues),mx=historyValues.length?Math.max(...historyValues):NaN;\n    const maximum=Math.max(1,actual||0,av||0,mx||0);\n    return '\u003cdiv class=\"mlm-mini\">\u003cdiv class=\"mlm-mini-label\">'+suffix+'\u003c/div>'+[\n     ['Partita',actual,'#2579b9'],['Media',av,'#d9a339'],['Massimo',mx,'#32946c']\n    ].map(([title,v,color])=>'\u003cdiv class=\"mlm-mini-row\">\u003cspan>'+title+'\u003c/span>\u003cdiv class=\"mlm-rail\">\u003ci style=\"width:'+(Number.isFinite(v)?Math.max(0,Math.min(100,v/maximum*100)):0)+'%;background:'+color+'\">\u003c/i>\u003c/div>\u003cb>'+(Number.isFinite(v)?f(v):'n.d.')+'\u003c/b>\u003c/div>').join('')+'\u003c/div>';\n   };\n   html+='\u003cdiv class=\"mlm-parameter\">\u003ch3>'+esc(label)+'\u003c/h3>\u003cdiv class=\"mlm-dual\">'+render(total,vals,unit+' · totale')+render(relative,rates,unit+'/min')+'\u003c/div>\u003c/div>';\n  }\n  html+='\u003c/div>'+mlWcsCharts(n,current,chosen)+'\u003cdiv class=\"mlm-foot\">Modelli calcolati sulle ultime cinque partite disponibili oltre 60′, esclusa quella analizzata. Per i valori al minuto ogni partita storica è normalizzata sul proprio minutaggio.\u003c/div>\u003c/section>';\n }\n return html;\n}\n\nfunction mlTrainingActivityComment(kind,chosen){\n const week=E('mlPdfWeek')?.value||E('monWeek')?.value;\n const day=kind==='daily'?E('mlPdfDay')?.value:null;\n const links=mlPdfLinksFor(week,day);\n if(!links.length)return '\u003cp class=\"mlm-note\">Esercitazioni e serie: nessuna associazione disponibile per il periodo selezionato.\u003c/p>';\n let html='\u003ch2>Commento esercitazioni e serie\u003c/h2>\u003cdiv class=\"mlm-training-comments\">';\n for(const link of links){\n  const {er,sr}=mlPdfDataForLink(link);\n  const title=esc((kind==='weekly'?link.day+' · ':'')+link.name);\n  html+='\u003cdiv class=\"mlm-training-comment\">\u003cstrong>'+title+'\u003c/strong>';\n  if(!er.length)html+='\u003cp>Dati esercitazione non disponibili: impossibile valutare l’intensità.\u003c/p>';\n  else{\n   const notes=[];\n   for(const [k,label,unit] of chosen){\n    const players=[...new Set(er.map(who).filter(Boolean))];\n    const ratios=players.map(n=>{const r=er.filter(x=>who(x)===n),mins=sum(r,'Minuti'),ref=model(n,k).v;return mins>0&&ref>0?100*(sum(r,k)/mins/ref-1):NaN}).filter(Number.isFinite);\n    if(ratios.length)notes.push({label,delta:mean(ratios),count:ratios.length});\n   }\n   if(notes.length){\n    const ordered=[...notes].sort((a,b)=>b.delta-a.delta),best=ordered[0],worst=ordered[ordered.length-1];\n    const fmt=x=>(x>=0?'+':'')+f(x)+'%';\n    html+='\u003cp>Intensità relativa rispetto al modello gara: maggiore scostamento '+esc(best.label)+' ('+fmt(best.delta)+'); minore '+esc(worst.label)+' ('+fmt(worst.delta)+'). Confronti basati sui giocatori con dati validi.\u003c/p>';\n   }else html+='\u003cp>Parametri o minutaggi insufficienti per confrontare l’esercitazione con il modello gara.\u003c/p>';\n  }\n  const ids=[...new Set(sr.map(r=>String(r.Serie||r.Ordine||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));\n  if(ids.length\u003c2)html+='\u003cp>Serie: '+(ids.length?'una sola serie disponibile, decremento non calcolabile.':'nessun dato serie associato.')+'\u003c/p>';\n  else{\n   const deltas=[];\n   for(const [k,label] of chosen){\n    const rates=ids.map(id=>{const group=sr.filter(r=>String(r.Serie||r.Ordine||'').trim()===id),minutes=sum(group,'Minuti');return minutes>0?sum(group,k)/minutes:NaN});\n    for(let i=1;i\u003crates.length;i++)if(Number.isFinite(rates[i])&&rates[i-1]>0)deltas.push({label,from:ids[i-1],to:ids[i],pct:100*(rates[i]/rates[i-1]-1)});\n   }\n   if(deltas.length){\n    const lowest=[...deltas].sort((a,b)=>a.pct-b.pct)[0];\n    html+='\u003cp>Serie separate: '+ids.length+' serie; variazione più negativa '+esc(lowest.label)+' tra serie '+esc(lowest.from)+' e '+esc(lowest.to)+' ('+(lowest.pct>0?'+':'')+f(lowest.pct)+'%). Variazioni calcolate sui valori relativi/min.\u003c/p>';\n   }else html+='\u003cp>Serie: '+ids.length+' disponibili, ma minutaggi o valori insufficienti per calcolare il decremento.\u003c/p>';\n  }\n  html+='\u003c/div>';\n }\n return html+'\u003c/div>';\n}\nfunction mlTrainingOpening(kind,rows,caption,chosen){\n const names=[...new Set(rows.map(who).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));\n const previousWeeks=[...new Set(state.monitoring.week.map(r=>String(r.Settimana||'')))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));\n const currentWeek=E('mlPdfWeek').value||E('monWeek').value;\n const index=previousWeeks.indexOf(currentWeek);\n const priorWeeks=index>=0?previousWeeks.slice(Math.max(0,index-5),index):[];\n function reference(n,k){\n  if(kind==='daily'){\n   const m=model(n,k);\n   return Number.isFinite(m.v)&&m.v>0?m.v*90:NaN;\n  }\n  return mean(priorWeeks.map(w=>sum(state.monitoring.week.filter(r=>who(r)===n&&String(r.Settimana||'')===w),k)));\n }\n function observations(n){\n  const mine=rows.filter(r=>who(r)===n),minutes=sum(mine,'Minuti');\n  const metrics=chosen.map(([k,label])=>{\n   const total=sum(mine,k),ref=reference(n,k),pct=ref>0?100*(total/ref-1):NaN;\n   return {label,pct};\n  }).filter(x=>Number.isFinite(x.pct));\n  const positive=metrics.filter(x=>x.pct>=0).length;\n  const top=[...metrics].sort((a,b)=>b.pct-a.pct)[0];\n  const low=[...metrics].sort((a,b)=>a.pct-b.pct)[0];\n  const fmt=x=>(x>=0?'+':'')+f(x)+'%';\n  return {minutes,metrics,positive,top,low,fmt};\n }\n const per=names.map(n=>({n,...observations(n)}));\n let html='\u003csection class=\"sheet mlm-sheet mlm-opening\">\u003cdiv class=\"eyebrow\">METHODLAB / TRAINING · LETTURA INIZIALE\u003c/div>\u003ch1>Sintesi squadra e giocatori\u003c/h1>\u003cdiv class=\"subtitle\">'+esc(caption)+'\u003c/div>\u003ch2>Quadro squadra\u003c/h2>';\n const metrics=chosen.map(([k,label])=>{\n  const changes=per.map(x=>x.metrics.find(y=>y.label===label)?.pct).filter(Number.isFinite);\n  return {label,avg:mean(changes),count:changes.length};\n });\n html+='\u003cp class=\"mlm-note\">Confronto sui volumi totali. '+(kind==='daily'?'Riferimento: modello partita individuale proiettato su 90 minuti.':'Riferimento: media delle settimane precedenti disponibili (fino a cinque).')+' I valori mancanti non sono stimati.\u003c/p>';\n html+='\u003cdiv class=\"mlm-opening-metrics\">'+metrics.map(x=>'\u003cdiv class=\"mlm-opening-metric\">\u003cspan>'+esc(x.label)+'\u003c/span>\u003cstrong style=\"color:'+(x.avg>=0?'#207a63':'#bd504c')+'\">'+(Number.isFinite(x.avg)?(x.avg>=0?'+':'')+f(x.avg)+'%':'n.d.')+'\u003c/strong>\u003csmall>'+x.count+' giocatori confrontabili\u003c/small>\u003c/div>').join('')+'\u003c/div>';\n html+='\u003ch2>Quadro individuale\u003c/h2>\u003cdiv class=\"mlm-opening-players\">';\n for(const x of per){\n  html+='\u003cdiv class=\"mlm-opening-player\">\u003cstrong>'+esc(x.n)+'\u003c/strong>\u003cspan>'+f(x.minutes)+' min · '+x.positive+'/'+x.metrics.length+' parametri ≥ riferimento\u003c/span>\u003csmall>Maggiore scostamento positivo: '+(x.top?esc(x.top.label)+' '+x.fmt(x.top.pct):'n.d.')+'\u003c/small>\u003csmall>Minore scostamento: '+(x.low?esc(x.low.label)+' '+x.fmt(x.low.pct):'n.d.')+'\u003c/small>\u003c/div>';\n }\n html+='\u003c/div>'+mlTrainingActivityComment(kind,chosen)+'\u003cdiv class=\"mlm-foot\">Le percentuali di squadra rappresentano la media degli scostamenti individuali disponibili, non il rapporto tra le somme. Analisi descrittiva dei soli dati GPS.\u003c/div>\u003c/section>';\n return html;\n}\n/* STEP 7P — TRAINING sintetico: tabelle squadra, rapporti MATCH, esercitazioni e serie. */\nfunction mlDailyTable(title,caption,head,body,note){\n return '\u003csection class=\"sheet mld-sheet\">\u003cdiv class=\"eyebrow\">METHODLAB / TRAINING SINTETICO\u003c/div>\u003ch1>'+esc(title)+'\u003c/h1>\u003cdiv class=\"subtitle\">'+esc(caption)+'\u003c/div>\u003ctable class=\"mld-table\">\u003cthead>'+head+'\u003c/thead>\u003ctbody>'+body+'\u003c/tbody>\u003c/table>\u003cp class=\"mld-note\">'+note+'\u003c/p>\u003c/section>';\n}\nfunction mlDailyCell(v,reference,asPercent){\n const ratio=percent(v,reference),cls=!Number.isFinite(ratio)?'na':ratio>=70?'green':ratio>=40?'yellow':'red';\n return '\u003ctd class=\"mld-'+cls+'\">'+(asPercent?(Number.isFinite(ratio)?f(ratio)+'%':'n.d.'):(Number.isFinite(v)?f(v):'n.d.'))+'\u003c/td>';\n}\nfunction mlDailyTables(rows,caption,chosen){\n const names=[...new Set(rows.map(who).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));\n const byName=n=>rows.filter(r=>who(r)===n);\n const roleOf=n=>String(byName(n)[0]?.Ruolo||byName(n)[0]?.Posizione||'').trim().toLocaleLowerCase('it')||'non indicato';\n const groups=new Map();for(const n of names){const role=roleOf(n);if(!groups.has(role))groups.set(role,[]);groups.get(role).push(n)}\n const headers=(withMin,withSerie)=>'\u003ctr>\u003cth>Giocatore\u003c/th>'+(withSerie?'\u003cth>Serie\u003c/th>':'')+'\u003cth>Ruolo\u003c/th>'+(withMin?'\u003cth>Min.\u003c/th>':'')+chosen.map(([,label,unit])=>'\u003cth>'+esc(label)+'\u003csmall> '+esc(unit||'')+'\u003c/small>\u003c/th>').join('')+'\u003c/tr>';\n const rowParts=[];\n for(const n of names){\n  const mine=byName(n),role=roleOf(n);\n  let row='\u003ctr>\u003ctd>'+esc(n)+'\u003c/td>\u003ctd>'+esc(role)+'\u003c/td>\u003ctd>'+f(sum(mine,'Minuti'))+'\u003c/td>';\n  for(const [k] of chosen){const ref=mean(groups.get(role).map(x=>sum(byName(x),k)));row+=mlDailyCell(sum(mine,k),ref,false)}\n  rowParts.push(row+'\u003c/tr>');\n }\n let html=mlDailyTable('Dati squadra · tutti i parametri',caption,headers(true,false),rowParts.join(''),'Valori totali. Colore rispetto alla media del ruolo nella giornata: verde ≥70%, giallo 40–69,9%, rosso \u003c40%.');\n let ratioRows='';\n for(const n of names){\n  ratioRows+='\u003ctr>\u003ctd>'+esc(n)+'\u003c/td>\u003ctd>'+esc(roleOf(n))+'\u003c/td>';\n  for(const [k] of chosen){const m=model(n,k),ref=Number.isFinite(m.v)?m.v*90:NaN;ratioRows+=mlDailyCell(sum(byName(n),k),ref,true)}\n  ratioRows+='\u003c/tr>';\n }\n html+=mlDailyTable('Rapporto TRAINING / MATCH · tutti i parametri',caption,headers(false,false),ratioRows,'Rapporto rispetto al modello gara individuale di 90 minuti; n.d. = modello non disponibile.');\n const week=E('mlPdfWeek')?.value,day=E('mlPdfDay')?.value,links=mlPdfLinksFor(week,day);\n if(!links.length)return html+mlDailyTable('Esercitazioni e serie',caption,'\u003ctr>\u003cth>Stato\u003c/th>\u003c/tr>','\u003ctr>\u003ctd>Nessuna esercitazione associata alla giornata.\u003c/td>\u003c/tr>','Le associazioni vengono definite nella sezione TRAINING.');\n for(const link of links){\n  const {er,sr}=mlPdfDataForLink(link);\n  // Un'associazione può contenere soltanto DATI SERIE: in quel caso\n  // ricostruiamo l'esercitazione sommando le serie collegate, senza\n  // sommarle nuovamente quando è già presente DATI ESERCITAZIONI.\n  const exerciseSource=er.length?er:sr;\n  const sourceLabel=er.length?'DATI ESERCITAZIONI':'somma delle serie collegate (DATI SERIE)';\n  if(exerciseSource.length){\n   let exRows='';\n   const exerciseNames=[...new Set(exerciseSource.map(who).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));\n   for(const n of exerciseNames){\n    const part=exerciseSource.filter(r=>who(r)===n);\n    const mins=sum(part,'Minuti');\n    const role=roleOf(n)==='non indicato'?String(part[0]?.Ruolo||part[0]?.Posizione||'non indicato'):roleOf(n);\n    exRows+='\u003ctr>\u003ctd>'+esc(n)+'\u003c/td>\u003ctd>'+esc(role)+'\u003c/td>\u003ctd>'+f(mins)+'\u003c/td>'+chosen.map(([k])=>{\n     const ref=model(n,k).v;\n     const total=sum(part,k);\n     const delta=mins>0&&Number.isFinite(ref)&&ref>0?100*((total/mins)/ref-1):NaN;\n     const color=!Number.isFinite(delta)?'na':delta>=0?'green':'red';\n     return '\u003ctd class=\"mld-'+color+'\">'+(Number.isFinite(delta)?(delta>=0?'+':'')+f(delta)+'%':'n.d.')+'\u003c/td>';\n    }).join('')+'\u003c/tr>';\n   }\n   html+=mlDailyTable('Esercitazione / MATCH · '+link.name,caption,headers(true,false),exRows,'Scostamento % dell’intensità al minuto di ogni giocatore rispetto al SUO modello partita individuale al minuto. Fonte: '+sourceLabel+'. Verde ≥0%; rosso \u003c0%; n.d. senza riferimento valido.');\n  }else{\n   html+=mlDailyTable('Esercitazione / MATCH · '+link.name,caption,'\u003ctr>\u003cth>Stato\u003c/th>\u003c/tr>','\u003ctr>\u003ctd>Nessun dato GPS di esercitazione o serie associato. Verifica i dati importati e il nome dell’associazione.\u003c/td>\u003c/tr>','La tabella viene visualizzata anche quando mancano dati, per rendere evidente il problema.');\n  }\n  if(sr.length){\n   const ids=[...new Set(sr.map(r=>String(r.Serie||r.Ordine||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));\n   let seriesHtml='\u003csection class=\"sheet mld-sheet mld-series\">\u003cdiv class=\"eyebrow\">METHODLAB / TRAINING SINTETICO\u003c/div>\u003ch1>Serie · '+esc(link.name)+'\u003c/h1>\u003cdiv class=\"subtitle\">'+esc(caption)+'\u003c/div>\u003cp class=\"mld-note\">Ogni grafico confronta le serie consecutive per giocatore. Le barre rappresentano il valore GPS al minuto; la percentuale indica la variazione rispetto alla serie precedente (rosso = decremento, verde = incremento).\u003c/p>';\n   const activeNames=names.filter(n=>sr.some(r=>who(r)===n));\n   for(const n of activeNames){\n    seriesHtml+='\u003cdiv class=\"mld-series-player\">\u003ch2>'+esc(n)+'\u003c/h2>\u003cdiv class=\"mld-series-metrics\">';\n    for(const [k,label,unit] of chosen){\n     const points=ids.map(id=>{const part=sr.filter(r=>who(r)===n&&String(r.Serie||r.Ordine||'').trim()===id),mins=sum(part,'Minuti');return {id,v:part.length&&mins>0?sum(part,k)/mins:NaN}});\n     const maximum=Math.max(1,...points.map(x=>Number.isFinite(x.v)?x.v:0));\n     seriesHtml+='\u003cdiv class=\"mld-series-metric\">\u003ch3>'+esc(label)+' \u003csmall>'+esc(unit)+'/min\u003c/small>\u003c/h3>\u003cdiv class=\"mld-series-bars\">';\n     points.forEach((x,i)=>{\n      const previous=i?points[i-1].v:NaN,change=Number.isFinite(previous)&&previous>0&&Number.isFinite(x.v)?(x.v/previous-1)*100:NaN;\n      const color=!Number.isFinite(change)?'#64798a':change\u003c0?'#b93e3a':'#19805d';\n      seriesHtml+='\u003cdiv class=\"mld-series-item\">\u003cdiv class=\"mld-series-value\">'+(Number.isFinite(x.v)?f(x.v):'—')+'\u003c/div>\u003cdiv class=\"mld-series-track\">\u003ci style=\"height:'+(Number.isFinite(x.v)?Math.max(2,100*x.v/maximum):0)+'%\">\u003c/i>\u003c/div>\u003cdiv class=\"mld-series-id\">S'+esc(x.id)+'\u003c/div>\u003c .day===day&&mlPdfNorm(x.name)===mlPdfNorm(name)));\n try{localStorage.setItem(mlPdfLinkStore,JSON.stringify(links));E('mlPdfLinkStatus').textContent='Associazione «'+name+'» rimossa dalla giornata '+day+'.'}catch(_){E('mlPdfLinkStatus').textContent='Rimozione non riuscita.'}\n mlPdfLinkRender();\n}\nfunction mlPdfLinkRemove(){\n const week=E('mlPdfWeek')?.value,day=E('mlPdfDay')?.value;\n const picked=[...document.querySelectorAll('#mlPdfMultiExercises input:checked')].map(x=>x.value);\n const names=picked.length?picked:[E('mlPdfExercise')?.value].filter(Boolean);\n if(!names.length){E('mlPdfLinkStatus').textContent='Seleziona le esercitazioni da rimuovere oppure usa il pulsante Rimuovi accanto a ciascuna associazione.';return}\n const links=mlPdfLinks().filter(x=>!(x.week===week&&x.day===day&&names.some(n=>mlPdfNorm(n)===mlPdfNorm(x.name))));\n try{localStorage.setItem(mlPdfLinkStore,JSON.stringify(links));E('mlPdfLinkStatus').textContent='Rimosse '+names.length+' associazioni selezionate.'}catch(_){E('mlPdfLinkStatus').textContent='Rimozione non riuscita.'}\n mlPdfLinkRender();\n}\n\nfunction mlPdfLinkRender(){\n const week=E('mlPdfWeek')?.value,day=E('mlPdfDay')?.value,name=E('mlPdfExercise')?.value;\n const links=mlPdfLinks(),current=links.find(x=>x.week===week&&x.day===day&&mlPdfNorm(x.name)===mlPdfNorm(name));\n const multi=E('mlPdfMultiExercises');\n if(multi){\n  const previous=[...multi.querySelectorAll('input:checked')].map(x=>x.value);\n  const names=[...new Set([...state.monitoring.exercise,...state.monitoring.series].map(mlPdfExerciseName).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));\n  multi.replaceChildren();\n  for(const item of names){\n   const label=document.createElement('label');label.style.cssText='display:flex;gap:6px;align-items:center;font-size:12px';\n   const box=document.createElement('input');box.type='checkbox';box.value=item;\n   box.checked=links.some(x=>x.week===week&&x.day===day&&mlPdfNorm(x.name)===mlPdfNo
